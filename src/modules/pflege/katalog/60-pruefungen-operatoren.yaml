# Operatoren = fachneutrales Konzept: Arbeitsanweisungen in Aufgaben mit
# Anforderungsbereich (AFB I Reproduktion, II Reorganisation/Transfer, III Reflexion/Problemlösung).
# Der Arbeitsauftragsmodus erkennt den Operator und wählt Antwortform und Umfang.
operators:
  - { id: op.nennen,       name: "nennen",        afb: 1, expects: "Begriffe oder Fakten ohne Erläuterung aufzählen." }
  - { id: op.benennen,     name: "benennen",      afb: 1, expects: "Sachverhalte mit dem korrekten Fachbegriff bezeichnen." }
  - { id: op.definieren,   name: "definieren",    afb: 1, expects: "Begriff präzise mit Oberbegriff und Merkmalen bestimmen." }
  - { id: op.beschreiben,  name: "beschreiben",   afb: 1, expects: "Sachverhalt in eigenen Worten strukturiert wiedergeben, ohne Bewertung." }
  - { id: op.darstellen,   name: "darstellen",    afb: 2, expects: "Zusammenhänge strukturiert, ggf. grafisch, aufzeigen." }
  - { id: op.erklaeren,    name: "erklären",      afb: 2, expects: "Sachverhalt auf Ursachen, Gesetzmäßigkeiten oder Regeln zurückführen." }
  - { id: op.erlaeutern,   name: "erläutern",     afb: 2, expects: "Wie erklären, zusätzlich mit Beispielen oder Belegen veranschaulichen." }
  - { id: op.ableiten,     name: "ableiten",      afb: 2, expects: "Aus Informationen (z. B. Fallbeschreibung) sachgerechte Folgerungen ziehen." }
  - { id: op.zuordnen,     name: "zuordnen",      afb: 2, expects: "Sachverhalte begründet in einen Zusammenhang oder eine Kategorie stellen." }
  - { id: op.vergleichen,  name: "vergleichen",   afb: 2, expects: "Gemeinsamkeiten und Unterschiede kriteriengeleitet herausarbeiten." }
  - { id: op.berechnen,    name: "berechnen",     afb: 2, expects: "Ergebnis vom Ansatz aus durch Rechenschritte gewinnen und den Rechenweg mit Einheiten darstellen." }
  - { id: op.planen,       name: "planen",        afb: 2, expects: "Vorgehen (z. B. Maßnahmen) zielgerichtet und vollständig entwerfen." }
  - { id: op.begruenden,   name: "begründen",     afb: 3, expects: "Aussage oder Maßnahme durch fachliche Argumente stützen." }
  - { id: op.analysieren,  name: "analysieren",   afb: 3, expects: "Situation kriteriengeleitet in Bestandteile zerlegen und Zusammenhänge herausarbeiten." }
  - { id: op.beurteilen,   name: "beurteilen",    afb: 3, expects: "Zu einem Sachverhalt ein begründetes Sachurteil fällen." }
  - { id: op.bewerten,     name: "bewerten",      afb: 3, expects: "Wie beurteilen, zusätzlich mit offengelegten Wertmaßstäben (z. B. ethischen Prinzipien)." }
  - { id: op.reflektieren, name: "reflektieren", afb: 3, expects: "Eigenes Handeln oder Erleben kriteriengeleitet überdenken und Konsequenzen ableiten." }
  - { id: op.evaluieren,   name: "evaluieren",    afb: 3, expects: "Zielerreichung anhand der festgelegten Kriterien überprüfen und Anpassungen ableiten." }

# Prüfungsformate = Vorlagen für Exam-Objekte. Der Nutzer legt konkrete Prüfungen
# (Exam: name, date, subjectIds, topicIds) an und wählt dabei ein Format.
# Zwischenprüfung und staatliche Prüfung geprüft am 2026-10-25 gegen §§ 7, 14-16 PflAPrV.
# "teile" zerlegt einen Prüfungsteil in seine Bestandteile mit eigenem Kompetenzbezug,
# damit der Planer z. B. für jede Aufsichtsarbeit die passenden Themen ziehen kann.
examFormats:
  - id: pruefung.klausur
    name: Schulische Klausur / Leistungsnachweis
    kind: schriftlich
    details: Umfang und Themen legt die Pflegeschule fest; Themen und Dauer beim Anlegen eintragen.

  - id: pruefung.zwischen
    name: Zwischenprüfung (Ende des 2. Ausbildungsdrittels)
    kind: gemischt
    referenceIds: [norm.pflaprv]
    pruefstatus: geprueft
    details: "Ermittelt den Ausbildungsstand zum Ende des zweiten Ausbildungsdrittels anhand der Kompetenzen aus Anlage 1 für das erste und zweite Drittel (§ 7 PflAPrV). Die Ausbildung wird unabhängig vom Ergebnis fortgesetzt; ist das Ausbildungsziel gefährdet, prüfen Träger und Schule mit der auszubildenden Person geeignete Maßnahmen. Das Nähere regeln die Länder."

  - id: pruefung.staatlich.schriftlich
    name: Staatliche Prüfung – schriftlicher Teil
    kind: schriftlich
    referenceIds: [norm.pflaprv]
    pruefstatus: geprueft
    durationMinutes: 120
    count: 3
    competencyIds: [kb.I, kb.II, kb.III, kb.IV, kb.V]
    taskFormatIds: [format.fallbearbeitung]
    details: "Drei fallbezogene Aufsichtsarbeiten zu je 120 Minuten, in der Regel an drei aufeinanderfolgenden Werktagen (§ 14 PflAPrV). Die Fallsituationen unterscheiden sich über die drei Arbeiten, z. B. nach Altersstufe, sozialem und kulturellem Umfeld und Versorgungsbereich."
    teile:
      - code: "1"
        name: Pflegeprozessgestaltung in akuten und dauerhaften Pflegesituationen
        competencyIds: [kb.I.1, kb.II.1, kb.I.5, kb.I.6, kb.IV]
        details: "Interaktion und Beziehungsgestaltung, lebensweltliche Aspekte, Unterstützung bei der Lebensgestaltung, Autonomieerhalt und Entwicklungsförderung; ausgewählte Kontextbedingungen aus Kompetenzbereich IV einbeziehen."
      - code: "2"
        name: Pflegeprozessgestaltung bei gesundheitlichen Problemlagen
        competencyIds: [kb.I.2, kb.II.2, kb.V.1]
        details: "Gesundheitsförderung, Prävention und Beratung; Handlungsentscheidungen mit pflegewissenschaftlichem Begründungswissen belegen."
      - code: "3"
        name: Pflegeprozesssteuerung in kritischen und krisenhaften Situationen
        competencyIds: [kb.I.3, kb.I.4, kb.III.2, kb.II.3]
        details: "Krisenbewältigung, eigenständige Durchführung ärztlicher Anordnungen und ethische Entscheidungsprozesse."

  - id: pruefung.staatlich.muendlich
    name: Staatliche Prüfung – mündlicher Teil
    kind: muendlich
    referenceIds: [norm.pflaprv]
    pruefstatus: geprueft
    durationMinutes: 45
    competencyIds: [kb.III, kb.IV, kb.V]
    taskFormatIds: [format.fallbearbeitung]
    details: "Komplexe Fallsituation aus einem anderen Versorgungskontext und mit einer anderen Altersstufe als im praktischen Teil (§ 15 PflAPrV). Schwerpunkt: eigene Berufsrolle, berufliches Selbstverständnis und Einfluss von Team-, Einrichtungs- und gesellschaftlichen Kontextbedingungen. Einzeln oder zu zweit, mindestens 30 und höchstens 45 Minuten je Person, angemessene Vorbereitungszeit unter Aufsicht; zwei Fachprüfende."

  - id: pruefung.staatlich.praktisch
    name: Staatliche Prüfung – praktischer Teil
    kind: praktisch
    referenceIds: [norm.pflaprv]
    pruefstatus: geprueft
    durationMinutes: 240
    competencyIds: [kb.I, kb.II, kb.III, kb.IV, kb.V]
    taskFormatIds: [format.pflegeplanung, format.sis, format.sbar]
    details: "Selbständige, umfassende und prozessorientierte Pflege von mindestens zwei Menschen, davon einer mit erhöhtem Pflegebedarf, in realen und komplexen Pflegesituationen; die Aufgabe berücksichtigt den Versorgungsbereich des Vertiefungseinsatzes (§ 16 PflAPrV). Ohne Vorbereitungsteil höchstens 240 Minuten einschließlich Reflexionsgespräch, organisatorische Unterbrechung von höchstens einem Werktag möglich. Wesentlich sind die vorbehaltenen Tätigkeiten nach § 4 PflBG."
    teile:
      - { code: V, name: "Vorbereitungsteil: schriftlicher oder elektronischer Pflegeplan", details: "Angemessene Vorbereitungszeit unter Aufsicht." }
      - { code: F, name: Fallvorstellung, durationMinutes: 20, details: "Höchstens 20 Minuten." }
      - { code: D, name: Durchführung der geplanten und situativ erforderlichen Pflegemaßnahmen }
      - { code: R, name: Reflexionsgespräch, durationMinutes: 20, details: "Höchstens 20 Minuten." }
