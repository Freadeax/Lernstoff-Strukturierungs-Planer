# Glossar, Teil 6: Pflegeprozess, Pflegemodelle, Qualität, Recht, Kommunikation und Ethik
# (Format wie 70-glossar.yaml). Rechtsangaben sind ungeprüft bis zum Abgleich mit dem Gesetzestext.

glossary:
  # --- Pflegeprozess und Dokumentation ---
  - { id: gl.pflegeanamnese, term: "Pflegeanamnese", topicIds: [thema.pp.anamnese], definition: "Erste systematische Informationssammlung über die pflegebedürftige Person, ihre Situation, Probleme, Ressourcen und Wünsche." }
  - { id: gl.informationssammlung, term: "Informationssammlung", topicIds: [thema.pp.anamnese], definition: "Erster Schritt des Pflegeprozesses, in dem Daten durch Gespräch, Beobachtung, Messung und Dokumente erhoben werden." }
  - { id: gl.subjektive-daten, term: "Subjektive Daten", topicIds: [thema.pp.anamnese], definition: "Angaben der betroffenen Person selbst, z. B. zu Schmerz oder Befinden." }
  - { id: gl.objektive-daten, term: "Objektive Daten", topicIds: [thema.pp.anamnese], definition: "Messbare oder beobachtbare Befunde, z. B. Vitalwerte oder Wundgröße." }
  - { id: gl.fremdanamnese, term: "Fremdanamnese", topicIds: [thema.pp.anamnese], definition: "Informationssammlung über Angehörige, Bezugspersonen oder andere Berufsgruppen, wenn die Person selbst keine Auskunft geben kann." }
  - { id: gl.pflegeproblem, term: "Pflegeproblem", topicIds: [thema.pp.diagnosen], definition: "Beeinträchtigung einer Person in einer Lebensaktivität, bei der sie pflegerische Unterstützung braucht; aktuell, potenziell (Risiko) oder verdeckt." }
  - { id: gl.potenzielles-problem, term: "Potenzielles Pflegeproblem", topicIds: [thema.pp.diagnosen], definition: "Problem, das noch nicht besteht, aber aufgrund von Risikofaktoren droht, z. B. Dekubitusgefahr.", synonyms: [Risikodiagnose] }
  - { id: gl.nanda, term: "NANDA International", abbreviation: "NANDA-I", topicIds: [thema.pp.diagnosen], definition: "Internationale Organisation und Klassifikation standardisierter Pflegediagnosen." }
  - { id: gl.pflegeziel, term: "Pflegeziel", topicIds: [thema.pp.ziele], definition: "Erwünschter, überprüfbarer Zustand der pflegebedürftigen Person, der durch Pflegemaßnahmen erreicht werden soll; Nah- oder Fernziel." }
  - { id: gl.nahziel, term: "Nahziel", topicIds: [thema.pp.ziele], definition: "Pflegeziel, das in kurzer Zeit erreicht werden soll und als Etappe zum Fernziel dient." }
  - { id: gl.fernziel, term: "Fernziel", topicIds: [thema.pp.ziele], definition: "Übergeordnetes Pflegeziel, das über einen längeren Zeitraum erreicht werden soll." }
  - { id: gl.pflegemassnahme, term: "Pflegemaßnahme", topicIds: [thema.pp.massnahmen], definition: "Konkret geplante pflegerische Handlung, beschrieben mit Was, Wie, Wann, Wie oft, Wer und Womit.", synonyms: [Pflegeintervention] }
  - { id: gl.pflegeplanung, term: "Pflegeplanung", topicIds: [thema.pp.massnahmen, thema.pp.prozess], definition: "Schriftliche Festlegung von Pflegeproblemen, Ressourcen, Zielen und Maßnahmen als Grundlage für eine einheitliche Pflege." }
  - { id: gl.pflegebericht, term: "Pflegebericht", topicIds: [thema.pp.evaluation, thema.pp.sis], definition: "Fortlaufende Dokumentation von Beobachtungen, Veränderungen und Abweichungen von der Pflegeplanung.", synonyms: [Berichteblatt] }
  - { id: gl.pflegedokumentation, term: "Pflegedokumentation", topicIds: [thema.pp.prozess, thema.re.haftung], definition: "Schriftliche oder elektronische Aufzeichnung aller pflegerelevanten Informationen; dient Kommunikation, Qualitätssicherung und rechtlicher Absicherung." }
  - { id: gl.themenfelder-sis, term: "Themenfelder der SIS", topicIds: [thema.pp.sis], definition: "Sechs Bereiche der strukturierten Informationssammlung: Kognition und Kommunikation, Mobilität und Beweglichkeit, krankheitsbezogene Anforderungen, Selbstversorgung, Leben in sozialen Beziehungen sowie Haushaltsführung bzw. Wohnen/Häuslichkeit." }
  - { id: gl.risikomatrix, term: "Risikomatrix", topicIds: [thema.pp.sis], definition: "Teil der SIS, in dem pflegesensitive Risiken wie Dekubitus, Sturz, Inkontinenz, Schmerz und Ernährung eingeschätzt werden." }
  - { id: gl.entlassmanagement, term: "Entlassmanagement", topicIds: [thema.pp.uebergabe, thema.qw.expertenstandards, thema.re.sgb5], definition: "Strukturierte Vorbereitung der Entlassung aus dem Krankenhaus, damit die Anschlussversorgung lückenlos gesichert ist." }
  - { id: gl.uebergabe, term: "Dienstübergabe", topicIds: [thema.pp.uebergabe], definition: "Weitergabe aller wichtigen Informationen zu Patientinnen und Patienten beim Schichtwechsel, möglichst strukturiert und am Bett." }
  - { id: gl.isbar, term: "ISBAR", abbreviation: "ISBAR", topicIds: [thema.pp.uebergabe], definition: "Erweiterung des Übergabeschemas um Identifikation der eigenen Person und der betroffenen Person vor Situation, Background, Assessment und Recommendation." }
  - { id: gl.bezugspflege, term: "Bezugspflege", topicIds: [thema.pp.massnahmen], definition: "Organisationsform, bei der eine Pflegefachperson für eine Patientengruppe über den gesamten Aufenthalt verantwortlich ist.", synonyms: [Primary Nursing] }
  - { id: gl.funktionspflege, term: "Funktionspflege", topicIds: [thema.pp.massnahmen], definition: "Arbeitsorganisation, bei der Pflegende einzelne Tätigkeiten bei vielen Patientinnen und Patienten übernehmen." }
  - { id: gl.bereichspflege, term: "Bereichspflege", topicIds: [thema.pp.massnahmen], definition: "Arbeitsorganisation, bei der eine Pflegeperson alle Aufgaben für eine Patientengruppe während einer Schicht übernimmt.", synonyms: [Zimmerpflege] }
  - { id: gl.case-management, term: "Case Management", topicIds: [thema.re.versorgung, thema.fa.ambulant], definition: "Fallsteuerung, die Versorgungsleistungen für eine Person über Einrichtungen und Berufsgruppen hinweg koordiniert." }

  # --- Pflegemodelle und -theorien ---
  - { id: gl.pflegemodell, term: "Pflegemodell", topicIds: [thema.pp.modelle], definition: "Vereinfachte Darstellung pflegerischer Wirklichkeit, die Pflegehandeln strukturiert und begründet." }
  - { id: gl.pflegetheorie, term: "Pflegetheorie", topicIds: [thema.pp.modelle], definition: "System begründeter Aussagen über Phänomene der Pflege, ihre Zusammenhänge und Ziele." }
  - { id: gl.metaparadigma, term: "Metaparadigma der Pflege", topicIds: [thema.pp.modelle], definition: "Vier zentrale Konzepte der Pflegewissenschaft: Mensch, Umwelt, Gesundheit und Pflege." }
  - { id: gl.orem, term: "Selbstpflegedefizit-Theorie", topicIds: [thema.pp.modelle], definition: "Pflegetheorie nach Dorothea Orem: Pflege wird nötig, wenn der Selbstpflegebedarf die Selbstpflegefähigkeit eines Menschen übersteigt." }
  - { id: gl.henderson, term: "Bedürfnismodell nach Henderson", topicIds: [thema.pp.modelle], definition: "Modell von Virginia Henderson mit 14 Grundbedürfnissen; Pflege unterstützt dort, wo Kraft, Wille oder Wissen fehlen." }
  - { id: gl.roper, term: "Lebensaktivitätenmodell nach Roper, Logan und Tierney", topicIds: [thema.pp.modelle], definition: "Pflegemodell mit zwölf Lebensaktivitäten und einer Lebensspanne von Abhängigkeit bis Unabhängigkeit; Grundlage der ATL nach Juchli." }
  - { id: gl.peplau, term: "Theorie der zwischenmenschlichen Beziehungen", topicIds: [thema.pp.modelle, thema.kom.grundlagen], definition: "Pflegetheorie nach Hildegard Peplau, die Pflege als therapeutischen Beziehungsprozess mit den Phasen Orientierung, Identifikation, Nutzung und Ablösung beschreibt." }
  - { id: gl.benner, term: "Stufenmodell nach Benner", topicIds: [thema.pp.modelle], definition: "Modell der Kompetenzentwicklung von Pflegenden nach Patricia Benner in fünf Stufen: Neuling, fortgeschrittene Anfängerin, kompetent Pflegende, erfahrene und Pflegeexpertin." }
  - { id: gl.salutogenese, term: "Salutogenese", topicIds: [thema.pp.modelle, thema.kom.beratung], definition: "Modell nach Aaron Antonovsky, das fragt, was Menschen gesund erhält; zentral ist das Kohärenzgefühl aus Verstehbarkeit, Handhabbarkeit und Sinnhaftigkeit." }
  - { id: gl.resilienz, term: "Resilienz", topicIds: [thema.kom.selbstpflege, thema.pp.modelle], definition: "Psychische Widerstandsfähigkeit, Krisen zu bewältigen und an ihnen zu wachsen." }
  - { id: gl.coping, term: "Coping", topicIds: [thema.kom.selbstpflege, thema.kom.beratung], definition: "Bewältigungsstrategien, mit denen ein Mensch belastende Situationen oder Krankheit verarbeitet." }
  - { id: gl.empowerment, term: "Empowerment", topicIds: [thema.kom.beratung], definition: "Befähigung von Menschen, ihre Angelegenheiten selbstbestimmt zu gestalten und eigene Ressourcen zu nutzen." }
  - { id: gl.gesundheitsfoerderung, term: "Gesundheitsförderung", topicIds: [thema.kom.beratung], definition: "Prozess, Menschen zu mehr Selbstbestimmung über ihre Gesundheit zu befähigen und gesundheitsförderliche Lebenswelten zu schaffen (Ottawa-Charta)." }
  - { id: gl.praevention, term: "Prävention", topicIds: [thema.kom.beratung, thema.pro], definition: "Krankheitsvermeidung; primär (Entstehung verhindern), sekundär (Früherkennung) und tertiär (Folgen und Rückfälle verhindern).", synonyms: [Vorbeugung] }
  - { id: gl.rehabilitation, term: "Rehabilitation", topicIds: [thema.re.versorgung], definition: "Maßnahmen zur Wiederherstellung oder Verbesserung von Fähigkeiten und Teilhabe nach Krankheit oder Unfall." }
  - { id: gl.aktivierende-pflege, term: "Aktivierende Pflege", topicIds: [thema.pp.massnahmen, thema.kl.geriatrie], definition: "Pflege, die vorhandene Fähigkeiten nutzt und fördert, statt Tätigkeiten vollständig abzunehmen; Hilfe zur Selbsthilfe." }

  # --- Qualität und Wissenschaft ---
  - { id: gl.qualitaetsmanagement, term: "Qualitätsmanagement", abbreviation: "QM", topicIds: [thema.qw.qm], definition: "Alle Tätigkeiten zur Planung, Lenkung, Sicherung und Verbesserung der Qualität einer Einrichtung." }
  - { id: gl.pdca, term: "PDCA-Zyklus", abbreviation: "PDCA", topicIds: [thema.qw.qm], definition: "Kreislauf der kontinuierlichen Verbesserung: Plan, Do, Check, Act.", synonyms: [Deming-Kreis] }
  - { id: gl.donabedian, term: "Struktur-, Prozess- und Ergebnisqualität", topicIds: [thema.qw.qm, thema.qw.expertenstandards], definition: "Qualitätsdimensionen nach Avedis Donabedian: Rahmenbedingungen, Abläufe und erreichte Wirkung." }
  - { id: gl.pflegestandard, term: "Pflegestandard", topicIds: [thema.qw.qm], definition: "Einrichtungsinterne, verbindliche Festlegung, wie eine bestimmte Pflegetätigkeit durchgeführt wird." }
  - { id: gl.cirs, term: "Critical Incident Reporting System", abbreviation: "CIRS", topicIds: [thema.qw.qm], definition: "Anonymes Berichtssystem für kritische Ereignisse und Beinahe-Fehler, um aus ihnen zu lernen." }
  - { id: gl.beinahefehler, term: "Beinahe-Fehler", topicIds: [thema.qw.qm], definition: "Fehler, der rechtzeitig bemerkt wurde, bevor er der Patientin oder dem Patienten schaden konnte.", synonyms: [Near Miss] }
  - { id: gl.risikomanagement, term: "Klinisches Risikomanagement", topicIds: [thema.qw.qm], definition: "Systematisches Erkennen, Bewerten und Vermindern von Risiken für Patientinnen, Patienten und Mitarbeitende." }
  - { id: gl.dnqp, term: "Deutsches Netzwerk für Qualitätsentwicklung in der Pflege", abbreviation: "DNQP", topicIds: [thema.qw.expertenstandards], definition: "Netzwerk, das die nationalen Expertenstandards in der Pflege entwickelt und aktualisiert." }
  - { id: gl.qualitaetspruefung, term: "Qualitätsprüfung", topicIds: [thema.qw.qm, thema.re.sgb11], definition: "Regelmäßige Prüfung von Pflegeeinrichtungen durch den Medizinischen Dienst oder den Prüfdienst der privaten Krankenversicherung." }
  - { id: gl.ebn, term: "Evidence-based Nursing", abbreviation: "EBN", topicIds: [thema.qw.ebn], definition: "Pflege auf Grundlage der besten verfügbaren wissenschaftlichen Erkenntnisse, der Erfahrung der Pflegenden und der Wünsche der Betroffenen.", synonyms: [evidenzbasierte Pflege] }
  - { id: gl.evidenz, term: "Evidenz", topicIds: [thema.qw.ebn], definition: "Wissenschaftlicher Nachweis der Wirksamkeit einer Maßnahme, bewertet nach Evidenzstufen." }
  - { id: gl.studie-rct, term: "Randomisierte kontrollierte Studie", abbreviation: "RCT", topicIds: [thema.qw.ebn], definition: "Studie, in der Teilnehmende zufällig einer Interventions- oder Kontrollgruppe zugeteilt werden; hohe Evidenz für Wirksamkeit." }
  - { id: gl.review, term: "Systematische Übersichtsarbeit", topicIds: [thema.qw.ebn], definition: "Zusammenfassung aller Studien zu einer Fragestellung nach festgelegter Methode, ggf. mit Metaanalyse.", synonyms: [Systematic Review] }
  - { id: gl.pico, term: "PICO-Schema", abbreviation: "PICO", topicIds: [thema.qw.ebn], definition: "Struktur für klinische Fragestellungen: Population, Intervention, Comparison (Vergleich) und Outcome (Ergebnis)." }
  - { id: gl.leitlinie, term: "Leitlinie", topicIds: [thema.qw.ebn], definition: "Systematisch entwickelte Entscheidungshilfe für eine angemessene Versorgung; nach AWMF in den Stufen S1 bis S3." }
  - { id: gl.qualitative-forschung, term: "Qualitative Forschung", topicIds: [thema.qw.ebn], definition: "Forschung, die Erleben und Bedeutungen aus Sicht der Betroffenen untersucht, z. B. mit Interviews." }
  - { id: gl.quantitative-forschung, term: "Quantitative Forschung", topicIds: [thema.qw.ebn], definition: "Forschung, die Phänomene mit Zahlen misst und statistisch auswertet." }

  # --- Berufsrecht und Recht ---
  - { id: gl.pflbg, term: "Pflegeberufegesetz", abbreviation: "PflBG", topicIds: [thema.re.berufsrecht], definition: "Bundesgesetz über die Pflegeberufe mit der generalistischen Ausbildung zur Pflegefachfrau bzw. zum Pflegefachmann, gültig seit 2020." }
  - { id: gl.pflaprv, term: "Pflegeberufe-Ausbildungs- und Prüfungsverordnung", abbreviation: "PflAPrV", topicIds: [thema.re.berufsrecht], definition: "Verordnung zum PflBG, die Inhalte, Umfang und Prüfungen der Pflegeausbildung regelt." }
  - { id: gl.vorbehaltsaufgaben, term: "Vorbehaltene Tätigkeiten", topicIds: [thema.re.berufsrecht, thema.pp.prozess], definition: "Nach § 4 PflBG Pflegefachpersonen vorbehaltene Aufgaben: Erhebung und Feststellung des Pflegebedarfs, Organisation, Gestaltung und Steuerung des Pflegeprozesses sowie Analyse, Evaluation und Weiterentwicklung der Pflegequalität.", synonyms: [Vorbehaltsaufgaben] }
  - { id: gl.berufsbezeichnung, term: "Pflegefachfrau / Pflegefachmann", topicIds: [thema.re.berufsrecht], definition: "Geschützte Berufsbezeichnung nach dem Pflegeberufegesetz für Absolventinnen und Absolventen der generalistischen Ausbildung." }
  - { id: gl.praxisanleitung, term: "Praxisanleitung", topicIds: [thema.re.berufsrecht], definition: "Geplante, strukturierte Anleitung Auszubildender im praktischen Einsatz durch weitergebildete Praxisanleitende, mindestens 10 Prozent der Einsatzzeit." }
  - { id: gl.icn-ethikkodex, term: "ICN-Ethikkodex", topicIds: [thema.kom.ethik, thema.re.berufsrecht], definition: "Ethikkodex des International Council of Nurses mit den Grundaufgaben Gesundheit fördern, Krankheit verhüten, Gesundheit wiederherstellen und Leiden lindern." }
  - { id: gl.sgb5, term: "Fünftes Buch Sozialgesetzbuch", abbreviation: "SGB V", topicIds: [thema.re.sgb5], definition: "Gesetz über die gesetzliche Krankenversicherung, u. a. mit Regelungen zur häuslichen Krankenpflege." }
  - { id: gl.sgb11, term: "Elftes Buch Sozialgesetzbuch", abbreviation: "SGB XI", topicIds: [thema.re.sgb11], definition: "Gesetz über die soziale Pflegeversicherung mit Pflegebedürftigkeitsbegriff, Pflegegraden und Leistungen." }
  - { id: gl.sozialversicherung, term: "Sozialversicherung", topicIds: [thema.re.sozialrecht], definition: "Gesetzliche Pflichtversicherung mit fünf Säulen: Kranken-, Pflege-, Renten-, Arbeitslosen- und Unfallversicherung." }
  - { id: gl.pflegegeld, term: "Pflegegeld", topicIds: [thema.re.sgb11], definition: "Geldleistung der Pflegeversicherung ab Pflegegrad 2, wenn die Pflege selbst sichergestellt wird, z. B. durch Angehörige." }
  - { id: gl.pflegesachleistung, term: "Pflegesachleistung", topicIds: [thema.re.sgb11, thema.fa.ambulant], definition: "Leistung der Pflegeversicherung, bei der ein zugelassener ambulanter Pflegedienst die Pflege übernimmt." }
  - { id: gl.verhinderungspflege, term: "Verhinderungspflege", topicIds: [thema.re.sgb11], definition: "Leistung der Pflegeversicherung für eine Ersatzpflege, wenn die private Pflegeperson z. B. wegen Urlaub oder Krankheit ausfällt." }
  - { id: gl.kurzzeitpflege, term: "Kurzzeitpflege", topicIds: [thema.re.sgb11, thema.re.versorgung], definition: "Vorübergehende vollstationäre Pflege, z. B. nach einem Krankenhausaufenthalt oder in Krisensituationen." }
  - { id: gl.tagespflege, term: "Tagespflege", topicIds: [thema.re.sgb11, thema.re.versorgung], definition: "Teilstationäre Betreuung pflegebedürftiger Menschen tagsüber in einer Einrichtung, abends und nachts zu Hause." }
  - { id: gl.hkp, term: "Häusliche Krankenpflege", abbreviation: "HKP", topicIds: [thema.re.sgb5, thema.fa.ambulant], definition: "Ärztlich verordnete Behandlungs- und Grundpflege zu Hause als Leistung der Krankenversicherung nach § 37 SGB V." }
  - { id: gl.behandlungspflege, term: "Behandlungspflege", topicIds: [thema.re.sgb5, thema.fa.ambulant], definition: "Ärztlich verordnete medizinische Hilfeleistungen wie Medikamentengabe, Injektionen oder Verbandwechsel." }
  - { id: gl.grundpflege, term: "Grundpflege", topicIds: [thema.ph.koerperpflege, thema.re.sgb11], definition: "Pflegerische Hilfen bei Körperpflege, Ernährung und Mobilität." }
  - { id: gl.einwilligung, term: "Einwilligung", topicIds: [thema.re.haftung, thema.re.betreuung], definition: "Zustimmung einer einwilligungsfähigen, aufgeklärten Person zu einer Maßnahme; ohne sie ist ein Eingriff in die körperliche Unversehrtheit rechtswidrig." }
  - { id: gl.einwilligungsfaehigkeit, term: "Einwilligungsfähigkeit", topicIds: [thema.re.betreuung], definition: "Fähigkeit, Art, Bedeutung und Tragweite einer Maßnahme zu erfassen und danach den eigenen Willen zu bestimmen; unabhängig von der Geschäftsfähigkeit." }
  - { id: gl.mutmasslicher-wille, term: "Mutmaßlicher Wille", topicIds: [thema.re.betreuung, thema.kom.ethik], definition: "Wille, den eine nicht einwilligungsfähige Person vermutlich hätte, ermittelt aus früheren Äußerungen, Überzeugungen und Werten." }
  - { id: gl.betreuung, term: "Rechtliche Betreuung", topicIds: [thema.re.betreuung], definition: "Vom Betreuungsgericht angeordnete Unterstützung einer volljährigen Person, die ihre Angelegenheiten ganz oder teilweise nicht selbst besorgen kann, für festgelegte Aufgabenbereiche." }
  - { id: gl.betreuungsverfuegung, term: "Betreuungsverfügung", topicIds: [thema.re.betreuung], definition: "Schriftlicher Wunsch, wer im Fall einer rechtlichen Betreuung als Betreuerin oder Betreuer bestellt werden soll oder nicht." }
  - { id: gl.geschaeftsfaehigkeit, term: "Geschäftsfähigkeit", topicIds: [thema.re.betreuung], definition: "Fähigkeit, Rechtsgeschäfte wirksam abzuschließen; unbeschränkt ab 18 Jahren, beschränkt ab 7 Jahren." }
  - { id: gl.koerperverletzung, term: "Körperverletzung", topicIds: [thema.re.haftung], definition: "Straftat der körperlichen Misshandlung oder Gesundheitsschädigung; auch eine Pflegemaßnahme ohne wirksame Einwilligung kann den Tatbestand erfüllen." }
  - { id: gl.freiheitsberaubung, term: "Freiheitsberaubung", topicIds: [thema.re.fem], definition: "Straftat nach § 239 StGB; Freiheitsentzug ohne Rechtfertigung, z. B. durch nicht genehmigte Fixierung." }
  - { id: gl.unterlassene-hilfeleistung, term: "Unterlassene Hilfeleistung", topicIds: [thema.re.haftung, thema.beo.notfall], definition: "Straftat nach § 323c StGB, wenn bei Unglücksfällen keine zumutbare Hilfe geleistet wird." }
  - { id: gl.sorgfaltspflicht, term: "Sorgfaltspflicht", topicIds: [thema.re.haftung], definition: "Pflicht, nach dem anerkannten Stand pflegerischen Wissens fachgerecht und gewissenhaft zu handeln." }
  - { id: gl.haftung, term: "Haftung", topicIds: [thema.re.haftung], definition: "Einstehen für einen verursachten Schaden; zivilrechtlich als Schadensersatz, strafrechtlich als Strafe, arbeitsrechtlich als Abmahnung oder Kündigung." }
  - { id: gl.organisationsverschulden, term: "Organisationsverschulden", topicIds: [thema.re.haftung], definition: "Haftung der Leitung oder des Trägers, wenn Abläufe, Personal oder Ausstattung nicht so organisiert sind, dass sichere Pflege möglich ist." }
  - { id: gl.remonstration, term: "Remonstrationspflicht", topicIds: [thema.re.haftung], definition: "Pflicht, Bedenken gegen eine Anordnung zu äußern, wenn sie fachlich falsch oder gefährlich erscheint." }
  - { id: gl.ueberlastungsanzeige, term: "Überlastungsanzeige", topicIds: [thema.re.arbeitsrecht, thema.re.haftung], definition: "Schriftliche Meldung an den Arbeitgeber, dass eine sichere Versorgung wegen Überlastung gefährdet ist.", synonyms: [Gefährdungsanzeige] }
  - { id: gl.arbeitszeitgesetz, term: "Arbeitszeitgesetz", abbreviation: "ArbZG", topicIds: [thema.re.arbeitsrecht], definition: "Gesetz zu Höchstarbeitszeiten, Pausen und Ruhezeiten; in der Regel acht Stunden werktäglich und elf Stunden Ruhezeit." }
  - { id: gl.mutterschutz, term: "Mutterschutzgesetz", abbreviation: "MuSchG", topicIds: [thema.re.arbeitsrecht], definition: "Gesetz zum Schutz schwangerer und stillender Beschäftigter, u. a. mit Beschäftigungsverboten für gefährdende Tätigkeiten." }
  - { id: gl.arbeitsschutz, term: "Arbeitsschutz", topicIds: [thema.re.arbeitsrecht], definition: "Maßnahmen zum Schutz der Sicherheit und Gesundheit der Beschäftigten, z. B. Gefährdungsbeurteilung und Schutzausrüstung." }
  - { id: gl.ifsg, term: "Infektionsschutzgesetz", abbreviation: "IfSG", topicIds: [thema.re.versorgung, thema.ph.hygiene], definition: "Gesetz zur Verhütung und Bekämpfung übertragbarer Krankheiten mit Meldepflichten und Hygieneanforderungen." }
  - { id: gl.dsgvo, term: "Datenschutz-Grundverordnung", abbreviation: "DSGVO", topicIds: [thema.re.schweigepflicht], definition: "EU-Verordnung zum Schutz personenbezogener Daten; Gesundheitsdaten gelten als besonders schützenswert." }
  - { id: gl.heimgesetz, term: "Wohn- und Teilhabegesetze", topicIds: [thema.re.versorgung, thema.fa.langzeit], definition: "Landesgesetze, die frühere Heimgesetze ablösen und Anforderungen an stationäre Pflegeeinrichtungen und Wohnformen regeln." }
  - { id: gl.patientenrechtegesetz, term: "Patientenrechtegesetz", topicIds: [thema.re.versorgung], definition: "Regelt im BGB den Behandlungsvertrag mit Aufklärungs-, Dokumentations- und Einsichtsrechten." }
  - { id: gl.werdenfelser-weg, term: "Werdenfelser Weg", topicIds: [thema.re.fem], definition: "Verfahrensansatz, freiheitsentziehende Maßnahmen durch fachliche Prüfung und Alternativen zu vermeiden, unter Beteiligung speziell geschulter Verfahrenspflegerinnen und -pfleger." }
  - { id: gl.niederflurbett, term: "Niederflurbett", topicIds: [thema.re.fem, thema.pro.sturz], definition: "Sehr tief absenkbares Pflegebett als Alternative zum Bettgitter, um Sturzfolgen ohne Freiheitsentzug zu verringern." }

  # --- Kommunikation ---
  - { id: gl.kommunikation, term: "Kommunikation", topicIds: [thema.kom.grundlagen], definition: "Austausch von Informationen zwischen Menschen über verbale, paraverbale und nonverbale Signale." }
  - { id: gl.nonverbal, term: "Nonverbale Kommunikation", topicIds: [thema.kom.grundlagen], definition: "Verständigung ohne Worte über Mimik, Gestik, Körperhaltung, Blickkontakt und Berührung." }
  - { id: gl.paraverbal, term: "Paraverbale Kommunikation", topicIds: [thema.kom.grundlagen], definition: "Art des Sprechens wie Lautstärke, Tonfall, Sprechtempo und Betonung." }
  - { id: gl.watzlawick, term: "Axiome nach Watzlawick", topicIds: [thema.kom.grundlagen], definition: "Fünf Grundregeln der Kommunikation, u. a. „Man kann nicht nicht kommunizieren“ und die Unterscheidung von Inhalts- und Beziehungsaspekt." }
  - { id: gl.vier-ohren, term: "Vier-Seiten-Modell", topicIds: [thema.kom.grundlagen], definition: "Kommunikationsmodell nach Friedemann Schulz von Thun: Jede Nachricht hat Sachinhalt, Selbstkundgabe, Beziehungsseite und Appell.", synonyms: [Vier-Ohren-Modell, Kommunikationsquadrat] }
  - { id: gl.aktives-zuhoeren, term: "Aktives Zuhören", topicIds: [thema.kom.gespraech], definition: "Aufmerksames Zuhören mit Rückmeldung, z. B. durch Paraphrasieren und Spiegeln von Gefühlen, um Verständnis zu sichern." }
  - { id: gl.empathie, term: "Empathie", topicIds: [thema.kom.gespraech], definition: "Fähigkeit, sich in Gedanken und Gefühle eines anderen Menschen einzufühlen und dies zu zeigen." }
  - { id: gl.kongruenz, term: "Kongruenz", topicIds: [thema.kom.gespraech], definition: "Echtheit; Übereinstimmung von innerem Erleben und äußerem Verhalten, nach Carl Rogers eine Grundhaltung der Gesprächsführung." }
  - { id: gl.wertschaetzung, term: "Wertschätzung", topicIds: [thema.kom.gespraech], definition: "Bedingungslose positive Zuwendung und Achtung gegenüber einem Menschen unabhängig von seinem Verhalten.", synonyms: [Akzeptanz] }
  - { id: gl.ich-botschaft, term: "Ich-Botschaft", topicIds: [thema.kom.gespraech], definition: "Aussage, die die eigene Wahrnehmung und das eigene Gefühl benennt, statt das Gegenüber anzuklagen." }
  - { id: gl.offene-frage, term: "Offene Frage", topicIds: [thema.kom.gespraech], definition: "Frage, die nicht mit Ja oder Nein beantwortet werden kann und zum Erzählen anregt, z. B. „Wie geht es Ihnen heute?“" }
  - { id: gl.geschlossene-frage, term: "Geschlossene Frage", topicIds: [thema.kom.gespraech], definition: "Frage mit kurzer, festgelegter Antwortmöglichkeit, z. B. Ja oder Nein; hilfreich bei Menschen mit eingeschränkter Kommunikation." }
  - { id: gl.spikes, term: "SPIKES-Modell", abbreviation: "SPIKES", topicIds: [thema.kom.gespraech, thema.ph.palliativ], definition: "Sechs-Schritte-Leitfaden zur Überbringung schlechter Nachrichten: Setting, Perception, Invitation, Knowledge, Emotions, Strategy and Summary." }
  - { id: gl.beratung, term: "Pflegeberatung", topicIds: [thema.kom.beratung], definition: "Ergebnisoffener Prozess, der Betroffene und Angehörige befähigt, eigene Lösungen für pflegerische Fragen zu finden; auch Anspruch nach § 7a SGB XI." }
  - { id: gl.anleitung, term: "Anleitung", topicIds: [thema.kom.beratung], definition: "Gezielte Vermittlung praktischer Fertigkeiten, z. B. Insulin spritzen, durch Erklären, Vormachen, Nachmachen und Üben." }
  - { id: gl.schulung, term: "Patientenschulung", topicIds: [thema.kom.beratung], definition: "Geplante, strukturierte Vermittlung von Wissen und Fertigkeiten an Betroffene, oft in Gruppen, z. B. Diabetesschulung." }
  - { id: gl.edukation, term: "Patientenedukation", topicIds: [thema.kom.beratung], definition: "Oberbegriff für Information, Schulung, Anleitung und Beratung von Patientinnen, Patienten und Angehörigen." }
  - { id: gl.motivierende-gespraechsfuehrung, term: "Motivierende Gesprächsführung", topicIds: [thema.kom.beratung], definition: "Klientenzentrierter Beratungsansatz, der Ambivalenzen zu Verhaltensänderungen bearbeitet und die eigene Änderungsmotivation stärkt.", synonyms: [Motivational Interviewing] }
  - { id: gl.transtheoretisches-modell, term: "Transtheoretisches Modell", topicIds: [thema.kom.beratung], definition: "Modell der Verhaltensänderung in Stufen: Absichtslosigkeit, Absichtsbildung, Vorbereitung, Handlung und Aufrechterhaltung." }
  - { id: gl.health-literacy, term: "Gesundheitskompetenz", topicIds: [thema.kom.beratung], definition: "Fähigkeit, Gesundheitsinformationen zu finden, zu verstehen, zu beurteilen und anzuwenden.", synonyms: [Health Literacy] }
  - { id: gl.konflikt, term: "Konflikt", topicIds: [thema.kom.grundlagen], definition: "Spannungssituation, in der unvereinbare Interessen, Ziele oder Werte aufeinandertreffen." }
  - { id: gl.supervision, term: "Supervision", topicIds: [thema.kom.selbstpflege], definition: "Begleitete Reflexion beruflicher Situationen mit externer Fachperson zur Entlastung und Weiterentwicklung." }
  - { id: gl.kollegiale-beratung, term: "Kollegiale Beratung", topicIds: [thema.kom.selbstpflege], definition: "Strukturierte Fallbesprechung unter Kolleginnen und Kollegen ohne externe Leitung." }
  - { id: gl.helfersyndrom, term: "Helfersyndrom", topicIds: [thema.kom.selbstpflege], definition: "Haltung, das eigene Selbstwertgefühl vor allem aus dem Helfen zu beziehen und eigene Bedürfnisse zu vernachlässigen." }
  - { id: gl.stress, term: "Stress", topicIds: [thema.kom.selbstpflege], definition: "Körperliche und psychische Reaktion auf Belastungen (Stressoren); positiv als Eustress, schädlich als Disstress." }
  - { id: gl.gewalt-pflege, term: "Gewalt in der Pflege", topicIds: [thema.kom.ethik, thema.re.haftung], definition: "Handlung oder Unterlassung, die pflegebedürftigen Menschen körperlich, psychisch, finanziell oder durch Vernachlässigung schadet." }
  - { id: gl.nahe-angehoerige, term: "Pflegende Angehörige", topicIds: [thema.kom.beratung, thema.fa.ambulant], definition: "Familienmitglieder oder Nahestehende, die einen pflegebedürftigen Menschen unentgeltlich versorgen; wichtige Partner und oft selbst belastet." }

  # --- Ethik und Kultur ---
  - { id: gl.ethik, term: "Ethik", topicIds: [thema.kom.ethik], definition: "Lehre vom richtigen Handeln, die Moral reflektiert und begründet." }
  - { id: gl.moral, term: "Moral", topicIds: [thema.kom.ethik], definition: "Gesamtheit der in einer Gemeinschaft geltenden Werte und Normen des Handelns." }
  - { id: gl.prinzipienethik, term: "Prinzipienethik", topicIds: [thema.kom.ethik], definition: "Ansatz nach Beauchamp und Childress mit vier Prinzipien: Autonomie, Nichtschaden, Fürsorge (Wohltun) und Gerechtigkeit." }
  - { id: gl.autonomie, term: "Autonomie", topicIds: [thema.kom.ethik], definition: "Selbstbestimmung; Recht eines Menschen, über sich und seine Behandlung selbst zu entscheiden." }
  - { id: gl.fuersorge, term: "Fürsorge", topicIds: [thema.kom.ethik], definition: "Ethisches Prinzip, zum Wohl eines Menschen zu handeln; kann mit Autonomie in Konflikt geraten.", synonyms: [Benefizienz] }
  - { id: gl.paternalismus, term: "Paternalismus", topicIds: [thema.kom.ethik], definition: "Bevormundendes Handeln zum vermeintlichen Wohl einer Person gegen oder ohne ihren Willen." }
  - { id: gl.ethisches-dilemma, term: "Ethisches Dilemma", topicIds: [thema.kom.ethik], definition: "Situation, in der zwischen zwei gleichwertigen moralischen Pflichten entschieden werden muss und jede Entscheidung einen Wert verletzt." }
  - { id: gl.ethische-fallbesprechung, term: "Ethische Fallbesprechung", topicIds: [thema.kom.ethik], definition: "Strukturierte, interprofessionelle Beratung eines konkreten ethischen Konflikts, z. B. nach dem Nimwegener Modell." }
  - { id: gl.sterbehilfe, term: "Sterbehilfe", topicIds: [thema.kom.ethik, thema.ph.palliativ], definition: "Oberbegriff für Handlungen am Lebensende; unterschieden werden u. a. Behandlungsabbruch (erlaubt), Hilfe zur Selbsttötung und Tötung auf Verlangen (strafbar nach § 216 StGB).", note: "Rechtslage zur Suizidhilfe im Wandel – aktuellen Stand prüfen." }
  - { id: gl.therapiezielaenderung, term: "Therapiezieländerung", topicIds: [thema.kom.ethik, thema.ph.palliativ], definition: "Wechsel von kurativer zu palliativer Zielsetzung, wenn eine Heilung nicht mehr möglich oder nicht mehr gewollt ist." }
  - { id: gl.kultursensible-pflege, term: "Kultursensible Pflege", topicIds: [thema.kom.kultur], definition: "Pflege, die kulturelle, religiöse und biografische Prägungen eines Menschen wahrnimmt, respektiert und einbezieht.", synonyms: [transkulturelle Pflege] }
  - { id: gl.leininger, term: "Sunrise-Modell", topicIds: [thema.kom.kultur, thema.pp.modelle], definition: "Modell der transkulturellen Pflege nach Madeleine Leininger, das kulturelle und soziale Einflussfaktoren auf Pflege darstellt." }
  - { id: gl.diversitaet, term: "Diversität", topicIds: [thema.kom.kultur], definition: "Vielfalt von Menschen u. a. nach Herkunft, Religion, Geschlecht, Alter, sexueller Orientierung und Behinderung." }
  - { id: gl.stigmatisierung, term: "Stigmatisierung", topicIds: [thema.kom.kultur, thema.kl.psych], definition: "Abwertung und Ausgrenzung von Menschen aufgrund eines Merkmals, z. B. einer psychischen Erkrankung." }
  - { id: gl.biografiearbeit, term: "Biografiearbeit", topicIds: [thema.kom.kultur, thema.kl.demenz], definition: "Einbeziehen der Lebensgeschichte eines Menschen in die Pflege, um Verhalten zu verstehen und Identität zu stärken." }
  - { id: gl.teilhabe, term: "Teilhabe", topicIds: [thema.re.versorgung, thema.kom.kultur], definition: "Einbezogensein in Lebensbereiche und Gesellschaft; Ziel der Rehabilitation und der UN-Behindertenrechtskonvention.", synonyms: [Partizipation] }
  - { id: gl.inklusion, term: "Inklusion", topicIds: [thema.kom.kultur], definition: "Gleichberechtigte Teilhabe aller Menschen von Anfang an, ohne dass sie sich anpassen müssen." }
