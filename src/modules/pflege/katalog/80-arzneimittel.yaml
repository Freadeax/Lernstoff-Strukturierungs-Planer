# Medikamenten-Steckbriefe: häufige Wirkstoffe in der generalistischen Pflegeausbildung.
# Je Wirkstoff: Gruppe, Wirkprinzip, Anwendung, wichtige Nebenwirkungen und Kontraindikationen (Auswahl),
# Pflegerelevanz. Fachliche Angaben abgeglichen mit den Wirkstoffseiten der Gelben Liste Online
# (abgerufen 2026-10-24) und, wo genannt, mit Gebrauchsinformationen (Beipackzetteln).
# Pflegerelevanz = aus diesen Angaben abgeleitete Beobachtungs- und Beratungspunkte.
# Alles bleibt pruefstatus: ungeprueft, bis es gegen Lehrbuch/Fachinformation geprüft ist.
# Keine Dosierungsanweisung: maßgeblich sind ärztliche Anordnung, Fachinformation und Hausstandard.
# Handelsnamen sind Beispiele (Auswahl), keine Empfehlung.

drugProfiles:
  # ---------------------------------------------------------------- Herz-Kreislauf
  - id: arz.furosemid
    substance: Furosemid
    brandNames: [Lasix]
    drugClass: Schleifendiuretikum
    mechanism: "Hemmt in der Henle-Schleife den Natrium-Kalium-Chlorid-Transport. Stark, schnell und kurz wirksam: mehr Wasser- und Elektrolytausscheidung, Ödeme werden ausgeschwemmt, das Herz entlastet."
    indications: [Ödeme bei Herzinsuffizienz, Leber- oder Nierenerkrankungen, Lungenödem, Arterielle Hypertonie, Oligurie bei Niereninsuffizienz]
    adverseEffects: ["Elektrolytstörungen, v. a. Hypokaliämie und Hyponatriämie", "Dehydratation, Hypovolämie, Blutdruckabfall bis Kollaps (auch beim Aufstehen)", "Anstieg von Harnsäure (Gichtanfall), Kreatinin und Blutfetten", "Selten Hörstörungen"]
    contraindications: [Anurie, "Schwere Hypokaliämie oder Hyponatriämie", "Hypovolämie, Dehydratation", Coma hepaticum, Sulfonamid-Allergie]
    nursing: ["Täglich wiegen (gleiche Zeit, gleiche Kleidung): Gewichtsabnahme laut Gelber Liste höchstens etwa 1 kg pro Tag", "Ein- und Ausfuhr bilanzieren, auf Exsikkosezeichen achten (trockene Schleimhäute, stehende Hautfalten, Verwirrtheit)", "Blutdruck kontrollieren, beim ersten Aufstehen begleiten (Sturzgefahr)", "Kalium- und Natriumwerte im Blick behalten; Hypokaliämie verstärkt die Wirkung von Herzglykosiden", "Morgens geben, damit der Harndrang nicht in die Nacht fällt; Toilette oder Hilfsmittel gut erreichbar machen"]
    mnemonic: "Furosemid: Wasser raus, Kalium raus."
    topicIds: [thema.ph.medikamente, thema.kl.herz.insuffizienz, thema.kl.herz.hypertonie, thema.kl.niere]
    sources:
      - { title: "Gelbe Liste: Furosemid", url: "https://www.gelbe-liste.de/wirkstoffe/Furosemid_283" }
    pruefstatus: ungeprueft

  - id: arz.hydrochlorothiazid
    substance: Hydrochlorothiazid
    abbreviation: HCT
    brandNames: [Esidrix]
    drugClass: Thiaziddiuretikum
    mechanism: "Hemmt im distalen Tubulus den Natrium-Chlorid-Kotransporter. Mehr Natrium-, Chlorid- und Kaliumausscheidung; senkt den Blutdruck. Oft mit ACE-Hemmern oder Sartanen kombiniert."
    indications: [Arterielle Hypertonie, Ödeme, Chronische Herzinsuffizienz (zusätzlich zu ACE-Hemmern)]
    adverseEffects: ["Hypokaliämie, Hyponatriämie, Hypomagnesiämie", "Hyperurikämie (Gicht), Hyperglykämie, erhöhte Blutfette", "Nicht-melanozytärer Hautkrebs bei Langzeiteinnahme (Häufigkeit unbekannt)"]
    contraindications: ["Schwere Niereninsuffizienz", "Bestehende Hypokaliämie, Hyponatriämie, Hyperkalzämie", Gicht, Coma hepaticum]
    nursing: ["Morgens geben", "Blutdruck und Gewicht kontrollieren", "Elektrolyte, Blutzucker und Harnsäure laut Anordnung kontrollieren lassen; bei Diabetes Blutzucker genauer beobachten", "Zu Sonnenschutz und Hautbeobachtung beraten"]
    topicIds: [thema.ph.medikamente, thema.kl.herz.hypertonie, thema.kl.herz.insuffizienz]
    sources:
      - { title: "Gelbe Liste: Hydrochlorothiazid", url: "https://www.gelbe-liste.de/wirkstoffe/Hydrochlorothiazid_10079" }
    pruefstatus: ungeprueft

  - id: arz.spironolacton
    substance: Spironolacton
    brandNames: [Aldactone]
    drugClass: Kaliumsparendes Diuretikum (Aldosteronantagonist)
    mechanism: "Blockiert den Aldosteronrezeptor im distalen Tubulus und Sammelrohr: weniger Natrium wird zurückgeholt, weniger Kalium ausgeschieden. Volle Wirkung oft erst nach 2 bis 3 Tagen."
    indications: [Ödeme und Aszites bei sekundärem Hyperaldosteronismus (z. B. Leberzirrhose), Primärer Hyperaldosteronismus, Arterielle Hypertonie, Nephrotisches Syndrom]
    adverseEffects: ["Hyperkaliämie, lebensbedrohlich v. a. bei Niereninsuffizienz", "Gynäkomastie, Brustspannen, Potenzstörungen", "Hyperurikämie, Magen-Darm-Beschwerden, Schläfrigkeit"]
    contraindications: [Hyperkaliämie, "Schwere Niereninsuffizienz, Anurie", Hyponatriämie, Morbus Addison, Schwangerschaft und Stillzeit]
    nursing: ["Kaliumwert im Blick: Kombination mit ACE-Hemmern, Sartanen oder Kaliumpräparaten erhöht das Hyperkaliämierisiko", "Auf Zeichen der Hyperkaliämie achten (Muskelschwäche, Missempfindungen, Herzrhythmusstörungen)", "Gewicht und Bilanz kontrollieren; nicht mehr als etwa 1 kg Abnahme pro Tag", "Keine kaliumreichen Salzersatzmittel ohne ärztliche Rücksprache"]
    mnemonic: "Spironolacton spart Kalium: Kalium steigt."
    topicIds: [thema.ph.medikamente, thema.kl.herz.insuffizienz, thema.kl.herz.hypertonie, thema.kl.verdauung]
    sources:
      - { title: "Gelbe Liste: Spironolacton", url: "https://www.gelbe-liste.de/wirkstoffe/Spironolacton_516" }
    pruefstatus: ungeprueft

  - id: arz.ramipril
    substance: Ramipril
    brandNames: [Delix]
    drugClass: ACE-Hemmer
    mechanism: "Hemmt das Angiotensin-Converting-Enzym: weniger Angiotensin II, die Gefäße weiten sich, weniger Aldosteron. Der Blutdruck sinkt, das Herz wird entlastet."
    indications: [Arterielle Hypertonie, Herzinsuffizienz, Nach Herzinfarkt, Nierenschutz bei Diabetes mit Proteinurie]
    adverseEffects: ["Trockener Reizhusten", "Schwindel, Blutdruckabfall (v. a. zu Beginn und mit Diuretika)", "Hyperkaliämie, Nierenfunktionsverschlechterung", "Selten Angioödem (Schwellung von Gesicht, Zunge, Rachen): Notfall"]
    contraindications: [Angioödem in der Vorgeschichte, Schwangerschaft (2. und 3. Trimenon), Kombination mit Aliskiren oder Sartanen nicht empfohlen]
    nursing: ["Blutdruck messen, besonders nach der ersten Gabe und bei Dosiserhöhung; beim Aufstehen begleiten", "Reizhusten erfragen und weitergeben, nicht als Erkältung abtun", "Schwellung von Lippen, Zunge oder Rachen sofort melden: Atemwege in Gefahr", "Kalium und Nierenwerte laut Anordnung; NSAR (z. B. Ibuprofen) schwächen die Wirkung und belasten die Niere"]
    mnemonic: "-pril = ACE-Hemmer, typisch: Reizhusten."
    topicIds: [thema.ph.medikamente, thema.kl.herz.hypertonie, thema.kl.herz.insuffizienz, thema.kl.herz.khk]
    sources:
      - { title: "Gelbe Liste: Ramipril", url: "https://www.gelbe-liste.de/wirkstoffe/Ramipril_10240" }
    pruefstatus: ungeprueft

  - id: arz.candesartan
    substance: Candesartan
    brandNames: [Blopress, Atacand]
    drugClass: AT1-Rezeptorantagonist (Sartan)
    mechanism: "Blockiert den AT1-Rezeptor, sodass Angiotensin II nicht mehr wirkt: Gefäße weiten sich, der Blutdruck sinkt. Hemmt das ACE nicht, daher kein typischer ACE-Hemmer-Husten."
    indications: [Arterielle Hypertonie, "Herzinsuffizienz, wenn ACE-Hemmer nicht vertragen werden"]
    adverseEffects: [Schwindel und Kopfschmerzen, Blutdruckabfall, Hyperkaliämie, Veränderte Nierenwerte]
    contraindications: [Schwangerschaft, "Schwere Leber- oder Nierenerkrankung, Cholestase"]
    nursing: ["Blutdruck kontrollieren, beim Aufstehen auf Schwindel achten", "Kalium und Nierenwerte laut Anordnung", "Allergische Schwellung von Gesicht oder Rachen oder Atemnot sofort melden", "Einmal täglich, unabhängig von den Mahlzeiten"]
    mnemonic: "-sartan = Sartan, wirkt wie ACE-Hemmer, aber meist ohne Husten."
    topicIds: [thema.ph.medikamente, thema.kl.herz.hypertonie, thema.kl.herz.insuffizienz]
    sources:
      - { title: "Gelbe Liste: Candesartan", url: "https://www.gelbe-liste.de/wirkstoffe/Candesartan_26997" }
    pruefstatus: ungeprueft

  - id: arz.metoprolol
    substance: Metoprolol
    brandNames: [Beloc-Zok]
    drugClass: Betablocker (β1-selektiv)
    mechanism: "Blockiert β1-Rezeptoren am Herzen: Herzfrequenz, Kontraktionskraft und Sauerstoffbedarf sinken, der Blutdruck fällt."
    indications: [Arterielle Hypertonie, Koronare Herzkrankheit, Tachykarde Herzrhythmusstörungen, Herzinfarkt und Reinfarktprophylaxe, Migräneprophylaxe]
    adverseEffects: ["Bradykardie, Blutdruckabfall, Schwindel beim Aufstehen", "Müdigkeit, Kopfschmerzen", "Belastungsdyspnoe, Bronchospasmus bei Asthma möglich", "Kann Warnzeichen einer Unterzuckerung verschleiern"]
    contraindications: ["Bradykardie, AV-Block II./III. Grades, Sinusknotensyndrom", "Dekompensierte Herzinsuffizienz, kardiogener Schock", Asthma bronchiale, Hypotonie]
    nursing: ["Puls und Blutdruck vor der Gabe messen; bei niedrigem Puls oder Blutdruck Rücksprache nach Anordnung", "Nicht plötzlich absetzen, nur ausschleichen (Gefahr von Angina pectoris, Rebound)", "Bei Diabetes Blutzucker engmaschiger kontrollieren: Zittern und Herzrasen als Warnzeichen können fehlen", "Auf Atemnot achten, besonders bei Lungenerkrankungen"]
    mnemonic: "-olol = Betablocker: Puls vor der Gabe."
    topicIds: [thema.ph.medikamente, thema.kl.herz.hypertonie, thema.kl.herz.khk, thema.kl.herz.insuffizienz]
    sources:
      - { title: "Gelbe Liste: Metoprolol", url: "https://www.gelbe-liste.de/wirkstoffe/Metoprolol_455" }
    pruefstatus: ungeprueft

  - id: arz.amlodipin
    substance: Amlodipin
    brandNames: [Norvasc]
    drugClass: Calciumantagonist (Dihydropyridin)
    mechanism: "Hemmt Calciumkanäle in der Gefäßmuskulatur: Arterien weiten sich, der Gefäßwiderstand und damit der Blutdruck sinken; auch die Herzkranzgefäße werden weiter."
    indications: [Arterielle Hypertonie, Stabile Angina pectoris, Vasospastische Angina]
    adverseEffects: ["Knöchelödeme (sehr häufig)", "Kopfschmerz, Gesichtsröte, Schwindel", "Herzklopfen", "Zahnfleischwucherung (Gingivahyperplasie)"]
    contraindications: ["Schwere Hypotonie, Schock", "Höhergradige Aortenstenose", Instabile Herzinsuffizienz nach Herzinfarkt]
    nursing: ["Beine und Knöchel auf Ödeme beobachten (kein Zeichen für Überwässerung wie bei Herzinsuffizienz, trotzdem melden)", "Blutdruck kontrollieren", "Grapefruitsaft meiden (verstärkt die Wirkung)", "Mundpflege und Zahnarztkontrollen wegen Gingivahyperplasie"]
    mnemonic: "-dipin = Calciumantagonist, typisch dicke Knöchel."
    topicIds: [thema.ph.medikamente, thema.kl.herz.hypertonie, thema.kl.herz.khk]
    sources:
      - { title: "Gelbe Liste: Amlodipin", url: "https://www.gelbe-liste.de/wirkstoffe/Amlodipin_20531" }
    pruefstatus: ungeprueft

  - id: arz.digitoxin
    substance: Digitoxin
    brandNames: [Digimerck]
    drugClass: Herzglykosid (Digitalis)
    mechanism: "Hemmt die Natrium-Kalium-ATPase: mehr Calcium in der Herzmuskelzelle, stärkere Kontraktion; die Überleitung im AV-Knoten wird verlangsamt. Sehr lange Halbwertszeit (etwa eine Woche)."
    indications: ["Herzinsuffizienz, wenn andere Mittel nicht ausreichen", Vorhofflimmern mit schneller Kammerfrequenz]
    adverseEffects: ["Geringe therapeutische Breite: Nebenwirkungen sind oft Zeichen der Überdosierung", "Übelkeit und Erbrechen (frühes Zeichen)", "Herzrhythmusstörungen, Bradykardie, AV-Block", "Farbsehstörungen (Gelb-Grün-Sehen), Verwirrtheit, Halluzinationen"]
    contraindications: ["Verdacht auf Digitalisvergiftung", "AV-Block II./III. Grades, Kammertachykardie", "Hypokaliämie, Hyperkalzämie, Hypomagnesiämie", "Gleichzeitige i.v.-Calciumgabe"]
    nursing: ["Puls vor der Gabe zählen (eine volle Minute); bei Bradykardie oder unregelmäßigem Puls Rücksprache", "Auf Übelkeit, Appetitlosigkeit, Sehstörungen und Verwirrtheit achten und sofort melden", "Hypokaliämie (z. B. durch Diuretika, Abführmittel) erhöht die Giftigkeit: Kalium im Blick", "Ältere Menschen sind empfindlicher; Nierenfunktion beachten"]
    mnemonic: "Digitalis: Übelkeit, gelb-grün sehen, langsamer Puls = an Überdosierung denken."
    topicIds: [thema.ph.medikamente, thema.kl.herz.insuffizienz]
    sources:
      - { title: "Gelbe Liste: Digitoxin", url: "https://www.gelbe-liste.de/wirkstoffe/Digitoxin_622" }
      - { title: "Gebrauchsinformation Digitoxin AWD 0,07", url: "https://www.gelbe-liste.de/produkte/beipackzettel_Digitoxin-AWD-0-07-Tablette.pdf/4f04f7e2-8d1f-42f2-96d1-7efb689d5fd4" }
    pruefstatus: ungeprueft

  - id: arz.glyceroltrinitrat
    substance: Glyceroltrinitrat
    abbreviation: GTN
    brandNames: [Nitrolingual]
    drugClass: Nitrat (Vasodilatator)
    mechanism: "Wird im Körper zu Stickstoffmonoxid (NO): glatte Gefäßmuskulatur erschlafft, vor allem Venen weiten sich. Die Vorlast und der Sauerstoffbedarf des Herzens sinken."
    indications: [Akuter Angina-pectoris-Anfall, Akuter Herzinfarkt, Akute Linksherzinsuffizienz / Lungenödem, Hypertensive Krise]
    adverseEffects: ["Kopfschmerz (Nitratkopfschmerz)", "Blutdruckabfall, Schwindel, Kollaps", "Reflextachykardie, Gesichtsröte"]
    contraindications: ["Systolischer Blutdruck unter 90 mmHg, Schock", "Einnahme von PDE-5-Hemmern (z. B. Sildenafil): lebensbedrohlicher Blutdruckabfall", Erhöhter Hirndruck]
    nursing: ["Vor der Gabe Blutdruck messen; Patient sitzt oder liegt", "Nach PDE-5-Hemmern (Potenzmittel) fragen", "Nach der Gabe Blutdruck, Puls und Schmerz neu einschätzen; bleibt der Schmerz, an Herzinfarkt denken", "Kopfschmerz ist häufig und meist harmlos, trotzdem dokumentieren"]
    mnemonic: "Nitro nur, wenn der Blutdruck es hergibt (über 90 systolisch) und keine Potenzmittel."
    topicIds: [thema.ph.medikamente, thema.kl.herz.khk, thema.kl.herz.insuffizienz]
    sources:
      - { title: "Gelbe Liste: Glyceroltrinitrat", url: "https://www.gelbe-liste.de/wirkstoffe/Glyceroltrinitrat_269" }
    pruefstatus: ungeprueft

  # ---------------------------------------------------------------- Gerinnung
  - id: arz.acetylsalicylsaeure
    substance: Acetylsalicylsäure
    abbreviation: ASS
    brandNames: [Aspirin]
    drugClass: Thrombozytenaggregationshemmer (niedrig dosiert) / NSAR (hoch dosiert)
    mechanism: "Hemmt die Cyclooxygenase irreversibel. Niedrig dosiert (z. B. 100 mg) wird in den Blutplättchen die Thromboxanbildung gehemmt: Plättchen verklumpen schlechter. Hoch dosiert schmerzstillend, fiebersenkend, entzündungshemmend."
    indications: ["Niedrig dosiert: Sekundärprophylaxe nach Herzinfarkt, Schlaganfall, bei pAVK", "Hoch dosiert: Schmerzen, Fieber, Migräne"]
    adverseEffects: ["Erhöhte Blutungsneigung", "Magenbeschwerden, Magen-Darm-Ulzera und -Blutungen", "Analgetika-Asthma bei empfindlichen Menschen", "Reye-Syndrom bei Kindern mit fieberhaften Infekten"]
    contraindications: [Akute Magen-Darm-Ulzera oder -Blutungen, Erhöhte Blutungsneigung (hämorrhagische Diathese), "Asthma durch Salicylate oder NSAR", Letztes Schwangerschaftsdrittel]
    nursing: ["Auf Blutungszeichen achten: Teerstuhl, Hämatome, Zahnfleisch- oder Nasenbluten", "Vor Operationen und Eingriffen ASS-Einnahme erfragen und weitergeben", "Kombination mit anderen Gerinnungshemmern, NSAR, Kortison oder SSRI erhöht Blutungs- und Magenrisiko", "Bei Kindern mit Fieber nicht ohne ärztliche Anordnung (Reye-Syndrom)"]
    topicIds: [thema.ph.medikamente, thema.kl.herz.khk, thema.kl.herz.pavk, thema.kl.neuro.schlaganfall]
    sources:
      - { title: "Gelbe Liste: Acetylsalicylsäure", url: "https://www.gelbe-liste.de/wirkstoffe/Acetylsalicylsaeure_41" }
    pruefstatus: ungeprueft

  - id: arz.clopidogrel
    substance: Clopidogrel
    brandNames: [Plavix, Iscover]
    drugClass: Thrombozytenaggregationshemmer (P2Y12-Hemmer)
    mechanism: "Prodrug, wird in der Leber aktiviert und blockiert dauerhaft den ADP-Rezeptor (P2Y12) der Blutplättchen. Nach Stent oft zusammen mit ASS (duale Plättchenhemmung)."
    indications: ["Akutes Koronarsyndrom, nach Stent-Implantation (mit ASS)", "Nach ischämischem Schlaganfall", pAVK]
    adverseEffects: ["Blutungen: Hämatome, Nasenbluten, Magen-Darm-Blutung, Blutung an Punktionsstellen", "Durchfall, Bauchschmerzen", "Selten thrombotisch-thrombozytopenische Purpura (TTP): Notfall"]
    contraindications: [Akute Blutung (z. B. Ulkus, Hirnblutung), Schwere Leberfunktionsstörung]
    nursing: ["Auf Blutungszeichen achten, Punktionsstellen länger komprimieren", "Nicht eigenmächtig absetzen lassen (Stentthrombose); vor Eingriffen Einnahme weitergeben", "Omeprazol und Esomeprazol schwächen die Wirkung ab (Wechselwirkung beachten)"]
    topicIds: [thema.ph.medikamente, thema.kl.herz.khk, thema.kl.herz.pavk, thema.kl.neuro.schlaganfall]
    sources:
      - { title: "Gelbe Liste: Clopidogrel", url: "https://www.gelbe-liste.de/wirkstoffe/Clopidogrel_27391" }
    pruefstatus: ungeprueft

  - id: arz.heparin
    substance: Heparin (unfraktioniert)
    abbreviation: UFH
    brandNames: []
    drugClass: Antikoagulans (Heparin)
    mechanism: "Verstärkt Antithrombin und hemmt so Thrombin und Faktor Xa. Nur parenteral (i.v. oder s.c.), kurze Halbwertszeit von wenigen Stunden."
    indications: [Thromboseprophylaxe, Therapie von Thrombose und Lungenembolie, "Überbrückung, bis ein orales Antikoagulans wirkt"]
    adverseEffects: ["Blutungen", "Heparininduzierte Thrombozytopenie (HIT Typ II): Thrombozytenabfall mit paradoxen Thrombosen", "Schmerzen und Hämatome an der Injektionsstelle"]
    contraindications: [HIT Typ II in der Vorgeschichte, Aktive schwere Blutung, Spinal- oder Periduralanästhesie bzw. Lumbalpunktion (zeitlicher Abstand nötig)]
    nursing: ["Auf Blutungszeichen achten", "Thrombozytenwerte laut Anordnung; bei Abfall an HIT denken und melden", "Bei i.v.-Gabe über Perfusor: Laufrate genau kontrollieren, Gerinnungskontrollen (aPTT) nach Anordnung", "s.c.-Injektion in die Bauchhaut, Einstichstelle nicht reiben"]
    antidote: "Protamin (hebt unfraktioniertes Heparin auf, niedermolekulares nur teilweise)"
    topicIds: [thema.ph.medikamente, thema.pro.thrombose, thema.kl.herz.pavk, thema.ph.injektion]
    sources:
      - { title: "Gelbe Liste: Heparin", url: "https://www.gelbe-liste.de/wirkstoffe/Heparin_225" }
    pruefstatus: ungeprueft

  - id: arz.enoxaparin
    substance: Enoxaparin
    abbreviation: NMH
    brandNames: [Clexane]
    drugClass: Niedermolekulares Heparin (NMH)
    mechanism: "Bindet an Antithrombin und hemmt vor allem Faktor Xa. Meist einmal täglich s.c., keine engmaschige Gerinnungskontrolle nötig."
    indications: ["Thromboseprophylaxe vor und nach Operationen und bei Immobilität", Therapie von tiefer Venenthrombose und Lungenembolie, Akutes Koronarsyndrom]
    adverseEffects: ["Blutungen, Hämatome an der Injektionsstelle", "Thrombozytopenie, HIT Typ II (seltener als bei unfraktioniertem Heparin, meist 5 bis 10 Tage nach Beginn)", "Hyperkaliämie (v. a. mit ACE-Hemmern)"]
    contraindications: [HIT in den letzten 100 Tagen, Akute Blutung oder hohes Blutungsrisiko, "Spinal- oder Periduralanästhesie innerhalb von 24 Stunden nach der Gabe"]
    nursing: ["Subkutan, nicht intramuskulär: Hautfalte bilden, Fertigspritze senkrecht einstechen, Luftblase nicht entfernen, Einstichstelle nicht reiben", "Injektionsstellen am Bauch wechseln, Hämatome beobachten", "Thrombozyten vor und während der Therapie kontrollieren lassen", "Bei eingeschränkter Nierenfunktion Dosis prüfen lassen"]
    antidote: "Protamin (wirkt bei niedermolekularem Heparin nur zu etwa 50 %)"
    topicIds: [thema.ph.medikamente, thema.pro.thrombose, thema.ph.injektion, thema.ph.periop]
    sources:
      - { title: "Gelbe Liste: Enoxaparin", url: "https://www.gelbe-liste.de/wirkstoffe/Enoxaparin_2127" }
      - { title: "Gelbe Liste: Heparin (Antidot)", url: "https://www.gelbe-liste.de/wirkstoffe/Heparin_225" }
    pruefstatus: ungeprueft

  - id: arz.phenprocoumon
    substance: Phenprocoumon
    brandNames: [Marcumar, Falithrom]
    drugClass: Vitamin-K-Antagonist (Cumarin)
    mechanism: "Hemmt das Vitamin-K-Recycling in der Leber: Gerinnungsfaktoren II, VII, IX und X werden weniger gebildet. Wirkt verzögert (volle Wirkung nach Tagen) und sehr lange (Halbwertszeit etwa 6,5 Tage)."
    indications: [Behandlung und Prophylaxe von Thrombosen und Embolien, "Langzeitbehandlung z. B. bei Vorhofflimmern oder mechanischen Herzklappen"]
    adverseEffects: ["Blutungen (sehr häufig), auch lebensbedrohlich (Hirn, Magen-Darm, Harnwege)"]
    contraindications: [Erhöhte Blutungsneigung, Frischer Schlaganfall, Magen-Darm-Ulzera, Schwangerschaft]
    nursing: ["INR-Wert regelmäßig nach Anordnung; Zielbereich je nach Indikation (meist 2 bis 3)", "Auf Blutungszeichen achten; keine i.m.-Injektionen", "Vitamin-K-reiche Lebensmittel (z. B. grünes Blattgemüse) nicht weglassen, aber gleichmäßig essen: plötzliche Ernährungsumstellung verändert den INR", "Viele Wechselwirkungen (z. B. Antibiotika, NSAR, Alkohol): neue Medikamente immer melden", "Marcumar-Ausweis mitführen lassen"]
    antidote: "Vitamin K (wirkt erst nach Stunden); bei lebensbedrohlicher Blutung Gerinnungsfaktoren (PPSB)"
