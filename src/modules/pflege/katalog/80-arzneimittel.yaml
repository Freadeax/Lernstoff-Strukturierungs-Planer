    adverseEffects: ["Übelkeit, Erbrechen", "Blutdruckabfall beim Aufstehen", "Überbewegungen (Dyskinesien), On-off-Schwankungen bei Langzeittherapie", "Halluzinationen, Verwirrtheit", "Plötzliche Schlafattacken, Impulskontrollstörungen", "Harmlos rötlich-dunkler Urin"]
