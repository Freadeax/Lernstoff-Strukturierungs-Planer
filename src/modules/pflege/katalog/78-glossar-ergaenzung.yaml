# Glossar, Teil 9: Ergänzung 2026-11 für Themen mit wenigen Begriffen (Pflegeprozess, Recht,
# Prophylaxen, Fallarbeit, Haut, Fortpflanzung sowie die neuen Krankheitsbild-Steckbriefe).
# Format wie 70-glossar.yaml. Übliches Lehrbuchwissen, nicht mit dem Unterrichtsmaterial
# abgeglichen; Rechtsangaben sind ungeprüft bis zum Abgleich mit dem Gesetzestext.

glossary:
  # --- Pflegeprozess ---
  - { id: gl.evaluationsdatum, term: "Evaluationsdatum", topicIds: [thema.pp.evaluation], definition: "Im Pflegeplan festgelegter Zeitpunkt, an dem die Zielerreichung überprüft wird." }
  - { id: gl.zielerreichung, term: "Zielerreichungsgrad", topicIds: [thema.pp.evaluation, thema.fa.evaluation], definition: "Einschätzung, ob ein Pflegeziel erreicht, teilweise erreicht oder nicht erreicht wurde, mit Begründung." }
  - { id: gl.durchfuehrungsnachweis, term: "Durchführungsnachweis", topicIds: [thema.pp.evaluation], definition: "Dokumentation, dass eine geplante Maßnahme zu einem bestimmten Zeitpunkt durch eine bestimmte Person durchgeführt wurde, meist mit Handzeichen.", synonyms: [Leistungsnachweis] }
  - { id: gl.aktuelles-problem, term: "Aktuelles Pflegeproblem", topicIds: [thema.pp.diagnosen], definition: "Pflegeproblem, das bereits besteht und an Symptomen erkennbar ist, z. B. Schmerzen bei Bewegung." }
  - { id: gl.ergebnisziel, term: "Ergebnisorientiertes Ziel", topicIds: [thema.pp.ziele], definition: "Pflegeziel, das den erwünschten Zustand der Person beschreibt und nicht die Tätigkeit der Pflegenden, z. B. „Frau B. geht mit Rollator 20 m allein“." }
  - { id: gl.handlungsanweisung, term: "Handlungsanweisung", topicIds: [thema.pp.massnahmen], definition: "Genaue Beschreibung einer Pflegemaßnahme, damit alle Pflegenden sie gleich durchführen." }
  - { id: gl.regelkreis, term: "Pflegeprozess als Regelkreis", topicIds: [thema.pp.prozess], definition: "Darstellung des Pflegeprozesses als Kreislauf: Nach der Evaluation beginnt er mit neuen Informationen wieder von vorn." }
  - { id: gl.vorbehaltene-taetigkeit, term: "Vorbehaltene Tätigkeit", topicIds: [thema.pp.prozess, thema.re.berufsrecht], definition: "Aufgaben, die nach § 4 PflBG nur Pflegefachpersonen ausführen dürfen: Erhebung und Feststellung des Pflegebedarfs, Organisation, Gestaltung und Steuerung des Pflegeprozesses sowie Analyse, Evaluation, Sicherung und Entwicklung der Pflegequalität." }
  - { id: gl.massnahmenplan, term: "Maßnahmenplan", topicIds: [thema.pp.sis], definition: "Im Strukturmodell die Tagesstruktur mit den geplanten grundpflegerischen und betreuenden Maßnahmen, abgeleitet aus der SIS." }
  - { id: gl.verstaendigungsprozess, term: "Verständigungsprozess", topicIds: [thema.pp.sis], definition: "Aushandlung zwischen pflegebedürftiger Person und Pflegefachperson über Einschätzungen und Maßnahmen; Kernelement der SIS." }
  - { id: gl.berichteblatt-abweichung, term: "Dokumentation von Abweichungen", topicIds: [thema.pp.sis, thema.pp.evaluation], definition: "Grundsatz des Strukturmodells: Im Bericht wird vor allem festgehalten, was von der geplanten Versorgung abweicht oder sich verändert." }
  - { id: gl.uebergabe-am-bett, term: "Übergabe am Bett", topicIds: [thema.pp.uebergabe], definition: "Dienstübergabe im Zimmer unter Einbeziehung der Patientin oder des Patienten; vertrauliche Inhalte werden außerhalb besprochen." }
  - { id: gl.pflegeueberleitung, term: "Pflegeüberleitungsbogen", topicIds: [thema.pp.uebergabe], definition: "Dokument, das beim Wechsel der Versorgungseinrichtung die wichtigsten pflegerischen Informationen weitergibt." }

  # --- Recht ---
  - { id: gl.schweigepflichtentbindung, term: "Schweigepflichtentbindung", topicIds: [thema.re.schweigepflicht], definition: "Einwilligung der betroffenen Person, dass bestimmte Informationen an bestimmte Personen weitergegeben werden dürfen." }
  - { id: gl.datenschutz, term: "Datenschutz", topicIds: [thema.re.schweigepflicht], definition: "Schutz personenbezogener Daten vor Missbrauch; Gesundheitsdaten gehören nach der DSGVO zu den besonders geschützten Daten." }
  - { id: gl.rechtfertigender-notstand, term: "Rechtfertigender Notstand", topicIds: [thema.re.schweigepflicht, thema.re.fem], definition: "Rechtfertigungsgrund nach § 34 StGB: Eine sonst verbotene Handlung ist erlaubt, wenn nur so eine gegenwärtige, erhebliche Gefahr abgewendet werden kann." }
  - { id: gl.begutachtung, term: "Pflegebegutachtung", topicIds: [thema.re.pflegegrade], definition: "Feststellung der Pflegebedürftigkeit durch den Medizinischen Dienst bzw. bei Privatversicherten durch Medicproof, meist im Hausbesuch." }
  - { id: gl.nba-module, term: "Module des NBA", topicIds: [thema.re.pflegegrade], definition: "Sechs gewichtete Lebensbereiche des Begutachtungsinstruments: Mobilität, kognitive und kommunikative Fähigkeiten, Verhaltensweisen und psychische Problemlagen, Selbstversorgung, Umgang mit krankheits- und therapiebedingten Anforderungen sowie Gestaltung des Alltagslebens und sozialer Kontakte." }
  - { id: gl.entlastungsbetrag, term: "Entlastungsbetrag", topicIds: [thema.re.pflegegrade], definition: "Zweckgebundener monatlicher Betrag der Pflegeversicherung ab Pflegegrad 1 für Angebote zur Unterstützung im Alltag." }
  - { id: gl.betreuungsgericht, term: "Betreuungsgericht", topicIds: [thema.re.fem, thema.re.betreuung], definition: "Abteilung des Amtsgerichts, die Betreuungen einrichtet und regelmäßige oder längere freiheitsentziehende Maßnahmen genehmigen muss." }
  - { id: gl.fem-alternativen, term: "Alternativen zu FEM", topicIds: [thema.re.fem, thema.pro.sturz], definition: "Maßnahmen, die freiheitsentziehende Maßnahmen überflüssig machen, z. B. Niederflurbett, Sensormatte, Hüftprotektoren, Sturzmatte, Beschäftigung und Begleitung." }

  # --- Prophylaxen ---
  - { id: gl.hautfalten, term: "Gefährdete Hautfalten", topicIds: [thema.pro.intertrigo], definition: "Bereiche mit Haut-auf-Haut-Kontakt: unter der Brust, Leisten, Achseln, Bauchfalten, Gesäßfalte und zwischen den Zehen." }
  - { id: gl.leinenlappen, term: "Einlegen von Leinen- oder Baumwollstreifen", topicIds: [thema.pro.intertrigo], definition: "Prophylaxemaßnahme, bei der saugfähige Textilstreifen in Hautfalten gelegt werden, damit Haut nicht auf Haut liegt und Feuchtigkeit aufgenommen wird; keine Kompressen oder Puder." }
  - { id: gl.speichelfluss, term: "Anregen des Speichelflusses", topicIds: [thema.pro.soor], definition: "Parotitisprophylaxe durch Kauen, Lutschen (z. B. gefrorene Fruchtstücke), Kaugummi oder Massage der Ohrspeicheldrüse, sofern keine Kontraindikation besteht." }
  - { id: gl.trinkprotokoll, term: "Trinkprotokoll", topicIds: [thema.pro.dehydratation], definition: "Aufzeichnung der getrunkenen Mengen über den Tag, um eine zu geringe Flüssigkeitszufuhr früh zu erkennen." }
  - { id: gl.stehende-hautfalte, term: "Stehende Hautfalte", topicIds: [thema.pro.dehydratation, thema.beo.haut], definition: "Hautfalte, die nach dem Abheben langsam verstreicht; Hinweis auf Flüssigkeitsmangel, bei alten Menschen wegen der verminderten Hautelastizität nur eingeschränkt aussagekräftig." }

  # --- Fallarbeit ---
  - { id: gl.fallanalyse, term: "Fallanalyse", topicIds: [thema.fa.analyse], definition: "Systematisches Erschließen einer Pflegesituation: Informationen ordnen, Pflegebedarf, Ressourcen und Risiken erkennen und begründen." }
  - { id: gl.pflegesituation, term: "Pflegesituation", topicIds: [thema.fa.analyse], definition: "Konkrete Situation aus zu pflegender Person, Pflegenden, Umfeld und Institution; Ausgangspunkt der Aufgaben in der Abschlussprüfung." }
  - { id: gl.priorisierung, term: "Priorisierung", topicIds: [thema.fa.planung], definition: "Festlegen der Reihenfolge von Pflegeproblemen oder Maßnahmen nach Dringlichkeit, z. B. Lebensbedrohliches vor Wohlbefinden und vor langfristigen Zielen." }
  - { id: gl.begruendung, term: "Fachliche Begründung", topicIds: [thema.fa.planung, thema.fa.evaluation], definition: "Herleitung, warum eine Maßnahme im Fall angemessen ist, mit Bezug auf Fallinformationen, Fachwissen und Expertenstandards." }
  - { id: gl.fallbezug, term: "Fallbezug", topicIds: [thema.fa.planung, thema.fa.analyse], definition: "Anforderung in Prüfungsaufgaben, Aussagen mit konkreten Angaben aus der Fallsituation zu verknüpfen, statt allgemeines Wissen aufzuzählen." }
  - { id: gl.familienorientierung, term: "Familienorientierte Pflege", topicIds: [thema.fa.paediatrie, thema.kl.paediatrie], definition: "Pflegeansatz, der Eltern und Familie als Partner einbezieht, besonders in der Pflege von Kindern und Jugendlichen." }

  # --- Haut, Fortpflanzung, neue Krankheitsbilder ---
  - { id: gl.talgdruese, term: "Talgdrüse", topicIds: [thema.ap.haut], definition: "Hautanhangsdrüse, die Talg (Hautfett) bildet und die Haut geschmeidig hält; meist an einem Haarfollikel gelegen." }
  - { id: gl.schweissdruese, term: "Schweißdrüse", topicIds: [thema.ap.haut], definition: "Drüse in der Haut, die Schweiß bildet; dient vor allem der Temperaturregulation durch Verdunstungskälte." }
  - { id: gl.menopause, term: "Menopause", topicIds: [thema.ap.fortpflanzung, thema.kl.bewegung], definition: "Letzte Regelblutung im Leben einer Frau; der Östrogenmangel danach erhöht u. a. das Osteoporoserisiko.", synonyms: [Wechseljahre] }
  - { id: gl.fontaine, term: "Stadien nach Fontaine", topicIds: [thema.kl.herz.pavk], definition: "Einteilung der pAVK in vier Stadien: I beschwerdefrei, II Belastungsschmerz, III Ruheschmerz, IV Nekrose oder Gangrän." }
  - { id: gl.gangraen, term: "Gangrän", topicIds: [thema.kl.herz.pavk, thema.ph.wunde], definition: "Absterben von Gewebe durch fehlende Durchblutung; trocken (schwarz, eingetrocknet) oder feucht (infiziert)." }
  - { id: gl.myelin, term: "Myelinscheide", topicIds: [thema.kl.neuro.ms, thema.ap.nerven], definition: "Isolierende Hülle um Nervenfasern, die eine schnelle Erregungsleitung ermöglicht; bei der MS durch Entzündung zerstört.", synonyms: [Markscheide] }
  - { id: gl.uhthoff, term: "Uhthoff-Phänomen", topicIds: [thema.kl.neuro.ms], definition: "Vorübergehende Verschlechterung von MS-Beschwerden bei erhöhter Körpertemperatur, z. B. durch heißes Baden, Fieber oder Sport." }
  - { id: gl.optikusneuritis, term: "Optikusneuritis", topicIds: [thema.kl.neuro.ms], definition: "Entzündung des Sehnervs mit Sehverschlechterung und Schmerzen bei Augenbewegung; häufiges Erstsymptom der MS.", synonyms: [Retrobulbärneuritis] }
  - { id: gl.postiktal, term: "Postiktale Phase", topicIds: [thema.kl.neuro.epilepsie], definition: "Zeit nach einem epileptischen Anfall mit Müdigkeit, Verwirrtheit, Kopfschmerz oder vorübergehenden Lähmungen.", synonyms: [Nachphase, Nachschlaf] }
  - { id: gl.positivsymptome, term: "Positivsymptome", topicIds: [thema.kl.psych], definition: "Bei der Schizophrenie Erleben, das zum normalen Erleben hinzukommt: Wahn, Halluzinationen, Ich-Störungen, formale Denkstörungen.", synonyms: [Plussymptome] }
  - { id: gl.negativsymptome, term: "Negativsymptome", topicIds: [thema.kl.psych], definition: "Bei der Schizophrenie Verlust normaler Fähigkeiten: Antriebsmangel, Gefühlsverflachung, sozialer Rückzug, Sprachverarmung.", synonyms: [Minussymptome] }
  - { id: gl.delirium-tremens, term: "Delirium tremens", topicIds: [thema.kl.psych], definition: "Schwerste Form des Alkoholentzugssyndroms mit Desorientierung, Halluzinationen, Unruhe, Zittern und vegetativer Entgleisung; lebensbedrohlich." }
  - { id: gl.wernicke, term: "Wernicke-Enzephalopathie", topicIds: [thema.kl.psych, thema.kl.neuro], definition: "Akute Hirnschädigung durch Vitamin-B1-Mangel, meist bei Alkoholabhängigkeit; Verwirrtheit, Augenbewegungsstörungen und Gangunsicherheit." }
  - { id: gl.peritonealdialyse, term: "Peritonealdialyse", topicIds: [thema.kl.niere], definition: "Nierenersatzverfahren, bei dem das Bauchfell als Filter dient; Dialyselösung wird über einen Katheter in die Bauchhöhle gefüllt und wieder abgelassen.", synonyms: [Bauchfelldialyse] }
  - { id: gl.uraemie, term: "Urämie", topicIds: [thema.kl.niere], definition: "Vergiftung des Körpers durch harnpflichtige Stoffe bei Nierenversagen; Übelkeit, Juckreiz, Uringeruch der Atemluft, Verwirrtheit." }
  - { id: gl.portale-hypertension, term: "Portale Hypertension", topicIds: [thema.kl.verdauung], definition: "Erhöhter Druck in der Pfortader, meist durch Leberzirrhose; führt zu Aszites, Milzvergrößerung und Umgehungskreisläufen wie Ösophagusvarizen.", synonyms: [Pfortaderhochdruck] }
  - { id: gl.oesophagusvarizen, term: "Ösophagusvarizen", topicIds: [thema.kl.verdauung], definition: "Erweiterte Venen in der Speiseröhre als Umgehungskreislauf bei portaler Hypertension; können lebensbedrohlich bluten." }
  - { id: gl.hepatische-enzephalopathie, term: "Hepatische Enzephalopathie", topicIds: [thema.kl.verdauung], definition: "Funktionsstörung des Gehirns durch Giftstoffe wie Ammoniak, die die kranke Leber nicht mehr abbaut; von Konzentrationsstörung bis zum Koma." }
  - { id: gl.kolostoma, term: "Kolostoma", topicIds: [thema.kl.onko, thema.ph.ausscheidung], definition: "Künstlicher Darmausgang des Dickdarms; Ausscheidung je nach Lage breiig bis geformt." }
  - { id: gl.ileostoma, term: "Ileostoma", topicIds: [thema.kl.onko, thema.ph.ausscheidung], definition: "Künstlicher Darmausgang des Dünndarms; dünnflüssige, aggressive Ausscheidung mit hohem Flüssigkeits- und Salzverlust." }
  - { id: gl.epiglottitis, term: "Epiglottitis", topicIds: [thema.kl.paediatrie], definition: "Bakterielle Entzündung des Kehldeckels mit hohem Fieber, kloßiger Sprache und Speichelfluss; lebensbedrohlicher Notfall, Rachen nicht inspizieren." }
  - { id: gl.dxa, term: "Knochendichtemessung", abbreviation: "DXA", topicIds: [thema.kl.bewegung], definition: "Röntgenverfahren mit geringer Strahlung zur Bestimmung der Knochendichte, Standard in der Osteoporosediagnostik.", synonyms: [Osteodensitometrie] }
  - { id: gl.peak-flow, term: "Peak-Flow", topicIds: [thema.kl.atmung], definition: "Maximale Ausatemstromstärke, mit einem kleinen Messgerät selbst messbar; dient bei Asthma der Verlaufskontrolle im Peak-Flow-Tagebuch." }
  - { id: gl.spacer, term: "Spacer", topicIds: [thema.kl.atmung, thema.ph.medikamente], definition: "Inhalierhilfe als Vorschaltkammer für Dosieraerosole; erleichtert die Koordination und bringt mehr Wirkstoff in die Lunge.", synonyms: [Inhalierhilfe] }

  # --- Runde 2: Schilddrüse, Arthrose, Angst, Kinder, Lungenembolie ---
  - { id: gl.struma, term: "Struma", topicIds: [thema.kl.schilddruese], definition: "Vergrößerung der Schilddrüse, z. B. durch Jodmangel; kann mit normaler, verminderter oder gesteigerter Funktion einhergehen.", synonyms: [Kropf] }
  - { id: gl.hashimoto, term: "Hashimoto-Thyreoiditis", topicIds: [thema.kl.schilddruese], definition: "Autoimmune Entzündung der Schilddrüse und häufigste Ursache einer Hypothyreose." }
  - { id: gl.myxoedem, term: "Myxödem", topicIds: [thema.kl.schilddruese], definition: "Teigige, nicht eindrückbare Schwellung der Haut bei ausgeprägter Hypothyreose; das Myxödemkoma ist eine seltene, lebensbedrohliche Entgleisung." }
  - { id: gl.anlaufschmerz, term: "Anlaufschmerz", topicIds: [thema.kl.bewegung], definition: "Gelenkschmerz zu Beginn einer Bewegung nach Ruhephasen, der nach einigen Schritten nachlässt; typisch für Arthrose." }
  - { id: gl.panikattacke, term: "Panikattacke", topicIds: [thema.kl.psych], definition: "Plötzlich auftretende, intensive Angst mit Herzrasen, Atemnot, Zittern, Schwitzen und Todesangst, die meist nach Minuten abklingt." }
  - { id: gl.hyperventilation, term: "Hyperventilation", topicIds: [thema.kl.psych, thema.beo.vitalzeichen], definition: "Über den Bedarf gesteigerte Atmung; senkt den CO2-Gehalt im Blut und führt zu Kribbeln an Händen und Mund bis zu Pfötchenstellung der Hände." }
  - { id: gl.agoraphobie, term: "Agoraphobie", topicIds: [thema.kl.psych], definition: "Angst vor Orten oder Situationen, aus denen eine Flucht schwierig erscheint oder keine Hilfe erreichbar wäre, z. B. Menschenmengen, Kaufhäuser, öffentliche Verkehrsmittel.", synonyms: [Platzangst] }
  - { id: gl.konfrontation, term: "Konfrontationstherapie", topicIds: [thema.kl.psych], definition: "Verhaltenstherapeutisches Verfahren, bei dem sich Betroffene angstauslösenden Situationen schrittweise und begleitet aussetzen, bis die Angst nachlässt.", synonyms: [Expositionstherapie] }
  - { id: gl.bronchiolitis, term: "Bronchiolitis", topicIds: [thema.kl.paediatrie], definition: "Virusbedingte Entzündung der kleinsten Atemwege bei Säuglingen und Kleinkindern, meist durch RSV." }
  - { id: gl.rsv, term: "Respiratorisches Synzytial-Virus", abbreviation: "RSV", topicIds: [thema.kl.paediatrie, thema.kl.infektion], definition: "Häufiger Erreger von Atemwegsinfekten, der bei Säuglingen schwere Bronchiolitiden auslösen kann; sehr ansteckend." }
  - { id: gl.gastroenteritis, term: "Gastroenteritis", topicIds: [thema.kl.paediatrie, thema.kl.infektion, thema.kl.verdauung], definition: "Entzündung von Magen und Darm mit Durchfall und oft Erbrechen, meist durch Viren wie Noro- oder Rotaviren.", synonyms: [Magen-Darm-Infekt, Brechdurchfall] }
  - { id: gl.orl, term: "Orale Rehydratationslösung", abbreviation: "ORL", topicIds: [thema.kl.paediatrie, thema.pro.dehydratation], definition: "Trinklösung mit abgestimmtem Gehalt an Zucker und Salzen zum Ausgleich von Flüssigkeits- und Elektrolytverlusten bei Durchfall und Erbrechen." }
  - { id: gl.fontanelle, term: "Fontanelle", topicIds: [thema.kl.paediatrie, thema.ap.fortpflanzung], definition: "Noch nicht verknöcherte Lücke zwischen den Schädelknochen des Säuglings; eingesunken bei Flüssigkeitsmangel, vorgewölbt bei erhöhtem Hirndruck." }
  - { id: gl.d-dimere, term: "D-Dimere", topicIds: [thema.kl.herz.pavk], definition: "Abbauprodukte von Fibrin im Blut; ein normaler Wert macht eine Thrombose oder Lungenembolie unwahrscheinlich, ein erhöhter Wert ist unspezifisch." }
  - { id: gl.thrombolyse, term: "Thrombolyse", topicIds: [thema.kl.herz.pavk, thema.kl.neuro.schlaganfall], definition: "Medikamentöses Auflösen eines Blutgerinnsels, z. B. bei massiver Lungenembolie oder ischämischem Schlaganfall; hohes Blutungsrisiko.", synonyms: [Lyse] }
