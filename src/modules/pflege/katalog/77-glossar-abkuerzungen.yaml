# Glossar, Teil 8: Abkürzungen in Klinik, Dokumentation und Versorgung (Format wie 70-glossar.yaml).
# Jede Abkürzung nur einmal im ganzen Glossar, damit das Fachbegriff-Duell eindeutig bleibt.

glossary:
  # --- Dokumentation und Verordnung ---
  - { id: gl.abk.zn, term: "Zustand nach", abbreviation: "Z. n.", topicIds: [thema.fs.abkuerzungen], definition: "Kennzeichnet ein früheres Ereignis wie eine Operation oder Erkrankung in der Vorgeschichte, z. B. nach Hüft-TEP." }
  - { id: gl.abk.va, term: "Verdacht auf", abbreviation: "V. a.", topicIds: [thema.fs.abkuerzungen], definition: "Kennzeichnet eine vermutete, noch nicht gesicherte Diagnose." }
  - { id: gl.abk.dd, term: "Differenzialdiagnose", abbreviation: "DD", topicIds: [thema.fs.abkuerzungen], definition: "Andere Erkrankung mit ähnlichen Symptomen, die bei der Diagnosestellung abgegrenzt werden muss." }
  - { id: gl.abk.ob, term: "ohne Befund", abbreviation: "o. B.", topicIds: [thema.fs.abkuerzungen], definition: "Untersuchung ergab keine krankhaften Auffälligkeiten." }
  - { id: gl.abk.bb, term: "bei Bedarf", abbreviation: "b. B.", topicIds: [thema.fs.abkuerzungen, thema.ph.medikamente], definition: "Verordnung, die nur bei festgelegten Beschwerden angewendet wird.", synonyms: [b. Bed.] }
  - { id: gl.abk.po, term: "per os", abbreviation: "p.o.", topicIds: [thema.fs.abkuerzungen, thema.ph.medikamente], definition: "Über den Mund verabreicht; orale Gabe." }
  - { id: gl.abk.pr, term: "per rectum", abbreviation: "p.r.", topicIds: [thema.fs.abkuerzungen, thema.ph.medikamente], definition: "Über den Enddarm verabreicht, z. B. als Zäpfchen." }
  - { id: gl.abk.sl, term: "sublinguale Gabe", abbreviation: "s.l.", topicIds: [thema.fs.abkuerzungen, thema.ph.medikamente], definition: "Verabreichung unter die Zunge, z. B. Nitrospray bei Angina pectoris." }
  - { id: gl.abk.ic, term: "intrakutan", abbreviation: "i.c.", topicIds: [thema.fs.abkuerzungen, thema.ph.injektion], definition: "In die Haut, z. B. bei Allergietests." }
  - { id: gl.abk.ia, term: "intraarteriell", abbreviation: "i.a.", topicIds: [thema.fs.abkuerzungen, thema.ph.injektion], definition: "In eine Arterie; versehentliche i.a.-Gabe kann schwere Gewebeschäden verursachen." }
  - { id: gl.abk.ie, term: "Internationale Einheit", abbreviation: "I.E.", topicIds: [thema.fs.abkuerzungen, thema.kl.diabetes], definition: "Mengeneinheit für die biologische Wirksamkeit eines Stoffes, z. B. bei Insulin oder Heparin.", synonyms: [IU] }
  - { id: gl.abk.pat, term: "Patientin / Patient", abbreviation: "Pat.", topicIds: [thema.fs.abkuerzungen], definition: "Person, die medizinisch oder pflegerisch behandelt wird." }
  - { id: gl.abk.anam, term: "Anamnese", abbreviation: "Anamn.", topicIds: [thema.fs.abkuerzungen, thema.pp.anamnese], definition: "Erhebung der Krankengeschichte im Gespräch." }
  - { id: gl.abk.dnr, term: "Do not resuscitate", abbreviation: "DNR", topicIds: [thema.fs.abkuerzungen, thema.ph.palliativ, thema.kom.ethik], definition: "Dokumentierte Festlegung, im Fall eines Kreislaufstillstands keine Wiederbelebung durchzuführen.", synonyms: [DNAR] }
  - { id: gl.abk.icd, term: "Internationale Klassifikation der Krankheiten", abbreviation: "ICD", topicIds: [thema.fs.abkuerzungen, thema.re.sgb5], definition: "Von der WHO herausgegebenes Verzeichnis zur einheitlichen Verschlüsselung von Diagnosen." }
  - { id: gl.abk.icf, term: "Internationale Klassifikation der Funktionsfähigkeit, Behinderung und Gesundheit", abbreviation: "ICF", topicIds: [thema.fs.abkuerzungen, thema.re.versorgung], definition: "WHO-Klassifikation, die Gesundheit über Körperfunktionen, Aktivitäten, Teilhabe und Umweltfaktoren beschreibt." }
  - { id: gl.abk.drg, term: "Diagnosis Related Groups", abbreviation: "DRG", topicIds: [thema.fs.abkuerzungen, thema.re.versorgung], definition: "Fallpauschalensystem, nach dem Krankenhausleistungen anhand von Diagnosen und Prozeduren vergütet werden." }
  - { id: gl.abk.adl, term: "Activities of Daily Living", abbreviation: "ADL", topicIds: [thema.fs.abkuerzungen, thema.kl.geriatrie], definition: "Grundlegende Alltagsaktivitäten wie Essen, Waschen, Ankleiden und Toilettengang; erweitert um instrumentelle Aktivitäten (IADL) wie Einkaufen." }

  # --- Vitalwerte, Labor und Diagnostik ---
  - { id: gl.abk.hf, term: "Herzfrequenz", abbreviation: "HF", topicIds: [thema.fs.abkuerzungen, thema.beo.vitalzeichen], definition: "Anzahl der Herzschläge pro Minute." }
  - { id: gl.abk.af, term: "Atemfrequenz", abbreviation: "AF", topicIds: [thema.fs.abkuerzungen, thema.beo.vitalzeichen], definition: "Anzahl der Atemzüge pro Minute." }
  - { id: gl.abk.bz, term: "Blutzucker", abbreviation: "BZ", topicIds: [thema.fs.abkuerzungen, thema.kl.diabetes], definition: "Konzentration der Glukose im Blut, angegeben in mg/dl oder mmol/l." }
  - { id: gl.abk.ekg, term: "Elektrokardiogramm", abbreviation: "EKG", topicIds: [thema.fs.abkuerzungen, thema.kl.herz], definition: "Aufzeichnung der elektrischen Herzaktivität über Elektroden auf der Haut." }
  - { id: gl.abk.eeg, term: "Elektroenzephalogramm", abbreviation: "EEG", topicIds: [thema.fs.abkuerzungen, thema.kl.neuro.epilepsie], definition: "Aufzeichnung der elektrischen Hirnaktivität, z. B. bei Epilepsie." }
  - { id: gl.abk.bga, term: "Blutgasanalyse", abbreviation: "BGA", topicIds: [thema.fs.abkuerzungen, thema.kl.atmung], definition: "Messung von Sauerstoff, Kohlendioxid, pH-Wert und Bikarbonat im Blut." }
  - { id: gl.abk.crp, term: "C-reaktives Protein", abbreviation: "CRP", topicIds: [thema.fs.abkuerzungen, thema.kl.infektion], definition: "In der Leber gebildeter Entzündungsmarker, der bei Infektionen und Entzündungen ansteigt." }
  - { id: gl.abk.inr, term: "International Normalized Ratio", abbreviation: "INR", topicIds: [thema.fs.abkuerzungen, thema.pro.thrombose], definition: "Standardisierter Gerinnungswert zur Überwachung einer Therapie mit Vitamin-K-Antagonisten; ersetzt den Quick-Wert." }
  - { id: gl.abk.ptt, term: "partielle Thromboplastinzeit", abbreviation: "PTT", topicIds: [thema.fs.abkuerzungen, thema.pro.thrombose], definition: "Gerinnungswert, u. a. zur Überwachung einer Therapie mit unfraktioniertem Heparin.", synonyms: [aPTT] }
  - { id: gl.abk.gfr, term: "glomeruläre Filtrationsrate", abbreviation: "GFR", topicIds: [thema.fs.abkuerzungen, thema.kl.niere], definition: "Maß für die Nierenfunktion: Flüssigkeitsmenge, die die Glomeruli pro Minute filtern; oft geschätzt als eGFR." }
  - { id: gl.abk.krea, term: "Kreatinin", abbreviation: "Krea", topicIds: [thema.fs.abkuerzungen, thema.kl.niere], definition: "Abbauprodukt des Muskelstoffwechsels, das über die Niere ausgeschieden wird; erhöhte Werte weisen auf eine eingeschränkte Nierenfunktion hin." }
  - { id: gl.abk.tsh, term: "Thyreoidea-stimulierendes Hormon", abbreviation: "TSH", topicIds: [thema.fs.abkuerzungen, thema.ap.hormone], definition: "Hormon der Hypophyse, das die Schilddrüse anregt; wichtigster Suchtest für Schilddrüsenfunktionsstörungen." }
  - { id: gl.abk.ogtt, term: "oraler Glukosetoleranztest", abbreviation: "oGTT", topicIds: [thema.fs.abkuerzungen, thema.kl.diabetes], definition: "Test, bei dem nach Trinken einer Zuckerlösung der Blutzuckerverlauf gemessen wird, z. B. zur Diagnose eines Schwangerschaftsdiabetes." }
  - { id: gl.abk.ct, term: "Computertomografie", abbreviation: "CT", topicIds: [thema.fs.abkuerzungen], definition: "Schnittbildverfahren mit Röntgenstrahlen." }
  - { id: gl.abk.mrt, term: "Magnetresonanztomografie", abbreviation: "MRT", topicIds: [thema.fs.abkuerzungen], definition: "Schnittbildverfahren mit starkem Magnetfeld ohne Röntgenstrahlen; Metallteile und Implantate vorher klären.", synonyms: [Kernspintomografie] }
  - { id: gl.abk.sono, term: "Sonografie", abbreviation: "Sono", topicIds: [thema.fs.abkuerzungen], definition: "Ultraschalluntersuchung." }
  - { id: gl.abk.oegd, term: "Ösophago-Gastro-Duodenoskopie", abbreviation: "ÖGD", topicIds: [thema.fs.abkuerzungen, thema.kl.verdauung], definition: "Spiegelung von Speiseröhre, Magen und Zwölffingerdarm.", synonyms: [Gastroskopie] }
  - { id: gl.abk.ercp, term: "endoskopisch retrograde Cholangiopankreatikografie", abbreviation: "ERCP", topicIds: [thema.fs.abkuerzungen, thema.kl.verdauung], definition: "Endoskopische Darstellung von Gallen- und Pankreasgängen, z. B. zur Entfernung von Gallengangssteinen." }
  - { id: gl.abk.zvd, term: "zentraler Venendruck", abbreviation: "ZVD", topicIds: [thema.fs.abkuerzungen, thema.ph.injektion], definition: "Druck in der oberen Hohlvene vor dem rechten Vorhof, gemessen über einen ZVK." }
  - { id: gl.abk.icp, term: "intrakranieller Druck", abbreviation: "ICP", topicIds: [thema.fs.abkuerzungen, thema.kl.neuro], definition: "Druck im Schädelinneren; ein Anstieg (Hirndruck) zeigt sich z. B. durch Kopfschmerz, Erbrechen, Bewusstseinsstörung und Pupillenveränderungen.", synonyms: [Hirndruck] }
  - { id: gl.abk.nihss, term: "National Institutes of Health Stroke Scale", abbreviation: "NIHSS", topicIds: [thema.fs.abkuerzungen, thema.kl.neuro.schlaganfall], definition: "Skala zur Einschätzung des Schweregrads neurologischer Ausfälle beim Schlaganfall." }
  - { id: gl.abk.asa, term: "ASA-Klassifikation", abbreviation: "ASA", topicIds: [thema.fs.abkuerzungen, thema.ph.periop], definition: "Einteilung des Narkoserisikos nach dem körperlichen Zustand von ASA 1 (gesund) bis ASA 6 (hirntot, Organspende)." }

  # --- Krankheitsbilder ---
  - { id: gl.abk.stemi, term: "ST-Hebungsinfarkt", abbreviation: "STEMI", topicIds: [thema.fs.abkuerzungen, thema.kl.herz.khk], definition: "Herzinfarkt mit typischen ST-Strecken-Hebungen im EKG, der möglichst schnell eine Herzkatheterbehandlung braucht." }
  - { id: gl.abk.nstemi, term: "Nicht-ST-Hebungsinfarkt", abbreviation: "NSTEMI", topicIds: [thema.fs.abkuerzungen, thema.kl.herz.khk], definition: "Herzinfarkt ohne ST-Strecken-Hebung, nachgewiesen über erhöhte Herzmarker wie Troponin." }
  - { id: gl.abk.pci, term: "perkutane Koronarintervention", abbreviation: "PCI", topicIds: [thema.fs.abkuerzungen, thema.kl.herz.khk], definition: "Aufweitung verengter Herzkranzgefäße per Herzkatheter, meist mit Ballon und Stent.", synonyms: [PTCA] }
  - { id: gl.abk.ards, term: "Acute Respiratory Distress Syndrome", abbreviation: "ARDS", topicIds: [thema.fs.abkuerzungen, thema.kl.atmung], definition: "Akutes Lungenversagen mit schwerer Störung des Gasaustauschs, z. B. infolge von Sepsis oder Pneumonie." }
  - { id: gl.abk.osas, term: "obstruktives Schlafapnoe-Syndrom", abbreviation: "OSAS", topicIds: [thema.fs.abkuerzungen, thema.kl.atmung], definition: "Wiederholte Atemaussetzer im Schlaf durch Verschluss der oberen Atemwege, häufig mit Schnarchen und Tagesmüdigkeit; Therapie oft mit CPAP." }
  - { id: gl.abk.tep, term: "Totalendoprothese", abbreviation: "TEP", topicIds: [thema.fs.abkuerzungen, thema.kl.bewegung], definition: "Vollständiger künstlicher Gelenkersatz, z. B. Hüft- oder Knie-TEP." }
  - { id: gl.abk.hws, term: "Halswirbelsäule", abbreviation: "HWS", topicIds: [thema.fs.abkuerzungen, thema.ap.bewegung], definition: "Oberer Abschnitt der Wirbelsäule aus sieben Wirbeln; analog BWS (Brustwirbelsäule, zwölf Wirbel) und LWS (Lendenwirbelsäule, fünf Wirbel)." }
  - { id: gl.abk.mre, term: "multiresistente Erreger", abbreviation: "MRE", topicIds: [thema.fs.abkuerzungen, thema.kl.infektion, thema.ph.hygiene], definition: "Krankheitserreger, die gegen mehrere Antibiotikagruppen resistent sind, z. B. MRSA, MRGN und VRE." }
  - { id: gl.abk.esbl, term: "Extended-Spectrum-Beta-Laktamasen", abbreviation: "ESBL", topicIds: [thema.fs.abkuerzungen, thema.kl.infektion], definition: "Enzyme gramnegativer Bakterien, die viele Penicilline und Cephalosporine unwirksam machen." }
  - { id: gl.abk.hz, term: "Herpes Zoster", abbreviation: "HZ", topicIds: [thema.fs.abkuerzungen, thema.kl.infektion], definition: "Gürtelrose; Reaktivierung des Windpockenvirus mit schmerzhaftem, bläschenförmigem Ausschlag entlang eines Nervensegments.", synonyms: [Gürtelrose] }
  - { id: gl.abk.aids, term: "erworbenes Immunschwächesyndrom", abbreviation: "AIDS", topicIds: [thema.fs.abkuerzungen, thema.kl.infektion], definition: "Spätstadium der unbehandelten HIV-Infektion mit schwerer Abwehrschwäche und opportunistischen Infektionen." }
  - { id: gl.abk.ptbs, term: "posttraumatische Belastungsstörung", abbreviation: "PTBS", topicIds: [thema.fs.abkuerzungen, thema.kl.psych], definition: "Psychische Erkrankung nach einem extrem belastenden Ereignis mit Wiedererleben, Vermeidung und Übererregung." }
  - { id: gl.abk.adhs, term: "Aufmerksamkeitsdefizit-Hyperaktivitätsstörung", abbreviation: "ADHS", topicIds: [thema.fs.abkuerzungen, thema.kl.paediatrie, thema.kl.psych], definition: "Entwicklungsbedingte Störung mit Unaufmerksamkeit, Impulsivität und teilweise Hyperaktivität." }

  # --- Arzneimittel und Therapie ---
  - { id: gl.abk.ass, term: "Acetylsalicylsäure", abbreviation: "ASS", topicIds: [thema.fs.abkuerzungen, thema.ph.medikamente], definition: "Wirkstoff, der niedrig dosiert die Thrombozytenaggregation hemmt und höher dosiert schmerz- und fiebersenkend wirkt." }
  - { id: gl.abk.doak, term: "direkte orale Antikoagulanzien", abbreviation: "DOAK", topicIds: [thema.fs.abkuerzungen, thema.pro.thrombose, thema.ph.medikamente], definition: "Gerinnungshemmer zum Einnehmen wie Apixaban oder Rivaroxaban, die direkt Gerinnungsfaktoren hemmen.", synonyms: [NOAK] }
  - { id: gl.abk.nmh, term: "niedermolekulares Heparin", abbreviation: "NMH", topicIds: [thema.fs.abkuerzungen, thema.pro.thrombose, thema.ph.injektion], definition: "Gerinnungshemmer, der zur Thromboseprophylaxe meist einmal täglich subkutan gespritzt wird." }
  - { id: gl.abk.ace, term: "ACE-Hemmer", abbreviation: "ACE-H", topicIds: [thema.fs.abkuerzungen, thema.kl.herz.hypertonie], definition: "Blutdrucksenkende Medikamente, die das Angiotensin-Converting-Enzym hemmen; typische Nebenwirkung ist Reizhusten." }
  - { id: gl.abk.nacl, term: "Natriumchlorid-Lösung", abbreviation: "NaCl 0,9 %", topicIds: [thema.fs.abkuerzungen, thema.ph.injektion], definition: "Isotone Kochsalzlösung, z. B. als Trägerlösung, zum Spülen oder zur Flüssigkeitsgabe.", synonyms: [physiologische Kochsalzlösung] }
  - { id: gl.abk.tpn, term: "total parenterale Ernährung", abbreviation: "TPN", topicIds: [thema.fs.abkuerzungen, thema.ph.ernaehrung], definition: "Vollständige Ernährung über die Vene, wenn eine enterale Ernährung nicht möglich ist." }
  - { id: gl.abk.pca, term: "patientenkontrollierte Analgesie", abbreviation: "PCA", topicIds: [thema.fs.abkuerzungen, thema.ph.periop], definition: "Schmerztherapie, bei der die Patientin oder der Patient per Knopfdruck selbst Schmerzmittel über eine Pumpe abruft, mit eingestellter Sperrzeit und Höchstdosis." }
  - { id: gl.abk.niv, term: "nicht-invasive Beatmung", abbreviation: "NIV", topicIds: [thema.fs.abkuerzungen, thema.kl.atmung], definition: "Beatmung über eine dicht sitzende Maske ohne Intubation, z. B. bei COPD-Exazerbation." }
  - { id: gl.abk.cpap, term: "Continuous Positive Airway Pressure", abbreviation: "CPAP", topicIds: [thema.fs.abkuerzungen, thema.kl.atmung], definition: "Atemunterstützung mit kontinuierlich positivem Druck in den Atemwegen, z. B. bei Schlafapnoe." }
  - { id: gl.abk.vac, term: "Vakuumversiegelungstherapie", abbreviation: "VAC", topicIds: [thema.fs.abkuerzungen, thema.ph.wunde], definition: "Wundbehandlung mit kontrolliertem Unterdruck über einen luftdichten Verband, der Exsudat absaugt und die Granulation fördert.", synonyms: [Unterdrucktherapie, NPWT] }
  - { id: gl.abk.btmg, term: "Betäubungsmittelgesetz", abbreviation: "BtMG", topicIds: [thema.fs.abkuerzungen, thema.ph.medikamente, thema.re.berufsrecht], definition: "Gesetz über den Verkehr mit Betäubungsmitteln; Verordnung und Dokumentation regelt die Betäubungsmittel-Verschreibungsverordnung (BtMVV)." }

  # --- Einrichtungen und Dienste ---
  - { id: gl.abk.its, term: "Intensivstation", abbreviation: "ITS", topicIds: [thema.fs.abkuerzungen, thema.fa.akut], definition: "Station zur Überwachung und Behandlung lebensbedrohlich erkrankter Menschen.", synonyms: [ICU] }
  - { id: gl.abk.imc, term: "Intermediate Care", abbreviation: "IMC", topicIds: [thema.fs.abkuerzungen, thema.fa.akut], definition: "Überwachungsstation zwischen Normal- und Intensivstation." }
  - { id: gl.abk.zna, term: "Zentrale Notaufnahme", abbreviation: "ZNA", topicIds: [thema.fs.abkuerzungen, thema.beo.notfall], definition: "Krankenhausbereich für die Erstversorgung von Notfällen mit Ersteinschätzung (Triage), z. B. nach dem Manchester-Triage-System." }
  - { id: gl.abk.rtw, term: "Rettungswagen", abbreviation: "RTW", topicIds: [thema.fs.abkuerzungen, thema.beo.notfall], definition: "Fahrzeug des Rettungsdienstes zur Notfallversorgung und zum Transport; bei Bedarf mit Notärztin oder Notarzt (NA)." }
  - { id: gl.abk.op, term: "Operation", abbreviation: "OP", topicIds: [thema.fs.abkuerzungen, thema.ph.periop], definition: "Chirurgischer Eingriff; auch Kurzform für den Operationssaal." }
  - { id: gl.abk.hno, term: "Hals-Nasen-Ohren-Heilkunde", abbreviation: "HNO", topicIds: [thema.fs.abkuerzungen], definition: "Medizinisches Fachgebiet für Erkrankungen von Ohren, Nase, Nasennebenhöhlen, Mundhöhle, Rachen und Kehlkopf." }
  - { id: gl.abk.pdl, term: "Pflegedienstleitung", abbreviation: "PDL", topicIds: [thema.fs.abkuerzungen, thema.re.berufsrecht], definition: "Verantwortliche Pflegefachperson für die pflegerische Leitung einer Einrichtung oder eines Pflegedienstes." }
  - { id: gl.abk.wbl, term: "Wohnbereichsleitung", abbreviation: "WBL", topicIds: [thema.fs.abkuerzungen, thema.fa.langzeit], definition: "Pflegefachperson, die einen Wohnbereich in einer stationären Pflegeeinrichtung leitet." }
  - { id: gl.abk.anp, term: "Advanced Nursing Practice", abbreviation: "ANP", topicIds: [thema.fs.abkuerzungen, thema.qw.ebn], definition: "Erweiterte Pflegepraxis durch akademisch qualifizierte Pflegeexpertinnen und -experten (APN) mit vertieftem klinischem Wissen." }
  - { id: gl.abk.gkv, term: "gesetzliche Krankenversicherung", abbreviation: "GKV", topicIds: [thema.fs.abkuerzungen, thema.re.sgb5], definition: "Pflichtversicherung für die meisten Beschäftigten, geregelt im SGB V; daneben die private Krankenversicherung (PKV)." }
  - { id: gl.abk.spv, term: "soziale Pflegeversicherung", abbreviation: "SPV", topicIds: [thema.fs.abkuerzungen, thema.re.sgb11], definition: "Seit 1995 bestehender Zweig der Sozialversicherung, geregelt im SGB XI; die Pflegekassen sind bei den Krankenkassen angesiedelt." }
  - { id: gl.abk.au, term: "Arbeitsunfähigkeit", abbreviation: "AU", topicIds: [thema.fs.abkuerzungen, thema.re.arbeitsrecht], definition: "Zustand, in dem Beschäftigte krankheitsbedingt ihre Arbeit nicht ausüben können; ärztlich bescheinigt." }
  - { id: gl.abk.bgw, term: "Berufsgenossenschaft für Gesundheitsdienst und Wohlfahrtspflege", abbreviation: "BGW", topicIds: [thema.fs.abkuerzungen, thema.re.arbeitsrecht], definition: "Träger der gesetzlichen Unfallversicherung für Beschäftigte im Gesundheitswesen; zuständig bei Arbeitsunfällen und Berufskrankheiten." }
  - { id: gl.abk.trba, term: "Technische Regel für Biologische Arbeitsstoffe 250", abbreviation: "TRBA 250", topicIds: [thema.fs.abkuerzungen, thema.ph.hygiene, thema.re.arbeitsrecht], definition: "Arbeitsschutzregel für biologische Arbeitsstoffe im Gesundheitswesen, z. B. mit Vorgaben zu Schutzkleidung und sicheren Instrumenten." }
  - { id: gl.abk.rki, term: "Robert Koch-Institut", abbreviation: "RKI", topicIds: [thema.fs.abkuerzungen, thema.ph.hygiene], definition: "Bundesinstitut für Infektionskrankheiten und öffentliche Gesundheit." }
  - { id: gl.abk.who, term: "Weltgesundheitsorganisation", abbreviation: "WHO", topicIds: [thema.fs.abkuerzungen], definition: "Organisation der Vereinten Nationen für öffentliche Gesundheit." }
  - { id: gl.abk.awmf, term: "Arbeitsgemeinschaft der Wissenschaftlichen Medizinischen Fachgesellschaften", abbreviation: "AWMF", topicIds: [thema.fs.abkuerzungen, thema.qw.ebn], definition: "Dachverband, der das Register für medizinische Leitlinien in Deutschland führt." }
  - { id: gl.abk.erc, term: "European Resuscitation Council", abbreviation: "ERC", topicIds: [thema.fs.abkuerzungen, thema.beo.notfall], definition: "Europäischer Rat für Wiederbelebung, der die Reanimationsleitlinien herausgibt." }
  - { id: gl.abk.rosc, term: "Return of Spontaneous Circulation", abbreviation: "ROSC", topicIds: [thema.fs.abkuerzungen, thema.beo.notfall], definition: "Wiedereinsetzen eines eigenen Kreislaufs während einer Reanimation." }

  # --- Recht ---
  - { id: gl.abk.bgb, term: "Bürgerliches Gesetzbuch", abbreviation: "BGB", topicIds: [thema.fs.abkuerzungen, thema.re.betreuung], definition: "Zentrales Gesetz des Zivilrechts, u. a. mit Regelungen zu Geschäftsfähigkeit, Betreuung, Behandlungsvertrag und Haftung." }
