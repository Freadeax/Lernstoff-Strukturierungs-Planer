  # ---------------------------------------------------------------- Niere, Leber, Onkologie
  - id: kh.niereninsuffizienz
    name: Chronische Niereninsuffizienz
    synonyms: [chronische Nierenerkrankung, CKD, Nierenversagen, Dialysepflicht]
