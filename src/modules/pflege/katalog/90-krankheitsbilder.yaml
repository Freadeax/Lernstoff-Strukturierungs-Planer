    referenceIds: [es.dekubitus, es.wunden]
    topicIds: [thema.pro.dekubitus, thema.ph.wunde]
    pruefstatus: ungeprueft

  # ---------------------------------------------------------------- Infektionen
  - id: kh.hwi
    name: Harnwegsinfektion
    synonyms: [Harnwegsinfekt, HWI, Zystitis, Blasenentzündung, Pyelonephritis]
    definition: "Entzündung der ableitenden Harnwege durch Krankheitserreger, meist Bakterien aus dem eigenen Darm, die über die Harnröhre aufsteigen. Untere Harnwegsinfektion = Blasenentzündung (Zystitis), obere = Nierenbeckenentzündung (Pyelonephritis)."
    formen:
      - "Unkompliziert: Zystitis bei sonst gesunden, nicht schwangeren Frauen"
      - "Kompliziert: bei Männern, Schwangeren, Diabetes, Abflussstörungen oder Blasenkatheter"
      - "Katheterassoziierte Harnwegsinfektion: häufigste Krankenhausinfektion"
    ursachen: ["Meist Escherichia coli aus der Darmflora", "Aufsteigende Infektion über die Harnröhre"]
    risikofaktoren:
      - "Weibliches Geschlecht (kurze Harnröhre)"
      - "Blasendauerkatheter und Einmalkatheterismus"
      - "Restharn, z. B. bei Prostatavergrößerung, Blasenentleerungsstörung oder Immobilität"
      - "Geringe Trinkmenge, Inkontinenz und feuchte Vorlagen"
      - "Diabetes mellitus, geschwächtes Immunsystem, hohes Alter"
      - "Intimpflege von hinten nach vorn"
    symptome:
      - "Brennen und Schmerzen beim Wasserlassen (Dysurie)"
      - "Häufiger Harndrang mit kleinen Mengen (Pollakisurie), Unterbauchschmerzen"
      - "Trüber, übel riechender, manchmal blutiger Urin"
      - "Pyelonephritis: Fieber, Schüttelfrost, Flankenschmerz, deutliches Krankheitsgefühl"
      - "Bei alten Menschen oft untypisch: neue Verwirrtheit, neue Inkontinenz, Sturz, Schwäche"
    komplikationen: ["Aufsteigende Infektion zur Pyelonephritis", "Urosepsis: Notfall", "Delir bei alten Menschen"]
    diagnostik:
      - "Urinteststreifen: Leukozyten, Nitrit, Blut"
      - "Urinkultur aus Mittelstrahlurin, bei Katheter aus der Punktionsstelle des Ableitungssystems, nie aus dem Beutel"
      - "Bei Fieber: Entzündungswerte, ggf. Blutkulturen und Ultraschall der Nieren"
    therapie: ["Antibiotika nach ärztlicher Anordnung und Antibiogramm", "Reichlich trinken, sofern keine Trinkmengenbegrenzung besteht", "Schmerzmittel nach Anordnung"]
    pflege:
      - "Trinkmenge beobachten und fördern, bei Bedarf Ein- und Ausfuhr dokumentieren"
      - "Vitalzeichen und Temperatur kontrollieren, Fieber, Flankenschmerz und Verwirrtheit sofort melden"
      - "Urin beobachten: Menge, Farbe, Geruch, Beimengungen"
      - "Intimpflege von vorn nach hinten, Vorlagen rechtzeitig wechseln"
      - "Bei Blasenkatheter: Notwendigkeit täglich ärztlich prüfen lassen, geschlossenes System nicht diskonnektieren, Beutel immer unter Blasenniveau und ohne Bodenkontakt"
      - "Urinprobe korrekt gewinnen und rasch ins Labor bringen oder kühlen"
    beratung: ["Viel trinken und Blase regelmäßig vollständig entleeren", "Intimhygiene von vorn nach hinten, nach dem Geschlechtsverkehr Wasser lassen", "Antibiotika vollständig nach Plan einnehmen"]
    prophylaxen:
      - { topicId: thema.pro.zystitis, grund: "Trinken, Hygiene und Katheterpflege verhindern neue Infektionen" }
      - { topicId: thema.pro.dehydratation, grund: "Fieber erhöht den Bedarf, eine zu geringe Trinkmenge fördert die Infektion" }
      - { topicId: thema.pro.delir, grund: "Harnwegsinfekte sind eine häufige Delir-Ursache im Alter" }
    merksatz: "Alter Mensch plötzlich verwirrt oder neu inkontinent: auch an einen Harnwegsinfekt denken."
    drugIds: [arz.paracetamol]
    assessmentIds: [as.news]
    referenceIds: [es.kontinenz]
    topicIds: [thema.kl.niere, thema.pro.zystitis]
    pruefstatus: ungeprueft

  - id: kh.sepsis
    name: Sepsis
    synonyms: [Blutvergiftung, Urosepsis, septischer Schock]
    definition: "Lebensbedrohliche Organfunktionsstörung durch eine fehlgesteuerte Reaktion des Körpers auf eine Infektion. Ein zeitkritischer Notfall: Jede Stunde Verzögerung der Behandlung verschlechtert die Überlebenschance."
    formen:
      - "Sepsis: Infektion mit Organfunktionsstörung"
      - "Septischer Schock: Kreislaufversagen, das trotz Flüssigkeitsgabe Medikamente zur Blutdruckstabilisierung braucht"
    ursachen: ["Ausgangspunkt meist Lunge (Pneumonie), Harnwege (Urosepsis), Bauchraum, Haut und Wunden", "Venenverweilkanülen, zentrale Katheter und Blasenkatheter als Eintrittspforten"]
    risikofaktoren: ["Hohes Alter, Säuglinge", "Chronische Erkrankungen wie Diabetes, COPD, Krebs, Niereninsuffizienz", "Geschwächtes Immunsystem, z. B. unter Chemotherapie oder Kortison", "Liegende Katheter, frische Operationen und Wunden"]
    symptome:
      - "Schnelle Atmung, Atemnot"
      - "Schneller Puls, niedriger Blutdruck"
      - "Neue Verwirrtheit, Schläfrigkeit oder Unruhe"
      - "Fieber oder Untertemperatur, Schüttelfrost"
      - "Kalte, marmorierte Haut, verlängerte Rekapillarisierungszeit, wenig Urin"
      - "Starkes Krankheitsgefühl: „Ich fühle mich so krank wie noch nie“"
    komplikationen: ["Septischer Schock", "Multiorganversagen (Niere, Lunge, Gerinnung)", "Langzeitfolgen nach Sepsis: Muskelschwäche, Gedächtnisstörungen, Erschöpfung"]
    diagnostik:
      - "Früherkennung mit NEWS2 oder qSOFA (Atemfrequenz ab 22/min, systolischer Blutdruck bis 100 mmHg, veränderter Bewusstseinszustand: ab 2 Kriterien Verdacht)"
      - "Blutkulturen vor Beginn der Antibiotika, Laktat, Entzündungswerte"
      - "Suche nach dem Infektionsherd"
    therapie:
      - "Antibiotika möglichst innerhalb der ersten Stunde nach ärztlicher Anordnung"
      - "Flüssigkeit i. v., Sauerstoff nach Anordnung"
      - "Herdsanierung (z. B. Katheter wechseln, Abszess eröffnen)"
      - "Bei Schock Intensivtherapie mit kreislaufstützenden Medikamenten"
    pflege:
      - "Bei Verdacht sofort ärztlich informieren bzw. Notfallteam rufen, nicht bis zur nächsten Visite warten"
      - "Vitalzeichen engmaschig: Atemfrequenz, Sättigung, Blutdruck, Puls, Bewusstsein, Temperatur; NEWS2 berechnen und Verlauf dokumentieren"
      - "Ausfuhr überwachen, bei Bedarf Bilanz und stündliche Urinmenge"
      - "Blutkulturen und Laborproben vorbereiten, Zugänge sichern"
      - "Eintrittspforten beobachten: Einstichstellen, Wunden, Katheter"
      - "Händehygiene und aseptischer Umgang mit Zugängen und Kathetern"
    beratung: ["Angehörige über Warnzeichen informieren", "Impfungen (Pneumokokken, Grippe) senken das Risiko", "Nach der Entlassung Folgen wie Erschöpfung ernst nehmen und Reha nutzen"]
    prophylaxen:
      - { topicId: thema.pro.pneumonie, grund: "Pneumonie ist der häufigste Ausgangspunkt" }
      - { topicId: thema.pro.zystitis, grund: "Harnwegsinfekte können zur Urosepsis führen" }
      - { topicId: thema.pro.dekubitus, grund: "Schlechte Durchblutung im Schock gefährdet die Haut" }
    merksatz: "Sepsis ist ein Notfall wie Herzinfarkt und Schlaganfall: Zeit ist Leben."
    drugIds: [arz.amoxicillin, arz.paracetamol]
    assessmentIds: [as.news, as.gcs]
    topicIds: [thema.kl.infektion]
    pruefstatus: ungeprueft

  # ---------------------------------------------------------------- Geriatrie und Bewegung
  - id: kh.delir
    name: Delir
    synonyms: [akuter Verwirrtheitszustand, Durchgangssyndrom]
    definition: "Akut auftretende Störung von Aufmerksamkeit, Bewusstsein und Denken, die im Tagesverlauf schwankt. Ein Delir hat immer eine körperliche Ursache und ist ein medizinischer Notfall, keine normale Alterserscheinung."
    formen:
      - "Hyperaktiv: unruhig, nestelt, will weglaufen, wehrt sich, Halluzinationen"
      - "Hypoaktiv: still, schläfrig, zurückgezogen; wird am häufigsten übersehen"
      - "Gemischt: Wechsel zwischen beiden Formen"
    ursachen:
      - "Infektionen (Harnwegsinfekt, Pneumonie)"
      - "Flüssigkeitsmangel, Elektrolytstörungen, Unterzuckerung"
      - "Medikamente, z. B. Benzodiazepine, Opioide, anticholinerg wirkende Mittel"
      - "Operationen und Narkose, Schmerzen"
      - "Harnverhalt, Obstipation, Sauerstoffmangel"
      - "Alkohol- oder Medikamentenentzug"
    risikofaktoren: ["Hohes Alter, Demenz", "Seh- und Hörminderung", "Mehrere Medikamente", "Schwere Erkrankung, Gebrechlichkeit", "Fremde Umgebung, Schlafmangel, Fixierung, Blasenkatheter"]
    symptome:
      - "Plötzlicher Beginn innerhalb von Stunden bis Tagen"
      - "Aufmerksamkeitsstörung: kann einem Gespräch nicht folgen"
      - "Desorientierung, Gedächtnisstörung, verworrenes Denken"
      - "Schwankender Verlauf, oft nachts schlechter, gestörter Tag-Nacht-Rhythmus"
      - "Unruhe oder Antriebsarmut, Angst, Halluzinationen"
    komplikationen: ["Stürze, Verletzungen, Herausziehen von Zugängen", "Längerer Krankenhausaufenthalt, Pflegebedürftigkeit", "Höhere Sterblichkeit", "Bleibende kognitive Einbußen"]
    diagnostik:
      - "Screening, z. B. mit 4AT oder CAM (Confusion Assessment Method)"
      - "Abgrenzung zur Demenz: Delir beginnt akut und schwankt, Demenz entwickelt sich schleichend"
      - "Ursachensuche: Vitalzeichen, Blutzucker, Urin, Labor, Medikamentenliste, Ausscheidung"
    therapie: ["Ursache behandeln", "Auslösende Medikamente nach ärztlicher Prüfung absetzen", "Medikamente gegen Unruhe nur nach ärztlicher Anordnung und so kurz wie möglich"]
    pflege:
      - "Veränderung sofort melden und beschreiben: seit wann, wie, im Vergleich zu vorher"
      - "Orientierung geben: Uhr, Kalender, Tageslicht, sich mit Namen vorstellen, kurze klare Sätze"
      - "Brille und Hörgerät aufsetzen, vertraute Gegenstände, möglichst gleiche Pflegepersonen"
      - "Angehörige einbeziehen, Besuche ermöglichen"
      - "Tag-Nacht-Rhythmus fördern: tagsüber aktivieren, nachts Ruhe und gedämpftes Licht"
      - "Trinken, Ausscheidung und Schmerzen beobachten, früh mobilisieren"
      - "Freiheitsentziehende Maßnahmen vermeiden; Sturzrisiko anders reduzieren"
    beratung: ["Angehörige über Ursachen und Verlauf aufklären: Der Mensch ist nicht „verrückt geworden“", "Vor geplanten Operationen auf Delirrisiko hinweisen, Brille und Hörgerät mitbringen"]
    prophylaxen:
      - { topicId: thema.pro.delir, grund: "Viele Delirien lassen sich durch Orientierung, Trinken, Mobilisation und Schlaf verhindern" }
      - { topicId: thema.pro.dehydratation, grund: "Flüssigkeitsmangel ist ein häufiger Auslöser" }
      - { topicId: thema.pro.sturz, grund: "Unruhe und Desorientierung erhöhen das Sturzrisiko" }
      - { topicId: thema.pro.obstipation, grund: "Obstipation und Harnverhalt können ein Delir auslösen" }
    merksatz: "Delir: plötzlich, schwankend, unaufmerksam. Immer nach der Ursache suchen."
    drugIds: [arz.haloperidol, arz.melperon, arz.lorazepam]
    assessmentIds: [as.mmst, as.gcs]
    referenceIds: [es.demenz, es.sturz]
    topicIds: [thema.kl.demenz, thema.pro.delir]
    pruefstatus: ungeprueft

  - id: kh.femurfraktur
    name: Proximale Femurfraktur
    synonyms: [Oberschenkelhalsfraktur, Schenkelhalsfraktur, hüftnahe Fraktur, pertrochantäre Fraktur]
    definition: "Bruch des Oberschenkelknochens nahe dem Hüftgelenk, meist am Schenkelhals oder zwischen den Rollhügeln. Typische Verletzung alter Menschen nach einem Sturz, oft bei Osteoporose."
    formen:
      - "Schenkelhalsfraktur: Bruch innerhalb oder nahe der Gelenkkapsel"
      - "Pertrochantäre Fraktur: Bruch im Bereich der Rollhügel"
    ursachen: ["Sturz auf die Hüfte, meist aus dem Stand", "Verminderte Knochendichte (Osteoporose)"]
    risikofaktoren: ["Hohes Alter, Osteoporose", "Sturzrisiko: Gangunsicherheit, Schwindel, Sehminderung, Demenz", "Sturzfördernde Medikamente, z. B. Schlafmittel und Blutdrucksenker", "Untergewicht, Bewegungsmangel"]
    symptome:
      - "Schmerzen in der Leiste oder Hüfte, Bein kann nicht belastet werden"
      - "Bein verkürzt und nach außen gedreht"
      - "Bluterguss, Schwellung"
      - "Bei eingestauchter Fraktur manchmal noch gehfähig: Schmerz nach Sturz immer abklären lassen"
    komplikationen:
      - "Blutverlust, Kreislaufprobleme"
      - "Thrombose, Lungenembolie, Pneumonie, Dekubitus durch Immobilität"
      - "Delir nach Sturz und Operation"
      - "Nach Endoprothese: Luxation, Wundinfektion"
      - "Hüftkopfnekrose nach gelenkerhaltender Operation"
      - "Verlust der Selbstständigkeit, erneute Stürze"
    diagnostik: ["Röntgen von Becken und Hüfte, ggf. CT", "Labor und Gerinnung zur OP-Vorbereitung"]
    therapie:
      - "Meist zeitnahe Operation (möglichst innerhalb von 24 Stunden)"
      - "Endoprothese (Hemi- oder Totalendoprothese) oder Osteosynthese mit Nagel oder Schrauben"
      - "Schmerztherapie, Thromboseprophylaxe und Osteoporosebehandlung nach Anordnung"
      - "Alterstraumatologische Frührehabilitation"
    pflege:
      - "Schmerz regelmäßig einschätzen (NRS oder BESD) und Schmerzmittel nach Anordnung rechtzeitig vor der Mobilisation geben"
      - "Frühmobilisation ab dem ersten Tag nach der OP nach ärztlicher Anordnung und Belastungsvorgabe, mit Physiotherapie"
      - "Bewegungseinschränkungen nach Vorgabe der Operateurin einhalten (Luxationsprophylaxe bei Endoprothese)"
      - "Wunde, Verband und Drainage beobachten, Durchblutung, Motorik und Sensibilität des Beins kontrollieren"
      - "Vitalzeichen, Ausscheidung und Bewusstsein beobachten (Blutverlust, Delir)"
      - "Sturzursachen klären und sichere Umgebung schaffen"
    beratung: ["Gehhilfen sicher nutzen, Bewegungseinschränkungen im Alltag umsetzen", "Wohnung sturzsicher machen, Hüftprotektoren erwägen", "Osteoporose behandeln: Bewegung, Kalzium und Vitamin D nach ärztlicher Anordnung"]
    prophylaxen:
      - { topicId: thema.pro.thrombose, grund: "Immobilität und Operation an der unteren Extremität" }
      - { topicId: thema.pro.sturz, grund: "Der nächste Sturz ist das größte Risiko" }
      - { topicId: thema.pro.dekubitus, grund: "Schmerzbedingte Immobilität, Fersen und Kreuzbein gefährdet" }
      - { topicId: thema.pro.pneumonie, grund: "Bettlägerigkeit und flache Atmung" }
      - { topicId: thema.pro.delir, grund: "Häufige Komplikation nach Sturz und Operation" }
    merksatz: "Sturz, Leistenschmerz, Bein kurz und außenrotiert: an eine Schenkelhalsfraktur denken."
    drugIds: [arz.metamizol, arz.enoxaparin, arz.alendronsaeure]
    assessmentIds: [as.nrs, as.besd, as.tug, as.braden]
    referenceIds: [es.sturz, es.mobilitaet, es.schmerz]
    topicIds: [thema.kl.bewegung]
    pruefstatus: ungeprueft

  # ---------------------------------------------------------------- Atemwege und Gefäße (Ergänzung 2026-11)
  # Alle folgenden Steckbriefe: übliches Lehrbuchwissen, nicht mit dem Unterrichtsmaterial abgeglichen.
  - id: kh.asthma
    name: Asthma bronchiale
    synonyms: [Asthma, Bronchialasthma, Status asthmaticus]
    definition: "Chronisch-entzündliche Erkrankung der Atemwege mit überempfindlichen Bronchien. Anfallsweise verengen sich die Bronchien (Bronchospasmus, Schleimhautschwellung, zäher Schleim); die Verengung ist, anders als bei COPD, weitgehend rückbildungsfähig."
    formen:
      - "Allergisches (extrinsisches) Asthma: Auslöser sind Allergene, häufig schon im Kindesalter"
      - "Nicht-allergisches (intrinsisches) Asthma: Auslöser sind Infekte, Kälte, Anstrengung, Medikamente oder Reizstoffe"
      - "Mischformen sind häufig"
    ursachen: ["Genetische Veranlagung mit Neigung zu Allergien", "Chronische Entzündung der Bronchialschleimhaut"]
    risikofaktoren:
      - "Allergene: Pollen, Hausstaubmilben, Tierhaare, Schimmelpilze"
      - "Atemwegsinfekte, kalte Luft, körperliche Anstrengung"
      - "Tabakrauch, Duftstoffe, Reizgase"
      - "Medikamente wie ASS und andere NSAR (Analgetika-Asthma) oder Betablocker"
      - "Psychische Belastung"
    symptome:
      - "Anfallsartige Atemnot, oft nachts oder frühmorgens"
      - "Erschwerte, verlängerte Ausatmung mit Giemen und Brummen"
      - "Trockener Reizhusten, zäher, glasiger Schleim"
      - "Engegefühl in der Brust, Angst"
      - "Im Anfall: sitzt aufrecht, stützt die Arme auf (Einsatz der Atemhilfsmuskulatur)"
    komplikationen:
      - "Schwerer Asthmaanfall bzw. Status asthmaticus: Anfall, der auf die Notfallmedikamente nicht anspricht; lebensbedrohlich"
      - "Warnzeichen: Sprechen nur in Einzelworten, Zyanose, sehr schnelle Atmung, „stille Lunge“ (kaum Atemgeräusch), Erschöpfung, Verwirrtheit"
      - "Langfristig Umbau der Atemwege bei unzureichender Behandlung"
    diagnostik:
      - "Lungenfunktionsprüfung (Spirometrie) mit Bronchospasmolysetest"
      - "Peak-Flow-Messung und Peak-Flow-Tagebuch"
      - "Allergietestung"
      - "Im Anfall: Atemfrequenz, Sättigung, Puls, Sprechfähigkeit"
    therapie:
      - "Stufentherapie nach ärztlicher Anordnung"
      - "Bedarfsmedikation: kurz wirksames inhalatives Beta-2-Sympathomimetikum (z. B. Salbutamol), je nach Stufe auch in Kombination mit einem inhalativen Kortikosteroid"
      - "Dauermedikation (Controller): inhalative Kortikosteroide, ggf. lang wirksame Beta-2-Sympathomimetika"
      - "Im schweren Anfall: Sauerstoff, Bronchodilatatoren, systemisches Kortison nach Anordnung; Notarzt"
      - "Auslöser meiden"
    pflege:
      - "Im Anfall Ruhe bewahren, nicht allein lassen, beruhigend sprechen"
      - "Atemerleichternde Sitzposition (Kutschersitz, Arme aufstützen), enge Kleidung öffnen, Fenster öffnen"
      - "Lippenbremse anleiten"
      - "Bedarfsmedikament nach Anordnung bzw. Notfallplan geben lassen oder geben, Wirkung beobachten"
      - "Atemfrequenz, Sättigung, Puls, Hautfarbe und Sprechfähigkeit engmaschig beobachten, Warnzeichen sofort melden"
      - "Inhalationstechnik bei jeder Gabe überprüfen"
      - "Auslöser im Zimmer vermeiden: keine Duftstoffe, keine Blumen bei Pollenallergie"
    beratung:
      - "Unterschied zwischen Bedarfs- und Dauermedikament erklären: Das Dauermedikament auch ohne Beschwerden regelmäßig nehmen"
      - "Richtige Inhalationstechnik, ggf. mit Spacer; nach inhalativem Kortison Mund ausspülen oder vorher essen (Soorprophylaxe)"
      - "Peak-Flow-Tagebuch führen, Notfallplan kennen"
      - "Auslöser erkennen und meiden, nicht rauchen"
      - "Asthmaschulung, Sport mit Aufwärmen ist erwünscht"
    prophylaxen:
      - { topicId: thema.pro.soor, grund: "Inhalative Kortikosteroide fördern Mundsoor, deshalb nach der Inhalation Mund spülen" }
      - { topicId: thema.pro.pneumonie, grund: "Atemwegsinfekte sind häufige Auslöser und verschlechtern das Asthma" }
    merksatz: "Asthma: Ausatmung erschwert, Bronchien eng, aber rückbildungsfähig. Stille Lunge ist ein Alarmzeichen."
    drugIds: [arz.salbutamol, arz.budesonid, arz.prednisolon, arz.methylprednisolon]
    assessmentIds: [as.news]
    topicIds: [thema.kl.atmung]
    pruefstatus: ungeprueft

  - id: kh.pavk
    name: Periphere arterielle Verschlusskrankheit
    synonyms: [pAVK, Schaufensterkrankheit, Claudicatio intermittens, Raucherbein]
    definition: "Verengung oder Verschluss der Arterien, meist der Beine, fast immer durch Arteriosklerose. Die Muskulatur wird bei Belastung, im späten Stadium auch in Ruhe, nicht ausreichend mit Blut versorgt."
    formen:
      - "Stadium I nach Fontaine: Verengung ohne Beschwerden"
      - "Stadium II: Schmerzen beim Gehen (Claudicatio intermittens); IIa schmerzfreie Gehstrecke über 200 m, IIb unter 200 m"
      - "Stadium III: Ruheschmerz, besonders nachts im Liegen"
      - "Stadium IV: Gewebsuntergang (Nekrose, Gangrän, Ulkus)"
    ursachen: ["Arteriosklerose der Beinarterien", "Seltener Gefäßentzündungen oder Embolien"]
    risikofaktoren: ["Rauchen (wichtigster Risikofaktor)", "Diabetes mellitus", "Arterielle Hypertonie", "Fettstoffwechselstörung", "Höheres Alter, Bewegungsmangel"]
    symptome:
      - "Belastungsabhängige Wadenschmerzen, die nach kurzer Pause verschwinden"
      - "Kühle, blasse Haut am betroffenen Bein, schwache oder fehlende Fußpulse"
      - "Haarausfall am Unterschenkel, verdickte Nägel, schlecht heilende Wunden"
      - "Ruheschmerz, der sich bessert, wenn das Bein herabhängt"
    komplikationen:
      - "Nicht heilende Wunden, Gangrän bis zur Amputation"
      - "Akuter Gefäßverschluss: plötzlicher Schmerz, Blässe, Pulslosigkeit, Gefühlsstörung, Lähmung (6 P nach Pratt): Notfall"
      - "Hohes Risiko für Herzinfarkt und Schlaganfall, weil die Arteriosklerose den ganzen Körper betrifft"
    diagnostik:
      - "Pulse tasten an Leiste, Kniekehle und Fuß"
      - "Knöchel-Arm-Index (ABI) mit Doppler"
      - "Gehtest (schmerzfreie Gehstrecke), Ratschow-Lagerungsprobe"
      - "Duplexsonografie, ggf. Angiografie"
    therapie:
      - "Risikofaktoren behandeln: Rauchstopp, Blutzucker, Blutdruck, Blutfette"
      - "Strukturiertes Gehtraining in den Stadien I und II"
      - "Thrombozytenaggregationshemmer und Statin nach ärztlicher Anordnung"
      - "Gefäßerweiterung per Katheter (Ballon, Stent) oder Bypass-Operation; als letzte Möglichkeit Amputation"
    pflege:
      - "Bein nicht hochlagern, sondern flach oder leicht tief lagern (Gegensatz zur venösen Erkrankung)"
      - "Keine Kompressionsstrümpfe ohne ärztliche Anordnung, keine einschnürende Kleidung"
      - "Keine Wärmflaschen oder Heizkissen: verminderte Wahrnehmung, Verbrennungsgefahr; warm halten mit Wollsocken"
      - "Füße täglich inspizieren: Farbe, Temperatur, Pulse, Wunden, Druckstellen; Veränderungen melden"
      - "Druckentlastung an Fersen und Zehen, gut sitzendes Schuhwerk"
      - "Fußpflege vorsichtig, Nägel nicht mit spitzen Gegenständen schneiden, kleinste Verletzungen vermeiden"
      - "Gehtraining unterstützen: bis kurz vor die Schmerzgrenze gehen, Pause, weitergehen"
    beratung:
      - "Rauchstopp ist die wichtigste Maßnahme; Hilfsangebote vermitteln"
      - "Täglich gehen, Gefäßsportgruppe"
      - "Tägliche Fußkontrolle, bei Diabetes besonders"
      - "Medikamente regelmäßig einnehmen"
    prophylaxen:
      - { topicId: thema.pro.dekubitus, grund: "Schlecht durchblutete Haut an Fersen und Zehen ist besonders druckempfindlich" }
      - { topicId: thema.pro.sturz, grund: "Schmerzen und eingeschränkte Gehstrecke verunsichern beim Gehen" }
    merksatz: "pAVK: Bein tief, warm, aber ohne Wärmflasche. Venös: Bein hoch."
    drugIds: [arz.acetylsalicylsaeure, arz.clopidogrel, arz.simvastatin]
    referenceIds: [es.wunden]
    topicIds: [thema.kl.herz.pavk]
    pruefstatus: ungeprueft

  # ---------------------------------------------------------------- Neurologie
  - id: kh.epilepsie
    name: Epilepsie
    synonyms: [Krampfanfall, Grand Mal, Status epilepticus, Anfallsleiden]
    definition: "Neigung zu wiederholten epileptischen Anfällen ohne akuten Auslöser. Ein Anfall entsteht durch eine plötzliche, übermäßige und gleichzeitige Entladung von Nervenzellen im Gehirn."
    formen:
      - "Fokaler Anfall: beginnt in einer Hirnregion, z. B. Zuckungen einer Hand, mit oder ohne Bewusstseinsstörung"
      - "Generalisierter Anfall: betrifft beide Hirnhälften, z. B. tonisch-klonischer Anfall (Grand Mal) oder Absence"
      - "Status epilepticus: Anfall über 5 Minuten oder Anfallsserie ohne Erholung dazwischen; Notfall"
    ursachen:
      - "Strukturell: Schlaganfall, Hirntumor, Schädel-Hirn-Trauma, Entzündung, Fehlbildung"
      - "Genetisch"
      - "Oft bleibt die Ursache unbekannt"
    risikofaktoren:
      - "Anfallsauslöser: Schlafmangel, Alkohol und Alkoholentzug, Flackerlicht, Fieber"
      - "Vergessene oder abgesetzte Antiepileptika"
      - "Unterzuckerung, Elektrolytstörungen"
    symptome:
      - "Tonisch-klonischer Anfall: Bewusstlosigkeit, Sturz, Initialschrei, Verkrampfung (tonisch), dann rhythmische Zuckungen (klonisch)"
      - "Zungenbiss, Schaum vor dem Mund, Einnässen, kurzzeitige Zyanose"
      - "Danach Nachschlaf, Verwirrtheit, Kopfschmerz, Muskelkater"
      - "Absence: wenige Sekunden abwesend, starrer Blick, keine Erinnerung"
      - "Manche Betroffene spüren eine Aura vor dem Anfall"
    komplikationen:
      - "Verletzungen durch den Sturz, Zungenbiss"
      - "Aspiration"
      - "Status epilepticus mit Sauerstoffmangel und Hirnschädigung"
      - "Plötzlicher unerwarteter Tod bei Epilepsie (SUDEP), selten"
    diagnostik:
      - "Genaue Anfallsbeschreibung durch Zeugen ist entscheidend"
      - "EEG, MRT des Kopfes"
      - "Labor: Blutzucker, Elektrolyte, Medikamentenspiegel"
    therapie:
      - "Antiepileptika als Dauertherapie nach ärztlicher Anordnung, z. B. Levetiracetam"
      - "Im Anfall über 5 Minuten: Benzodiazepin als Notfallmedikament nach Anordnung, Notarzt"
      - "Bei Therapieresistenz ggf. Operation"
    pflege:
      - "Im Anfall Ruhe bewahren, bei der Person bleiben, Uhrzeit notieren"
      - "Verletzungen verhindern: Gegenstände wegräumen, Kopf polstern, nicht festhalten"
      - "Nichts in den Mund schieben, keinen Beißkeil verwenden"
      - "Nach dem Anfall stabile Seitenlage, Atemwege freihalten, Vitalzeichen und Bewusstsein kontrollieren"
      - "Anfall genau beobachten und dokumentieren: Beginn, Dauer, Ablauf, betroffene Körperseite, Bewusstsein, Verletzungen, Nachphase"
      - "Bei Anfall über 5 Minuten oder erneutem Anfall: Notarzt, Notfallmedikament nach Anordnung"
      - "Anfallsgefährdete nicht allein baden lassen, niedriges Bett, ggf. Sturzhelm"
      - "Antiepileptika pünktlich geben, Einnahme kontrollieren"
    beratung:
      - "Medikamente regelmäßig nehmen, nie eigenmächtig absetzen"
      - "Anfallskalender führen"
      - "Auslöser meiden: regelmäßiger Schlaf, wenig oder kein Alkohol"
      - "Sicherheit im Alltag: Duschen statt Baden, Schwimmen nur in Begleitung"
      - "Fahrtauglichkeit ist eingeschränkt; Angehörige in Erster Hilfe beim Anfall anleiten"
    prophylaxen:
      - { topicId: thema.pro.sturz, grund: "Stürze während des Anfalls und Schwindel unter Antiepileptika" }
      - { topicId: thema.pro.aspiration, grund: "Speichel und Erbrochenes im Anfall und in der Nachphase" }
    merksatz: "Im Anfall: schützen, nicht festhalten, nichts in den Mund, Zeit messen. Über 5 Minuten: Notruf."
    drugIds: [arz.levetiracetam, arz.lorazepam]
    assessmentIds: [as.gcs]
    referenceIds: [es.sturz]
    topicIds: [thema.kl.neuro.epilepsie]
    pruefstatus: ungeprueft

  - id: kh.ms
    name: Multiple Sklerose
    synonyms: [MS, Encephalomyelitis disseminata, ED]
    definition: "Chronisch-entzündliche Autoimmunerkrankung des zentralen Nervensystems. Das Immunsystem zerstört an vielen Stellen die Markscheiden (Myelin) der Nervenfasern in Gehirn und Rückenmark, sodass Signale verlangsamt oder unterbrochen werden."
    formen:
      - "Schubförmig remittierend: Schübe mit vollständiger oder teilweiser Rückbildung; häufigste Form zu Beginn"
      - "Sekundär progredient: nach schubförmigem Beginn schleichende Verschlechterung"
      - "Primär progredient: von Anfang an schleichende Verschlechterung ohne deutliche Schübe"
    ursachen: ["Autoimmunreaktion gegen das Myelin, Ursache nicht vollständig geklärt", "Zusammenspiel aus genetischer Veranlagung und Umweltfaktoren"]
    risikofaktoren: ["Junges Erwachsenenalter (Beginn meist zwischen 20 und 40 Jahren)", "Weibliches Geschlecht", "Vitamin-D-Mangel, Rauchen, Epstein-Barr-Virus-Infektion"]
    symptome:
      - "Sehstörungen, oft einseitig durch Entzündung des Sehnervs (Optikusneuritis), Doppelbilder"
      - "Gefühlsstörungen wie Kribbeln oder Taubheit"
      - "Lähmungen, Spastik, Gang- und Gleichgewichtsstörungen"
      - "Fatigue: ausgeprägte Erschöpfbarkeit"
      - "Blasen- und Darmstörungen, sexuelle Funktionsstörungen"
      - "Konzentrations- und Gedächtnisstörungen, Depression"
      - "Uhthoff-Phänomen: Beschwerden verstärken sich bei Wärme"
    komplikationen: ["Zunehmende Behinderung bis Rollstuhl und Pflegebedürftigkeit", "Harnwegsinfekte durch Blasenentleerungsstörung", "Kontrakturen, Dekubitus, Stürze", "Depression"]
    diagnostik: ["Neurologische Untersuchung", "MRT von Gehirn und Rückenmark", "Liquoruntersuchung (Lumbalpunktion)", "Evozierte Potenziale"]
    therapie:
      - "Akuter Schub: hochdosiertes Kortison (Methylprednisolon) über wenige Tage nach ärztlicher Anordnung"
      - "Verlaufsmodifizierende Dauertherapie (Immuntherapie) nach Anordnung"
      - "Symptomatisch: Physiotherapie, Ergotherapie, Logopädie, Medikamente gegen Spastik und Blasenstörung"
    pflege:
      - "Ressourcen fördern, Selbstständigkeit erhalten: so viel Hilfe wie nötig, so wenig wie möglich"
      - "Fatigue berücksichtigen: Aktivitäten über den Tag verteilen, Pausen einplanen"
      - "Wärme meiden (keine heißen Bäder), weil sie Symptome verstärken kann"
      - "Blasenfunktion beobachten (Restharn, Harnwegsinfekt), ggf. intermittierender Selbstkatheterismus"
      - "Mobilisation und Lagerung mit Blick auf Spastik und Kontrakturen, Hilfsmittel einsetzen"
      - "Sturzrisiko einschätzen"
      - "Bei Kortisonstoß: Blutzucker, Blutdruck, Schlaf und Stimmung beobachten"
      - "Stimmung beobachten, Gesprächsangebote machen"
    beratung:
      - "Anzeichen eines Schubes erkennen und ärztlich vorstellen"
      - "Regelmäßige Bewegung im eigenen Tempo, Selbsthilfegruppen (z. B. DMSG)"
      - "Selbstinjektion der Immuntherapie anleiten, falls verordnet"
      - "Energiemanagement bei Fatigue"
    prophylaxen:
      - { topicId: thema.pro.kontraktur, grund: "Spastik und Lähmungen führen zu Bewegungseinschränkungen" }
      - { topicId: thema.pro.zystitis, grund: "Blasenentleerungsstörung mit Restharn" }
      - { topicId: thema.pro.sturz, grund: "Gang- und Gleichgewichtsstörungen" }
      - { topicId: thema.pro.dekubitus, grund: "Lähmungen und Gefühlsstörungen" }
    merksatz: "MS: Krankheit der tausend Gesichter. Wärme verschlechtert, Pausen helfen."
    drugIds: [arz.methylprednisolon, arz.prednisolon]
    assessmentIds: [as.barthel, as.braden]
    referenceIds: [es.mobilitaet]
    topicIds: [thema.kl.neuro.ms]
    pruefstatus: ungeprueft

  # ---------------------------------------------------------------- Psychiatrie
  - id: kh.depression
    name: Depression
    synonyms: [depressive Episode, unipolare Depression, Major Depression]
    definition: "Psychische Erkrankung mit anhaltend gedrückter Stimmung, Interessenverlust und Antriebsminderung über mindestens zwei Wochen. Sie beeinflusst Denken, Gefühle, Körper und Verhalten und ist gut behandelbar."
    formen:
      - "Leicht, mittelgradig oder schwer (nach Zahl und Stärke der Symptome)"
      - "Einzelne Episode oder wiederkehrend (rezidivierend)"
      - "Bipolare Störung: Wechsel zwischen depressiven und manischen Phasen"
      - "Altersdepression: oft mit körperlichen Beschwerden, wird leicht mit Demenz verwechselt"
    ursachen: ["Zusammenspiel aus genetischer Veranlagung, veränderten Botenstoffen im Gehirn und belastenden Lebensereignissen", "Körperliche Erkrankungen und Medikamente können beteiligt sein"]
    risikofaktoren:
      - "Verlust, Trennung, Einsamkeit, Überforderung"
      - "Chronische Erkrankungen, Schmerzen, Pflegebedürftigkeit"
      - "Frühere depressive Episoden, Depression in der Familie"
      - "Alkohol- und Drogenkonsum"
    symptome:
      - "Hauptsymptome: gedrückte Stimmung, Verlust von Interesse und Freude, Antriebsmangel und schnelle Ermüdbarkeit"
