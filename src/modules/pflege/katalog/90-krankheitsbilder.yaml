# Krankheitsbild-Steckbriefe: häufige Krankheitsbilder der generalistischen Pflegeausbildung.
# Je Krankheitsbild: Definition, Ursachen, Symptome, Diagnostik, Therapie, Pflegeschwerpunkte,
# Beratung und passende Prophylaxen, verknüpft mit Medikamenten-Steckbriefen (drugIds),
# Assessments (assessmentIds), Expertenstandards (referenceIds) und Katalogthemen (topicIds).
#
# Belegregel: Ein Abschnitt bekommt einen Eintrag in `belege` nur, wenn JEDER Punkt darin aus dem
# Unterrichtsmaterial stammt (Quelle + Seite = PDF-Seite). Alle anderen Abschnitte sind übliches
# Lehrbuchwissen und werden in der App als „ungeprüft“ angezeigt, bis sie mit dem Unterricht
# abgeglichen sind. Verknüpfungen (Medikamente, Assessments, Themen) sind Katalogzuordnungen.
# Keine Dosierungsanweisungen: es gelten ärztliche Anordnung, Fachinformation und Hausstandard.
# Quellenkürzel im Unterrichtsmaterial:
#   LEB 5 Mitschrift          = LEB 5 Zusammenfassung.pdf
#   I care Herz               = 04 Pflegerische Maßnahmen I Care.pdf („Pflege bei Erkrankungen des Herzens“)
#   ENP                       = ENP-Praxisleitlinien (Wieteck 2023), Buchseite
#   CE 09 Demenz              = LS Menschen mit Demenz Sicherheit und Geborgenheit geben.pdf
#   CE 08 Exsikkose           = LS Pflegebedarf bei Exsikkose erheben, Anlage 2 (Störungen des Wasser- und Elektrolythaushalts)
#   CE 02 Thrombose           = LS Einer Thrombose vorbeugen, Anlage 3 (Kompression)
#   CE 09 Bettlägerigkeit     = LS Bettlägerigkeit im Alter zielgerichtet vermeiden.pdf

diseaseProfiles:
  # ---------------------------------------------------------------- Herz-Kreislauf
  - id: kh.herzinsuffizienz
    name: Herzinsuffizienz
    synonyms: [Herzschwäche]
    definition: "Das Herz kann nicht mehr genug Blut auswerfen, um den Körper bedarfsgerecht zu versorgen. Das Blut staut sich vor der geschwächten Herzhälfte zurück."
    formen:
      - "Linksherzinsuffizienz: Rückstau in den Lungenkreislauf"
      - "Rechtsherzinsuffizienz: Rückstau in den Körperkreislauf"
      - "Akut oder chronisch"
    ursachen:
      - "Links, akut: Herzinfarkt, hypertensive Krise, Herzrhythmusstörungen"
      - "Links, chronisch: arterielle Hypertonie, KHK, Herzklappenfehler links"
      - "Rechts, akut: Lungenembolie (Druckanstieg im Lungenkreislauf)"
      - "Rechts, chronisch: Linksherzinsuffizienz (häufigste Ursache), Herzklappenfehler rechts, Lungenerkrankungen wie COPD, Emphysem oder Fibrose"
    symptome:
      - "Links: Dyspnoe und Orthopnoe, schnelle Erschöpfung bei Belastung, Herzrhythmusstörungen"
      - "Links: feuchte Rasselgeräusche als Hinweis auf ein Lungenödem"
      - "Rechts: Ödeme an Knöcheln und Unterschenkeln, Anasarka, Stauungsekzem mit Gefahr von Wundheilungsstörungen"
      - "Rechts: Hepatomegalie, Aszites, Appetitlosigkeit durch Stau in den Magenvenen"
      - "Beide: eingeschränkte Belastbarkeit, Schwäche, Müdigkeit, Nykturie"
    komplikationen:
      - "Kardiale Dekompensation mit Lungenödem (Atemnot, Rasselgeräusche, schaumiges Sputum): Notfall"
      - "Herzrhythmusstörungen, plötzlicher Herztod"
      - "Thrombose und Embolie durch verlangsamten Blutfluss"
    diagnostik:
      - "Einteilung nach NYHA I–IV: I ohne Beschwerden bei normaler Belastung, II Beschwerden bei stärkerer Belastung, III schon bei leichter Belastung, IV in Ruhe"
      - "Echokardiografie (Pumpfunktion, Ejektionsfraktion), EKG, Röntgen-Thorax"
      - "Labor: BNP bzw. NT-proBNP, Elektrolyte, Nierenwerte"
    therapie:
      - "Grunderkrankung behandeln (z. B. Blutdruck einstellen, KHK behandeln)"
      - "Medikamente nach ärztlicher Anordnung: ACE-Hemmer oder Sartane, Betablocker, Diuretika, Aldosteronantagonisten, SGLT2-Hemmer"
      - "Bei Dekompensation: Diuretika i. v., Sauerstoff, Oberkörperhochlagerung"
    pflege:
      - "Belastungsgrenze mit dem Arzt festlegen; vor und nach jeder Maßnahme nach dem Befinden fragen, Vitalzeichen messen, beobachten"
      - "Maßnahme abbrechen, wenn der Puls stark steigt, Atemnot auftritt oder der Patient über Schmerzen oder Unwohlsein klagt"
      - "Körperpflege in der Akutphase eventuell ganz übernehmen, dann stufenweise steigern; kein zu warmes Duschen, keine Vollbäder, Sitzgelegenheit in der Dusche"
      - "Mobilisation bei akuter Herzinsuffizienz nach ärztlicher Anordnung früh und nach Stufenplan; bei chronischer zu regelmäßigen Spaziergängen anregen"
      - "Verordnete Trinkmengenbegrenzung einhalten, bei Dekompensation Ein- und Ausfuhr bilanzieren, Gewicht regelmäßig kontrollieren"
      - "In der Akutphase leicht verdauliche, nicht blähende Kost; für regelmäßigen Stuhlgang sorgen"
      - "Puls und Blutdruck bei akuter Erkrankung mehrmals täglich und bei Belastung messen, Puls eine volle Minute auszählen"
      - "Auf Ödeme achten, bei Linksherzinsuffizienz auf Zeichen eines Lungenödems, auch auf die seelische Verfassung"
    beratung:
      - "Medikamente regelmäßig einnehmen und ihre Nebenwirkungen kennen"
      - "Zeichen einer Dekompensation kennen: weniger belastbar, nachts Atemnot, mehr Ödeme"
      - "Risikofaktoren abbauen: Rauchen, Übergewicht, fettreiche Ernährung, Bewegungsmangel, Bluthochdruck"
      - "Mehrere kleine Mahlzeiten, Herzsportgruppe, Hausnotruf"
    prophylaxen:
      - { topicId: thema.pro.thrombose, grund: "Bei Bettruhe kreisende und wippende Fußbewegungen" }
      - { topicId: thema.pro.pneumonie, grund: "Nicht abklopfen, weil das Rhythmusstörungen auslösen kann" }
      - { topicId: thema.pro.obstipation, grund: "In der Akutphase für regelmäßigen Stuhlgang sorgen" }
      - { topicId: thema.pro.dekubitus, grund: "Eingeschränkte Mobilität durch Herzinsuffizienz und Ödeme, gespannte, glänzende Haut" }
    merksatz: "Links staut in die Lunge, rechts staut in den Körper."
    drugIds: [arz.furosemid, arz.hydrochlorothiazid, arz.spironolacton, arz.ramipril, arz.candesartan, arz.metoprolol, arz.digitoxin, arz.empagliflozin]
    assessmentIds: [as.braden, as.news]
    referenceIds: [es.dekubitus]
    topicIds: [thema.kl.herz.insuffizienz]
    belege:
      - { abschnitt: formen, quelle: "LEB 5 Mitschrift", seiten: "S. 2" }
      - { abschnitt: ursachen, quelle: "LEB 5 Mitschrift", seiten: "S. 2" }
      - { abschnitt: symptome, quelle: "LEB 5 Mitschrift", seiten: "S. 2–3" }
      - { abschnitt: symptome, quelle: "I care Herz (Lungenödem)", seiten: "S. 2" }
      - { abschnitt: pflege, quelle: "I care Herz", seiten: "S. 1–2" }
      - { abschnitt: pflege, quelle: "ENP (stufenweise Körperpflege)", seiten: "S. 90" }
      - { abschnitt: beratung, quelle: "I care Herz", seiten: "S. 3" }
      - { abschnitt: prophylaxen, quelle: "I care Herz", seiten: "S. 1" }
      - { abschnitt: prophylaxen, quelle: "LEB 5 Mitschrift (Dekubitusrisiko)", seiten: "S. 3" }
    pruefstatus: ungeprueft

  - id: kh.hypertonie
    name: Arterielle Hypertonie
    synonyms: [Bluthochdruck]
    definition: "Dauerhaft erhöhter Blutdruck in den Arterien, in der Praxismessung ab 140/90 mmHg. Bleibt lange ohne Beschwerden und schädigt dabei Gefäße, Herz, Gehirn, Nieren und Augen."
    formen:
      - "Primäre (essenzielle) Hypertonie ohne fassbare Ursache, etwa 90 %"
      - "Sekundäre Hypertonie als Folge einer anderen Erkrankung, z. B. der Niere oder der Hormondrüsen"
    ursachen:
      - "Primär: Zusammenspiel aus Veranlagung und Lebensstil"
      - "Sekundär: Nierenerkrankungen, Nierenarterienstenose, Hyperaldosteronismus, Schilddrüsenüberfunktion, Schlafapnoe, Medikamente (z. B. NSAR, Kortison)"
    risikofaktoren: ["Übergewicht", "Bewegungsmangel", "Salzreiche Ernährung", "Alkohol, Rauchen", "Stress", "Höheres Alter, familiäre Belastung", "Diabetes mellitus"]
    symptome:
      - "Oft lange keine Beschwerden"
      - "Morgendlicher Kopfschmerz, Schwindel, Ohrensausen, Nasenbluten, Herzklopfen"
      - "Hypertensive Krise: sehr hoher Blutdruck mit Kopfschmerz, Sehstörungen, Brustschmerz, Atemnot oder neurologischen Ausfällen"
    komplikationen: ["Schlaganfall", "KHK und Herzinfarkt", "Herzinsuffizienz", "Niereninsuffizienz", "Netzhautschäden", "pAVK"]
    diagnostik:
      - "Wiederholte Blutdruckmessung an beiden Armen, Langzeitmessung über 24 Stunden, Selbstmessung zu Hause"
      - "Suche nach Organschäden und Ursachen: EKG, Labor (Nierenwerte, Elektrolyte, Blutzucker, Blutfette), Urin"
    therapie:
      - "Lebensstil ändern: Gewicht senken, Bewegung, weniger Salz und Alkohol, Rauchstopp"
      - "Medikamente nach ärztlicher Anordnung: ACE-Hemmer oder Sartane, Kalziumantagonisten, Thiaziddiuretika, bei Bedarf Betablocker"
    pflege:
      - "Blutdruck korrekt messen: in Ruhe nach einigen Minuten Sitzen, passende Manschette, auf Herzhöhe, immer am selben Arm; dokumentieren"
      - "Zu Beginn einer Therapie oder nach Dosisänderung auf Schwindel und Blutdruckabfall beim Aufstehen achten (Sturzgefahr)"
      - "Warnzeichen einer hypertensiven Krise oder eines Schlaganfalls erkennen und sofort melden"
      - "Medikamenteneinnahme überwachen, Nebenwirkungen beobachten (z. B. Reizhusten, Knöchelödeme)"
    beratung:
      - "Blutdruck selbst messen und ein Blutdrucktagebuch führen"
      - "Medikamente regelmäßig nehmen, auch ohne Beschwerden, nicht eigenmächtig absetzen"
      - "Lebensstil: salzarme Kost, Bewegung, Gewichtsreduktion, Rauchstopp, wenig Alkohol"
    prophylaxen:
      - { topicId: thema.pro.sturz, grund: "Blutdruckabfall beim Aufstehen unter Blutdrucksenkern" }
    merksatz: "Hoher Druck tut lange nicht weh, aber er schadet jeden Tag."
    drugIds: [arz.ramipril, arz.candesartan, arz.amlodipin, arz.hydrochlorothiazid, arz.metoprolol]
    assessmentIds: [as.tug]
    topicIds: [thema.kl.herz.hypertonie, thema.beo.vitalzeichen]
    pruefstatus: ungeprueft

  - id: kh.herzinfarkt
    name: KHK und Herzinfarkt
    synonyms: [Myokardinfarkt, Koronare Herzkrankheit, Akutes Koronarsyndrom]
    definition: "Bei der koronaren Herzkrankheit (KHK) sind die Herzkranzgefäße durch Arteriosklerose verengt. Beim Herzinfarkt verschließt sich ein Gefäß, und Herzmuskelgewebe stirbt ab."
    formen:
      - "Stabile Angina pectoris: Brustschmerz bei Belastung, bessert sich in Ruhe oder mit Nitrat"
      - "Akutes Koronarsyndrom: instabile Angina pectoris und Herzinfarkt (NSTEMI, STEMI)"
    ursachen:
      - "Arteriosklerose der Herzkranzgefäße"
      - "Infarkt: Plaque reißt auf, ein Gerinnsel verschließt das Gefäß"
    risikofaktoren: ["Rauchen", "Arterielle Hypertonie", "Diabetes mellitus", "Hohe Blutfette (LDL)", "Übergewicht, Bewegungsmangel", "Höheres Alter, männliches Geschlecht, familiäre Belastung"]
    symptome:
      - "Starker, drückender oder brennender Brustschmerz, oft mit Ausstrahlung in linken Arm, Hals, Kiefer, Oberbauch oder Rücken, länger als 20 Minuten, bessert sich nicht mit Nitrat"
      - "Engegefühl, Atemnot, Todesangst, kalter Schweiß, Übelkeit, Blässe"
      - "Bei Frauen, älteren Menschen und Menschen mit Diabetes oft untypisch: nur Atemnot, Übelkeit, Oberbauchschmerz, Schwäche"
    komplikationen: ["Herzrhythmusstörungen bis Kammerflimmern", "Kardiogener Schock", "Akute Herzinsuffizienz", "Erneuter Infarkt"]
    diagnostik:
      - "12-Kanal-EKG so schnell wie möglich"
      - "Labor: Troponin"
      - "Herzkatheter (Koronarangiografie)"
    therapie:
      - "Notruf 112, Herzkatheter mit Aufdehnung und Stent so schnell wie möglich („Time is muscle“)"
      - "Medikamente nach ärztlicher Anordnung: Plättchenhemmer, Antikoagulation, Nitrat, Schmerzmittel, Betablocker, Statin, ACE-Hemmer"
      - "Danach Rehabilitation und Lebensstiländerung"
    pflege:
      - "Bei Verdacht: Notruf, Oberkörper hoch lagern, beengende Kleidung öffnen, nicht allein lassen, beruhigen, keine körperliche Anstrengung"
      - "Vitalzeichen und Bewusstsein engmaschig überwachen, Monitor nach Anordnung, Reanimationsbereitschaft"
      - "Nach Herzkatheter: Punktionsstelle und Druckverband auf Blutung kontrollieren, Durchblutung der Extremität prüfen, Bettruhe nach Anordnung"
      - "Mobilisation nach ärztlichem Stufenplan, Belastung beobachten (Puls, Blutdruck, Atemnot, Brustschmerz)"
      - "Stuhlgang ohne starkes Pressen ermöglichen"
    beratung:
      - "Plättchenhemmer nicht eigenmächtig absetzen (Stentthrombose)"
      - "Notfallzeichen kennen und sofort 112 rufen"
      - "Risikofaktoren abbauen: Rauchstopp, Bewegung, Ernährung, Blutdruck, Blutzucker"
    prophylaxen:
      - { topicId: thema.pro.obstipation, grund: "Pressen beim Stuhlgang belastet das Herz" }
      - { topicId: thema.pro.thrombose, grund: "Bettruhe nach Infarkt oder Katheter" }
    merksatz: "Brustschmerz über 20 Minuten: 112, nicht abwarten."
    drugIds: [arz.acetylsalicylsaeure, arz.clopidogrel, arz.glyceroltrinitrat, arz.metoprolol, arz.simvastatin, arz.ramipril, arz.heparin, arz.morphin]
    assessmentIds: [as.nrs, as.news]
    topicIds: [thema.kl.herz.khk, thema.beo.notfall]
    pruefstatus: ungeprueft

  - id: kh.tvt
    name: Tiefe Beinvenenthrombose
    synonyms: [TVT, Phlebothrombose]
    definition: "Ein Blutgerinnsel verschließt eine tiefe Vene ganz oder teilweise, meist in Bein oder Becken. Die gefährlichste Komplikation ist die Lungenembolie."
    ursachen:
      - "Virchow-Trias: verlangsamter Blutfluss, Schaden an der Gefäßwand, erhöhte Gerinnungsneigung"
    risikofaktoren: ["Immobilität, Bettruhe, Gips, lange Reisen", "Operationen und Verletzungen", "Höheres Alter, frühere Thrombose", "Krebs", "Herzinsuffizienz", "Exsikkose", "Schwangerschaft, Pille, Hormontherapie", "Übergewicht"]
    symptome:
      - "Meist einseitige Schwellung und Umfangszunahme des Beins"
      - "Schwere- und Spannungsgefühl, Schmerz in Wade, Kniekehle oder Fußsohle"
      - "Überwärmung, bläulich-rote Verfärbung, glänzende Haut"
      - "Oft wenige oder keine Zeichen, besonders bei bettlägerigen Menschen"
    komplikationen:
      - "Lungenembolie: plötzliche Atemnot, Brustschmerz, Herzrasen, Husten: Notfall"
      - "Postthrombotisches Syndrom"
    diagnostik: ["Kompressionssonografie", "D-Dimere im Blut"]
    therapie:
      - "Antikoagulation nach ärztlicher Anordnung, meist für mindestens 3 Monate"
      - "Kompressionstherapie"
      - "Bei wirksamer Antikoagulation meist keine strenge Bettruhe, ärztliche Anordnung beachten"
    pflege:
      - "Kompression korrekt anlegen (Strumpf oder Verband), morgens vor dem Aufstehen"
      - "Mobilisation nach Anordnung fördern"
      - "Auf Zeichen der Lungenembolie achten und sofort melden"
      - "Unter Antikoagulation auf Blutungen achten (Zahnfleisch, Urin, Stuhl, Hämatome)"
      - "Haut unter der Kompression kontrollieren, auf ausreichende Trinkmenge achten"
    beratung:
      - "Antikoagulanzien regelmäßig nehmen, Blutungszeichen kennen"
      - "Kompressionsstrumpf tragen, Bewegung im Alltag (Venenpumpe)"
      - "Lange Sitzen vermeiden, ausreichend trinken"
    prophylaxen:
      - { topicId: thema.pro.thrombose, grund: "MKS sind Therapie bei Venenleiden, ärztlich verordnet, und wirken nur, wenn der Mensch mobil ist. MTPS sind für immobile Menschen gedacht." }
    merksatz: "Virchow: langsam, verletzt, verdickt."
    drugIds: [arz.heparin, arz.enoxaparin, arz.apixaban, arz.phenprocoumon]
    topicIds: [thema.kl.herz.pavk, thema.pro.thrombose]
    belege:
      - { abschnitt: prophylaxen, quelle: "CE 02 Thrombose, Anlage 3", seiten: "S. 1" }
    pruefstatus: ungeprueft

  # ---------------------------------------------------------------- Atmung
  - id: kh.copd
    name: COPD
    synonyms: [Chronisch obstruktive Lungenerkrankung]
    definition: "Dauerhafte, fortschreitende Verengung der Atemwege mit chronischer Bronchitis und oft Lungenemphysem. Die Verengung bildet sich auch mit Medikamenten nicht vollständig zurück."
    ursachen:
      - "Vor allem Rauchen, auch Passivrauchen"
      - "Feinstaub und Schadstoffe am Arbeitsplatz"
      - "Selten angeborener Alpha-1-Antitrypsin-Mangel"
    symptome:
      - "AHA-Symptome: Auswurf, Husten, Atemnot (zuerst bei Belastung)"
      - "Verlängerte Ausatmung, Giemen, Lippenbremse"
      - "Im Verlauf Fassthorax, Zyanose, Trommelschlägelfinger, Gewichtsverlust"
    komplikationen:
      - "Akute Exazerbation, oft durch Infekte: mehr Atemnot, mehr und verfärbter Auswurf"
      - "Respiratorische Insuffizienz"
      - "Rechtsherzbelastung (Cor pulmonale)"
      - "Pneumonie"
    diagnostik: ["Lungenfunktion (Spirometrie)", "Blutgasanalyse, Sauerstoffsättigung", "Röntgen-Thorax"]
    therapie:
      - "Rauchstopp als wichtigste Maßnahme"
      - "Inhalative Bronchodilatatoren, bei häufigen Exazerbationen inhalatives Kortison"
      - "Atemphysiotherapie, Lungensport, Impfungen"
      - "Sauerstofflangzeittherapie nach ärztlicher Anordnung"
    pflege:
      - "Atmung, Sättigung, Hautfarbe und Auswurf beobachten"
      - "Atemerleichternde Positionen: Kutschersitz, Torwartstellung, Oberkörperhochlagerung"
      - "Lippenbremse und Atemtechniken anleiten"
      - "Inhalationstechnik prüfen und üben"
      - "Sauerstoff nur nach Anordnung und in der verordneten Menge geben; hohe Gaben können bei manchen Betroffenen den Atemantrieb dämpfen"
      - "Sekret lösen: ausreichend trinken, Inhalation, Hustentechnik"
      - "Belastung dosieren, Pausen einplanen, kleine Mahlzeiten"
    beratung:
      - "Rauchstopp unterstützen"
      - "Inhalationstechnik und Notfallspray, Mund nach Kortisonspray ausspülen"
      - "Infekte früh erkennen, Impfungen (Grippe, Pneumokokken)"
    prophylaxen:
      - { topicId: thema.pro.pneumonie, grund: "Sekretstau und häufige Infekte" }
      - { topicId: thema.pro.soor, grund: "Inhalatives Kortison begünstigt Mundsoor" }
      - { topicId: thema.pro.dehydratation, grund: "Atemnot beim Essen und Trinken, Gewichtsverlust" }
    merksatz: "AHA: Auswurf, Husten, Atemnot."
    drugIds: [arz.salbutamol, arz.tiotropium, arz.budesonid, arz.prednisolon]
    assessmentIds: [as.news, as.mna]
    topicIds: [thema.kl.atmung]
    pruefstatus: ungeprueft

  - id: kh.pneumonie
    name: Pneumonie
    synonyms: [Lungenentzündung]
    definition: "Entzündung des Lungengewebes, meist durch Bakterien oder Viren. Bei alten und immobilen Menschen eine häufige und gefährliche Erkrankung."
    formen:
      - "Ambulant erworben oder im Krankenhaus erworben (nosokomial)"
      - "Aspirationspneumonie nach Verschlucken"
      - "Hypostatische Pneumonie bei Immobilität und flacher Atmung"
    ursachen: ["Bakterien (z. B. Pneumokokken), Viren", "Aspiration von Speichel, Nahrung oder Mageninhalt"]
    risikofaktoren: ["Hohes Alter", "Immobilität und Bettlägerigkeit", "Schluckstörungen (z. B. nach Schlaganfall, bei Demenz oder Parkinson)", "COPD, Herzinsuffizienz", "Schwaches Immunsystem", "Flache Atmung bei Schmerzen nach Operationen"]
    symptome:
      - "Fieber, Schüttelfrost, Husten mit Auswurf"
      - "Atemnot, schnelle Atmung, atemabhängiger Brustschmerz"
      - "Bei alten Menschen oft untypisch: kein Fieber, dafür Verwirrtheit, Schwäche, Sturz, Trinkschwäche"
    komplikationen: ["Sepsis", "Respiratorische Insuffizienz", "Pleuraerguss", "Delir"]
    diagnostik: ["Abhören, Röntgen-Thorax", "Labor: Entzündungswerte (CRP, Leukozyten)", "Sauerstoffsättigung, Atemfrequenz"]
    therapie: ["Antibiotika nach ärztlicher Anordnung", "Sauerstoff nach Anordnung", "Ausreichend Flüssigkeit, fiebersenkende Mittel"]
    pflege:
      - "Vitalzeichen mit Atemfrequenz, Sättigung, Temperatur und Bewusstsein beobachten, Verschlechterung früh melden"
      - "Oberkörperhochlagerung, atemunterstützende Positionen, Atemübungen"
      - "Sekret lösen: Flüssigkeit, Inhalation, Abhusten unterstützen"
      - "Fiebersenkende Maßnahmen nach Anordnung, Flüssigkeitsbilanz"
      - "Früh mobilisieren, soweit möglich"
      - "Hygiene: Händedesinfektion, Abwurf von Taschentüchern"
    beratung: ["Antibiotika vollständig nach Plan einnehmen", "Impfungen (Pneumokokken, Grippe)"]
    prophylaxen:
      - { topicId: thema.pro.pneumonie, grund: "Atemvertiefung, Mobilisation und Sekretmanagement verhindern Rückfälle" }
      - { topicId: thema.pro.aspiration, grund: "Bei Schluckstörungen Ursache der Pneumonie" }
      - { topicId: thema.pro.dehydratation, grund: "Fieber und schnelle Atmung erhöhen den Flüssigkeitsbedarf" }
      - { topicId: thema.pro.soor, grund: "Gute Mundpflege senkt die Keimlast im Mund" }
    merksatz: "Alter Mensch plötzlich verwirrt: auch an Pneumonie denken."
    drugIds: [arz.amoxicillin, arz.paracetamol]
    assessmentIds: [as.news]
    topicIds: [thema.kl.atmung, thema.pro.pneumonie]
    pruefstatus: ungeprueft

  # ---------------------------------------------------------------- Stoffwechsel
  - id: kh.diabetes-typ2
    name: Diabetes mellitus Typ 2
    synonyms: [Zuckerkrankheit]
    definition: "Chronisch erhöhter Blutzucker, weil die Körperzellen schlechter auf Insulin ansprechen (Insulinresistenz) und die Bauchspeicheldrüse auf Dauer nicht genug Insulin bildet."
    formen:
      - "Typ 1: absoluter Insulinmangel durch Autoimmunzerstörung der Betazellen, meist in jungen Jahren"
      - "Typ 2: Insulinresistenz und relativer Insulinmangel, etwa 90 % der Fälle"
      - "Gestationsdiabetes in der Schwangerschaft"
    ursachen: ["Insulinresistenz durch Übergewicht und Bewegungsmangel", "Erbliche Veranlagung"]
    risikofaktoren: ["Übergewicht, besonders Bauchfett", "Bewegungsmangel", "Familiäre Belastung", "Höheres Alter", "Bluthochdruck, Fettstoffwechselstörung"]
    symptome:
      - "Lange ohne Beschwerden"
      - "Durst, häufiges Wasserlassen, Müdigkeit, Infektanfälligkeit, schlecht heilende Wunden, Juckreiz"
    komplikationen:
      - "Hypoglykämie unter Insulin oder Sulfonylharnstoffen: Zittern, Schwitzen, Heißhunger, Unruhe bis Bewusstlosigkeit"
      - "Hyperglykämie bis hyperosmolares Koma: Durst, Polyurie, Exsikkose, Bewusstseinsstörung"
      - "Spätfolgen: Makroangiopathie (Herzinfarkt, Schlaganfall, pAVK), Retinopathie, Nephropathie, Neuropathie"
      - "Diabetisches Fußsyndrom"
    diagnostik: ["Nüchternblutzucker, HbA1c", "Oraler Glukosetoleranztest"]
    therapie:
      - "Basis: Ernährung, Bewegung, Gewichtsreduktion, Schulung"
      - "Medikamente nach ärztlicher Anordnung: Metformin, SGLT2-Hemmer und andere orale Antidiabetika, bei Bedarf Insulin"
    pflege:
      - "Blutzucker nach Anordnung messen und dokumentieren, Zeichen von Hypo- und Hyperglykämie erkennen"
      - "Bei Hypoglykämie: Blutzucker messen, bei Bewusstsein schnell wirksame Kohlenhydrate (z. B. Traubenzucker, Saft), Arzt informieren; bei Bewusstlosigkeit nichts in den Mund, Notruf"
      - "Insulin richtig lagern und spritzen, Spritzstellen wechseln (Lipohypertrophie vermeiden)"
      - "Füße täglich inspizieren: Druckstellen, Verletzungen, Pilz; sorgfältige Fußpflege, passende Schuhe"
      - "Haut- und Wundbeobachtung, Infektzeichen"
      - "Mahlzeiten und Insulingabe aufeinander abstimmen"
    beratung:
      - "Blutzuckerselbstkontrolle, Hypoglykämie erkennen und behandeln, Traubenzucker dabeihaben"
      - "Fußpflege, nicht barfuß laufen, Schuhe vor dem Anziehen prüfen"
      - "Bewegung und ausgewogene Ernährung, regelmäßige Kontrollen (Augen, Nieren, Füße)"
    prophylaxen:
      - { topicId: thema.pro.dekubitus, grund: "Neuropathie: Druckstellen an Füßen werden nicht gespürt" }
      - { topicId: thema.pro.intertrigo, grund: "Erhöhte Infektanfälligkeit der Haut in Hautfalten" }
      - { topicId: thema.pro.zystitis, grund: "Zucker im Urin begünstigt Harnwegsinfekte" }
      - { topicId: thema.pro.dehydratation, grund: "Hoher Blutzucker führt zu Flüssigkeitsverlust über die Niere" }
    merksatz: "Hypo: kalt, nass, Zittern, Hunger. Erst Zucker, dann fragen."
    drugIds: [arz.metformin, arz.empagliflozin, arz.normalinsulin, arz.insulinglargin]
    assessmentIds: [as.bmi]
    topicIds: [thema.kl.diabetes]
    pruefstatus: ungeprueft

  - id: kh.exsikkose
    name: Exsikkose (Dehydratation)
    synonyms: [Austrocknung, Dehydratation]
    definition: "Wasserdefizit durch eine negative Flüssigkeitsbilanz. Es betrifft zuerst den Extrazellularraum, je nach Natrium und Osmolarität auch Gefäß- und Zellraum."
    formen:
      - "Hypo-, iso- oder hyperton nach dem Natriumwert (normal 132–145 mmol/l)"
      - "Leicht, mittelschwer, schwer nach Gewichtsverlust (Erwachsene unter 3 %, 4–8 %, über 8 %)"
    ursachen:
      - "Zu wenig Zufuhr oder zu viel Verlust, oft beides zusammen"
      - "Verluste durch Erbrechen, Durchfall, Schwitzen, große Wunden, Blutverlust, vermehrte Urinausscheidung"
    risikofaktoren:
      - "Ältere Menschen: geringerer Wasseranteil, wenig Durstgefühl, schwächere Nieren, Diuretika, Diabetes"
      - "Angst vor ungewolltem Harnverlust"
      - "Desorientierung und Demenz, Immobilität, psychiatrische Erkrankungen"
      - "Dysphagie, Adipositas, Alkohol"
      - "Säuglinge, Kinder und alte Menschen sind besonders gefährdet"
    symptome:
      - "Durst (fehlt im Alter oft), trockene Mundschleimhaut, fehlender Speichelsee unter der Zunge, trockene, belegte, rissige Zunge"
      - "Raue Stimme, Sprechstörungen"
      - "Schneller, später schwacher Puls"
      - "Verminderte Urinmenge bis Oligurie oder Anurie"
      - "Eingesunkene Augen, verminderte Tränen"
      - "Zunehmende Lethargie und Verwirrtheit"
      - "Stehende Hautfalte ist bei alten Menschen kein sicheres Zeichen"
    komplikationen: ["Verwirrtheit und Delir", "Stürze", "Thrombose", "Obstipation", "Nierenversagen"]
    diagnostik:
      - "Blutuntersuchung: Natrium, Osmolarität, Kreatinin"
      - "Urin (spezifisches Gewicht), Gewicht, Vitalzeichen, Bewusstsein"
    therapie:
      - "Infusion mit NaCl 0,9 %, später Glukose-Elektrolyt-Lösung, i. v. oder s. c.; bei Herzerkrankungen auf Überwässerung achten"
      - "Oral: Salz-Zucker-Lösung"
    pflege:
      - "Bedarf bestimmen, Faustregel 30–40 ml je kg Körpergewicht; der Bedarf steigt bei Hitze, Fieber, Erbrechen und Durchfall"
      - "Lieblingsgetränke anbieten und bei jedem Kontakt zum Trinken animieren"
      - "Getränke in Reichweite, passendes Trinkgefäß, nicht bis zum Rand füllen, eventuell Strohhalm"
      - "Flüssigkeitsreiche Kost anbieten"
      - "Toilettengang ermöglichen und dabei die Intimsphäre wahren"
      - "Bezugspersonen einbeziehen"
      - "Reicht das Trinken nicht, s. c.-Infusionen nach Anordnung"
      - "Ein- und Ausfuhrprotokoll führen"
    prophylaxen:
      - { topicId: thema.pro.dehydratation, grund: "Kernmaßnahme: Bedarf bestimmen, Zufuhr sichern, Bilanz führen" }
      - { topicId: thema.pro.thrombose, grund: "Eingedicktes Blut gerinnt leichter" }
      - { topicId: thema.pro.obstipation, grund: "Zu wenig Flüssigkeit verhärtet den Stuhl" }
      - { topicId: thema.pro.delir, grund: "Flüssigkeitsmangel löst bei alten Menschen oft Verwirrtheit aus" }
    merksatz: "Im Alter fehlt der Durst, nicht der Bedarf."
    drugIds: [arz.furosemid, arz.hydrochlorothiazid]
    assessmentIds: [as.mna]
    referenceIds: [es.ernaehrung]
    topicIds: [thema.pro.dehydratation]
    belege:
      - { abschnitt: definition, quelle: "CE 08 Exsikkose, Anlage 2", seiten: "S. 1–3" }
      - { abschnitt: formen, quelle: "CE 08 Exsikkose, Anlage 2", seiten: "S. 1–3" }
      - { abschnitt: ursachen, quelle: "CE 08 Exsikkose, Anlage 2", seiten: "S. 2" }
      - { abschnitt: risikofaktoren, quelle: "CE 08 Exsikkose, Anlage 2", seiten: "S. 1–2" }
      - { abschnitt: symptome, quelle: "CE 08 Exsikkose, Anlage 2", seiten: "S. 3" }
      - { abschnitt: diagnostik, quelle: "CE 08 Exsikkose, Anlage 2 und Übersichtstabelle", seiten: "S. 1" }
      - { abschnitt: therapie, quelle: "CE 08 Exsikkose, Anlage 2 und Übersichtstabelle", seiten: "S. 3" }
      - { abschnitt: pflege, quelle: "CE 08 Exsikkose, Anlage 2 und Übersichtstabelle", seiten: "S. 4" }
    pruefstatus: ungeprueft

  # ---------------------------------------------------------------- Neurologie und Geriatrie
  - id: kh.schlaganfall
    name: Schlaganfall
    synonyms: [Apoplex, Hirninfarkt, Insult]
    definition: "Plötzliche Durchblutungsstörung oder Blutung im Gehirn. Nervenzellen sterben ab, es kommt zu neurologischen Ausfällen."
    formen:
      - "Ischämischer Schlaganfall (Hirninfarkt) durch Gefäßverschluss, etwa 80–85 %"
      - "Hämorrhagischer Schlaganfall durch Hirnblutung"
      - "TIA: Ausfälle bilden sich vollständig zurück, Warnzeichen für einen Schlaganfall"
    ursachen: ["Arteriosklerose der Hirngefäße", "Embolie aus dem Herzen, z. B. bei Vorhofflimmern", "Hirnblutung, z. B. bei hohem Blutdruck"]
    risikofaktoren: ["Arterielle Hypertonie", "Vorhofflimmern", "Diabetes mellitus", "Rauchen", "Hohe Blutfette", "Bewegungsmangel, Übergewicht", "Höheres Alter"]
    symptome:
      - "FAST: Face (hängender Mundwinkel), Arms (Arm sinkt ab), Speech (verwaschene Sprache), Time (sofort 112)"
      - "Halbseitenlähmung (Hemiparese) und Gefühlsstörung der Gegenseite"
      - "Sprachstörung (Aphasie), Sprechstörung (Dysarthrie), Schluckstörung (Dysphagie)"
      - "Sehstörung, Neglect (eine Körper- oder Raumhälfte wird nicht beachtet), Schwindel, Bewusstseinsstörung"
    komplikationen: ["Aspirationspneumonie", "Stürze", "Dekubitus, Kontrakturen, Spastik", "Thrombose", "Depression"]
    diagnostik: ["CT oder MRT des Kopfes sofort (Blutung ausschließen)", "Neurologische Untersuchung, Bewusstsein (GCS)", "Ursachensuche: EKG, Ultraschall der Halsgefäße"]
    therapie:
      - "Stroke Unit, Lyse oder Thrombektomie im Zeitfenster („Time is brain“)"
      - "Sekundärprophylaxe nach ärztlicher Anordnung: Plättchenhemmer oder Antikoagulation, Statin, Blutdruckeinstellung"
      - "Frühe Rehabilitation: Physio-, Ergo- und Logopädie"
    pflege:
      - "Bei Verdacht sofort Notruf, Zeitpunkt des Beginns festhalten, nichts essen oder trinken lassen"
      - "Vitalzeichen, Bewusstsein, Pupillen und neurologische Ausfälle engmaschig beobachten"
      - "Vor dem ersten Essen und Trinken Schluckfähigkeit prüfen (Schluckscreening), Kostform anpassen, aufrecht sitzend essen"
      - "Therapeutisch aktivierende Pflege, z. B. nach Bobath: von der betroffenen Seite ansprechen und anfassen, betroffene Seite einbeziehen"
      - "Lagerung und Positionierung, die Spastik und Schmerzen in der Schulter vermeidet"
      - "Kommunikation bei Aphasie: kurze Sätze, Ja-Nein-Fragen, Zeit lassen, Hilfsmittel"
    beratung:
      - "Risikofaktoren behandeln, Medikamente regelmäßig nehmen"
      - "Warnzeichen (FAST) kennen, auch bei Angehörigen"
      - "Hilfsmittel und Unterstützung im Alltag, Angehörige anleiten"
    prophylaxen:
      - { topicId: thema.pro.aspiration, grund: "Schluckstörungen sind häufig, Gefahr der Aspirationspneumonie" }
      - { topicId: thema.pro.sturz, grund: "Lähmung, Gleichgewichtsstörung, Neglect" }
      - { topicId: thema.pro.kontraktur, grund: "Lähmung und Spastik" }
      - { topicId: thema.pro.dekubitus, grund: "Eingeschränkte Bewegung und Wahrnehmung" }
      - { topicId: thema.pro.thrombose, grund: "Gelähmtes Bein, Immobilität" }
      - { topicId: thema.pro.pneumonie, grund: "Immobilität und Aspiration" }
    merksatz: "FAST: Gesicht, Arme, Sprache, Zeit."
    drugIds: [arz.acetylsalicylsaeure, arz.clopidogrel, arz.apixaban, arz.simvastatin, arz.ramipril]
    assessmentIds: [as.gcs, as.barthel, as.braden, as.tug]
    referenceIds: [es.mobilitaet, es.sturz]
    topicIds: [thema.kl.neuro.schlaganfall]
    pruefstatus: ungeprueft

  - id: kh.demenz
    name: Demenz (Alzheimer-Typ)
    synonyms: [Alzheimer-Demenz, Morbus Alzheimer]
    definition: "Lang anhaltende, ausgeprägte Funktionsstörung des Gehirns mit zunehmenden kognitiven Einschränkungen. Sie beeinträchtigt die Fähigkeit, den Tag zu strukturieren, den Alltag zu bewältigen und an der Gesellschaft teilzuhaben."
    formen:
      - "Degenerativ: Alzheimer, Lewy-Körperchen, Parkinson-Demenz, frontotemporal"
      - "Vaskulär: Multi-Infarkt-Demenz, Morbus Binswanger"
      - "Mischformen und sekundäre Demenzen"
    ursachen:
      - "Alzheimer: Nervenzellen gehen durch Eiweißablagerungen (Beta-Amyloid-Plaques, Tau-Fibrillen) zugrunde, zu wenig Acetylcholin"
      - "Vaskulär: viele kleine Durchblutungsstörungen im Gehirn"
    risikofaktoren: ["Bewegungsmangel", "Kopfverletzungen", "Alkohol", "Feinstaub", "Geringe Bildung", "Übergewicht", "Bluthochdruck", "Schwerhörigkeit", "Rauchen", "Diabetes", "Depression", "Wenig soziale Kontakte"]
    symptome:
      - "Kognitiv: Gedächtnis, Merkfähigkeit, Sprache und Orientierung beeinträchtigt, Objekt- und Gesichtererkennung gestört, Handlungsabläufe gestört"
      - "Verhalten und Psyche: Apathie, Depression, Angst, Halluzinationen, Rufen und Schreien, Unruhe, Wandering, Aggression"
      - "Körperlich: Schlafstörung, gestörter Tag-Nacht-Rhythmus, Gangapraxie"
    komplikationen: ["Delir bei Infekten, Exsikkose oder Medikamenten", "Stürze", "Mangelernährung und Exsikkose", "Aspiration im Spätstadium"]
    diagnostik:
      - "Mini-Mental-Status-Test (MMST): prüft Orientierung, Merkfähigkeit, Aufmerksamkeit und Rechnen, Erinnerung und Sprache, höchstens 30 Punkte"
      - "Uhrentest: mehr als 3 Fehlerpunkte sprechen für eine Hirnleistungsstörung"
    therapie:
      - "Cholinesterase-Hemmer (Donepezil, Galantamin, Rivastigmin) oder der Glutamat-Antagonist Memantin nach ärztlicher Anordnung"
      - "Nichtmedikamentös: Ergo-, Physio- und Verhaltenstherapie, Logopädie, Gedächtnistraining, Musik-, Kunst- und Erinnerungstherapie, je nach Stadium"
    pflege:
      - "Personzentrierte Haltung: die Person steht im Mittelpunkt, nicht die Diagnose; Beziehungsbedarfe erheben und eine Verstehenshypothese bilden"
      - "Biografiearbeit: Vorlieben, Rituale und Gewohnheiten kennen und nutzen"
      - "Orientierung fördern: mit Nachnamen begrüßen, Tageszeit nennen, Kalender, Schilder und Bilder, eigene Gegenstände"
      - "Bei Hinlauftendenz nicht mit der Realität konfrontieren; freiheitsentziehende Maßnahmen nur als allerletztes Mittel"
      - "Kommunikation: Augenkontakt, kurze Sätze, geschlossene Fragen, keine Ironie, Brille und Hörgerät"
      - "Validation: Gefühle wahrnehmen und spiegeln, nicht korrigieren, keine Warum-Fragen"
      - "Herausforderndes Verhalten kann ein Hinweis auf Schmerzen sein: wenn keine Selbstauskunft möglich ist, mit BESD einschätzen"
    beratung:
      - "Angehörige stärken und einbeziehen"
      - "Technische Hilfen: Herdsicherung, Erinnerungsfunktionen, Hausnotruf"
    prophylaxen:
      - { topicId: thema.pro.sturz, grund: "Gangunsicherheit, Unruhe, gestörter Tag-Nacht-Rhythmus" }
      - { topicId: thema.pro.dehydratation, grund: "Durst und Hunger werden nicht geäußert, Essen wird nicht erkannt" }
      - { topicId: thema.pro.delir, grund: "Demenz ist der stärkste Risikofaktor für ein Delir" }
      - { topicId: thema.pro.deprivation, grund: "Rückzug und fehlende Reize verstärken den Abbau" }
    merksatz: "Der emotionale Zugang ist der Königsweg."
    drugIds: [arz.melperon, arz.haloperidol, arz.citalopram]
    assessmentIds: [as.mmst, as.besd, as.barthel, as.mna]
    referenceIds: [es.demenz, es.schmerz]
    topicIds: [thema.kl.demenz]
    belege:
      - { abschnitt: definition, quelle: "ENP", seiten: "S. 977" }
      - { abschnitt: formen, quelle: "ENP", seiten: "S. 978" }
      - { abschnitt: risikofaktoren, quelle: "CE 09 Demenz", seiten: "S. 25" }
      - { abschnitt: symptome, quelle: "ENP", seiten: "S. 977–978" }
      - { abschnitt: diagnostik, quelle: "CE 09 Demenz", seiten: "S. 29–33" }
      - { abschnitt: therapie, quelle: "CE 09 Demenz", seiten: "S. 26–27" }
      - { abschnitt: pflege, quelle: "CE 09 Demenz", seiten: "S. 18–21, 47–64, 85–92, 112–114" }
      - { abschnitt: pflege, quelle: "CE 05 Schmerzmanagement (BESD)", seiten: "S. 22–28" }
      - { abschnitt: beratung, quelle: "CE 09 Demenz", seiten: "S. 17, 117–118" }
    pruefstatus: ungeprueft

  - id: kh.parkinson
    name: Morbus Parkinson
    synonyms: [Parkinson-Krankheit]
    definition: "Fortschreitende Erkrankung, bei der Nervenzellen in der Substantia nigra zugrunde gehen. Es fehlt Dopamin, die Bewegungssteuerung ist gestört."
    ursachen: ["Untergang dopaminbildender Nervenzellen, Ursache meist unbekannt (idiopathisch)", "Sekundär z. B. durch Medikamente wie Neuroleptika"]
    symptome:
      - "Hauptsymptome: Bradykinese bzw. Akinese (verlangsamte, verarmte Bewegung), Rigor (Muskelsteifheit), Ruhetremor, posturale Instabilität"
      - "Kleinschrittiger Gang, Freezing, gebeugte Haltung, fehlendes Mitschwingen der Arme"
      - "Maskengesicht, leise, monotone Sprache, kleine Schrift"
      - "Schluckstörung, Speichelfluss, Obstipation, Blutdruckabfall beim Aufstehen, Depression, Schlafstörung"
    komplikationen: ["Stürze", "Aspirationspneumonie", "Akinetische Krise (z. B. nach abruptem Absetzen der Medikamente): Notfall", "Wirkschwankungen (On-Off) unter Levodopa", "Demenz im Verlauf"]
    diagnostik: ["Klinische Untersuchung, Ansprechen auf Levodopa", "Bildgebung zum Ausschluss anderer Ursachen"]
    therapie:
      - "Levodopa und andere Parkinson-Medikamente nach ärztlicher Anordnung, pünktlich nach Zeitplan"
      - "Physio-, Ergo- und Logopädie"
    pflege:
      - "Medikamente minutengenau nach Plan geben; Levodopa mit Abstand zu eiweißreichen Mahlzeiten"
      - "Bewegung im On, Ruhe und Hilfe im Off einplanen; Zeit lassen, nicht drängen"
      - "Bei Freezing: rhythmische Hilfen (Zählen, Takt, Linien am Boden), Gewichtsverlagerung"
      - "Schluckfähigkeit beobachten, aufrecht essen, Kost anpassen"
      - "Sturzrisiko einschätzen, Umgebung sichern, langsam aufstehen"
      - "Selbstständigkeit mit Hilfsmitteln erhalten (z. B. dickere Griffe, Kleidung mit Klettverschluss)"
    beratung: ["Medikamente nie eigenmächtig absetzen, Einnahmezeiten einhalten", "Bewegung und Training im Alltag, Selbsthilfegruppen"]
    prophylaxen:
      - { topicId: thema.pro.sturz, grund: "Gangstörung, Freezing, Blutdruckabfall" }
      - { topicId: thema.pro.aspiration, grund: "Schluckstörung" }
      - { topicId: thema.pro.obstipation, grund: "Verlangsamte Darmbewegung, Medikamente" }
      - { topicId: thema.pro.kontraktur, grund: "Rigor und gebeugte Haltung" }
    merksatz: "Rigor, Tremor, Akinese, posturale Instabilität."
    drugIds: [arz.levodopa, arz.macrogol]
    assessmentIds: [as.tug, as.barthel]
    referenceIds: [es.sturz, es.mobilitaet]
    topicIds: [thema.kl.neuro.parkinson]
    pruefstatus: ungeprueft

  # ---------------------------------------------------------------- Haut
  - id: kh.dekubitus
    name: Dekubitus
    synonyms: [Druckgeschwür, Druckverletzung]
    definition: "Lokal begrenzte Schädigung der Haut und des darunterliegenden Gewebes, meist über Knochenvorsprüngen, durch Druck oder Druck in Verbindung mit Scherkräften."
    formen:
      - "Kategorie 1: nicht wegdrückbare Rötung bei intakter Haut"
      - "Kategorie 2: Teilverlust der Haut, flache Wunde oder Blase"
      - "Kategorie 3: Verlust der Haut bis ins Unterhautfettgewebe"
      - "Kategorie 4: vollständiger Gewebeverlust mit freiliegendem Knochen, Sehne oder Muskel"
    ursachen: ["Druck über längere Zeit, der die Durchblutung unterbricht", "Scher- und Reibungskräfte, z. B. beim Herunterrutschen im Bett"]
    risikofaktoren: ["Eingeschränkte Mobilität und Bettlägerigkeit", "Gestörte Wahrnehmung (Lähmung, Bewusstseinsstörung, Neuropathie)", "Feuchtigkeit durch Inkontinenz oder Schwitzen", "Mangelernährung und Exsikkose", "Durchblutungsstörungen, Ödeme", "Hohes Alter"]
    symptome:
      - "Typische Stellen: Kreuzbein, Fersen, Sitzbeinhöcker, großer Rollhügel, Hinterkopf, Ohren"
      - "Rötung, die sich nicht wegdrücken lässt (Fingertest)"
      - "Blase, offene Wunde, Nekrose je nach Kategorie"
    komplikationen: ["Wundinfektion bis Sepsis", "Schmerzen", "Osteomyelitis"]
    diagnostik:
      - "Initiales Screening, bei Risiko strukturierte Einschätzung (z. B. Braden-Skala) und klinische Beurteilung"
      - "Fingertest: Rötung mit dem Finger eindrücken; bleibt sie rot, liegt Kategorie 1 vor"
      - "Wunddokumentation mit Lage, Größe, Kategorie, Wundgrund, Fotos"
    therapie: ["Konsequente Druckentlastung der Wunde", "Phasengerechte Wundversorgung nach ärztlicher Anordnung und Wundexperten", "Schmerzbehandlung, Ernährung verbessern"]
    pflege:
      - "Bewegungsförderung: Eigenbewegung unterstützen, individueller Bewegungsplan mit Positionswechseln"
      - "Mikrolagerungen, 30-Grad-Seitenlage, Fersen frei lagern"
      - "Druckverteilende Hilfsmittel wie Weichlagerungsmatratzen nach Bedarf, regelmäßig prüfen, ob sie noch nötig sind"
      - "Haut täglich inspizieren, besonders an gefährdeten Stellen"
      - "Hautpflege, Haut trocken halten, schonende Inkontinenzversorgung"
      - "Ernährung und Trinkmenge sichern"
      - "Beim Hochrutschen und Transfer Scherkräfte vermeiden (kinästhetisch arbeiten)"
    beratung: ["Betroffene und Angehörige zu Bewegung, Positionswechseln und Hautbeobachtung anleiten"]
    prophylaxen:
      - { topicId: thema.pro.dekubitus, grund: "Kern der Vorbeugung und Behandlung" }
      - { topicId: thema.pro.dehydratation, grund: "Ernährung und Flüssigkeit für die Gewebeheilung" }
      - { topicId: thema.pro.kontraktur, grund: "Gleiche Ursache: Immobilität" }
    merksatz: "Druck mal Zeit: Bewegung ist die beste Prophylaxe."
    drugIds: [arz.paracetamol, arz.metamizol]
    assessmentIds: [as.braden, as.norton, as.mna, as.nrs]
    referenceIds: [es.dekubitus, es.wunden]
    topicIds: [thema.pro.dekubitus, thema.ph.wunde]
    pruefstatus: ungeprueft

  # ---------------------------------------------------------------- Infektionen
  - id: kh.hwi
    name: Harnwegsinfektion
    synonyms: [Harnwegsinfekt, HWI, Zystitis, Blasenentzündung, Pyelonephritis]
    definition: "Entzündung der ableitenden Harnwege durch Krankheitserreger, meist Bakterien aus dem eigenen Darm, die über die Harnröhre aufsteigen. Untere Harnwegsinfektion = Blasenentzündung (Zystitis), obere = Nierenbeckenentzündung (Pyelonephritis)."
    formen:
      - "Unkompliziert: Zystitis bei sonst gesunden, nicht schwangeren Frauen"
      - "Kompliziert: bei Männern, Schwangeren, Diabetes, Abflussstörungen oder Blasenkatheter"
      - "Katheterassoziierte Harnwegsinfektion: häufigste Krankenhausinfektion"
    ursachen: ["Meist Escherichia coli aus der Darmflora", "Aufsteigende Infektion über die Harnröhre"]
    risikofaktoren:
      - "Weibliches Geschlecht (kurze Harnröhre)"
      - "Blasendauerkatheter und Einmalkatheterismus"
      - "Restharn, z. B. bei Prostatavergrößerung, Blasenentleerungsstörung oder Immobilität"
      - "Geringe Trinkmenge, Inkontinenz und feuchte Vorlagen"
      - "Diabetes mellitus, geschwächtes Immunsystem, hohes Alter"
      - "Intimpflege von hinten nach vorn"
    symptome:
      - "Brennen und Schmerzen beim Wasserlassen (Dysurie)"
      - "Häufiger Harndrang mit kleinen Mengen (Pollakisurie), Unterbauchschmerzen"
      - "Trüber, übel riechender, manchmal blutiger Urin"
      - "Pyelonephritis: Fieber, Schüttelfrost, Flankenschmerz, deutliches Krankheitsgefühl"
      - "Bei alten Menschen oft untypisch: neue Verwirrtheit, neue Inkontinenz, Sturz, Schwäche"
    komplikationen: ["Aufsteigende Infektion zur Pyelonephritis", "Urosepsis: Notfall", "Delir bei alten Menschen"]
    diagnostik:
      - "Urinteststreifen: Leukozyten, Nitrit, Blut"
      - "Urinkultur aus Mittelstrahlurin, bei Katheter aus der Punktionsstelle des Ableitungssystems, nie aus dem Beutel"
      - "Bei Fieber: Entzündungswerte, ggf. Blutkulturen und Ultraschall der Nieren"
    therapie: ["Antibiotika nach ärztlicher Anordnung und Antibiogramm", "Reichlich trinken, sofern keine Trinkmengenbegrenzung besteht", "Schmerzmittel nach Anordnung"]
    pflege:
      - "Trinkmenge beobachten und fördern, bei Bedarf Ein- und Ausfuhr dokumentieren"
      - "Vitalzeichen und Temperatur kontrollieren, Fieber, Flankenschmerz und Verwirrtheit sofort melden"
      - "Urin beobachten: Menge, Farbe, Geruch, Beimengungen"
      - "Intimpflege von vorn nach hinten, Vorlagen rechtzeitig wechseln"
      - "Bei Blasenkatheter: Notwendigkeit täglich ärztlich prüfen lassen, geschlossenes System nicht diskonnektieren, Beutel immer unter Blasenniveau und ohne Bodenkontakt"
      - "Urinprobe korrekt gewinnen und rasch ins Labor bringen oder kühlen"
    beratung: ["Viel trinken und Blase regelmäßig vollständig entleeren", "Intimhygiene von vorn nach hinten, nach dem Geschlechtsverkehr Wasser lassen", "Antibiotika vollständig nach Plan einnehmen"]
    prophylaxen:
      - { topicId: thema.pro.zystitis, grund: "Trinken, Hygiene und Katheterpflege verhindern neue Infektionen" }
      - { topicId: thema.pro.dehydratation, grund: "Fieber erhöht den Bedarf, eine zu geringe Trinkmenge fördert die Infektion" }
      - { topicId: thema.pro.delir, grund: "Harnwegsinfekte sind eine häufige Delir-Ursache im Alter" }
    merksatz: "Alter Mensch plötzlich verwirrt oder neu inkontinent: auch an einen Harnwegsinfekt denken."
    drugIds: [arz.paracetamol]
    assessmentIds: [as.news]
    referenceIds: [es.kontinenz]
    topicIds: [thema.kl.niere, thema.pro.zystitis]
    pruefstatus: ungeprueft

  - id: kh.sepsis
    name: Sepsis
    synonyms: [Blutvergiftung, Urosepsis, septischer Schock]
    definition: "Lebensbedrohliche Organfunktionsstörung durch eine fehlgesteuerte Reaktion des Körpers auf eine Infektion. Ein zeitkritischer Notfall: Jede Stunde Verzögerung der Behandlung verschlechtert die Überlebenschance."
    formen:
      - "Sepsis: Infektion mit Organfunktionsstörung"
      - "Septischer Schock: Kreislaufversagen, das trotz Flüssigkeitsgabe Medikamente zur Blutdruckstabilisierung braucht"
    ursachen: ["Ausgangspunkt meist Lunge (Pneumonie), Harnwege (Urosepsis), Bauchraum, Haut und Wunden", "Venenverweilkanülen, zentrale Katheter und Blasenkatheter als Eintrittspforten"]
    risikofaktoren: ["Hohes Alter, Säuglinge", "Chronische Erkrankungen wie Diabetes, COPD, Krebs, Niereninsuffizienz", "Geschwächtes Immunsystem, z. B. unter Chemotherapie oder Kortison", "Liegende Katheter, frische Operationen und Wunden"]
    symptome:
      - "Schnelle Atmung, Atemnot"
      - "Schneller Puls, niedriger Blutdruck"
      - "Neue Verwirrtheit, Schläfrigkeit oder Unruhe"
      - "Fieber oder Untertemperatur, Schüttelfrost"
      - "Kalte, marmorierte Haut, verlängerte Rekapillarisierungszeit, wenig Urin"
      - "Starkes Krankheitsgefühl: „Ich fühle mich so krank wie noch nie“"
    komplikationen: ["Septischer Schock", "Multiorganversagen (Niere, Lunge, Gerinnung)", "Langzeitfolgen nach Sepsis: Muskelschwäche, Gedächtnisstörungen, Erschöpfung"]
    diagnostik:
      - "Früherkennung mit NEWS2 oder qSOFA (Atemfrequenz ab 22/min, systolischer Blutdruck bis 100 mmHg, veränderter Bewusstseinszustand: ab 2 Kriterien Verdacht)"
      - "Blutkulturen vor Beginn der Antibiotika, Laktat, Entzündungswerte"
      - "Suche nach dem Infektionsherd"
    therapie:
      - "Antibiotika möglichst innerhalb der ersten Stunde nach ärztlicher Anordnung"
      - "Flüssigkeit i. v., Sauerstoff nach Anordnung"
      - "Herdsanierung (z. B. Katheter wechseln, Abszess eröffnen)"
      - "Bei Schock Intensivtherapie mit kreislaufstützenden Medikamenten"
    pflege:
      - "Bei Verdacht sofort ärztlich informieren bzw. Notfallteam rufen, nicht bis zur nächsten Visite warten"
      - "Vitalzeichen engmaschig: Atemfrequenz, Sättigung, Blutdruck, Puls, Bewusstsein, Temperatur; NEWS2 berechnen und Verlauf dokumentieren"
      - "Ausfuhr überwachen, bei Bedarf Bilanz und stündliche Urinmenge"
      - "Blutkulturen und Laborproben vorbereiten, Zugänge sichern"
      - "Eintrittspforten beobachten: Einstichstellen, Wunden, Katheter"
      - "Händehygiene und aseptischer Umgang mit Zugängen und Kathetern"
    beratung: ["Angehörige über Warnzeichen informieren", "Impfungen (Pneumokokken, Grippe) senken das Risiko", "Nach der Entlassung Folgen wie Erschöpfung ernst nehmen und Reha nutzen"]
    prophylaxen:
      - { topicId: thema.pro.pneumonie, grund: "Pneumonie ist der häufigste Ausgangspunkt" }
      - { topicId: thema.pro.zystitis, grund: "Harnwegsinfekte können zur Urosepsis führen" }
      - { topicId: thema.pro.dekubitus, grund: "Schlechte Durchblutung im Schock gefährdet die Haut" }
    merksatz: "Sepsis ist ein Notfall wie Herzinfarkt und Schlaganfall: Zeit ist Leben."
    drugIds: [arz.amoxicillin, arz.paracetamol]
    assessmentIds: [as.news, as.gcs]
    topicIds: [thema.kl.infektion]
    pruefstatus: ungeprueft

  # ---------------------------------------------------------------- Geriatrie und Bewegung
  - id: kh.delir
    name: Delir
    synonyms: [akuter Verwirrtheitszustand, Durchgangssyndrom]
    definition: "Akut auftretende Störung von Aufmerksamkeit, Bewusstsein und Denken, die im Tagesverlauf schwankt. Ein Delir hat immer eine körperliche Ursache und ist ein medizinischer Notfall, keine normale Alterserscheinung."
    formen:
      - "Hyperaktiv: unruhig, nestelt, will weglaufen, wehrt sich, Halluzinationen"
      - "Hypoaktiv: still, schläfrig, zurückgezogen; wird am häufigsten übersehen"
      - "Gemischt: Wechsel zwischen beiden Formen"
    ursachen:
      - "Infektionen (Harnwegsinfekt, Pneumonie)"
      - "Flüssigkeitsmangel, Elektrolytstörungen, Unterzuckerung"
      - "Medikamente, z. B. Benzodiazepine, Opioide, anticholinerg wirkende Mittel"
      - "Operationen und Narkose, Schmerzen"
      - "Harnverhalt, Obstipation, Sauerstoffmangel"
      - "Alkohol- oder Medikamentenentzug"
    risikofaktoren: ["Hohes Alter, Demenz", "Seh- und Hörminderung", "Mehrere Medikamente", "Schwere Erkrankung, Gebrechlichkeit", "Fremde Umgebung, Schlafmangel, Fixierung, Blasenkatheter"]
    symptome:
      - "Plötzlicher Beginn innerhalb von Stunden bis Tagen"
      - "Aufmerksamkeitsstörung: kann einem Gespräch nicht folgen"
      - "Desorientierung, Gedächtnisstörung, verworrenes Denken"
      - "Schwankender Verlauf, oft nachts schlechter, gestörter Tag-Nacht-Rhythmus"
      - "Unruhe oder Antriebsarmut, Angst, Halluzinationen"
    komplikationen: ["Stürze, Verletzungen, Herausziehen von Zugängen", "Längerer Krankenhausaufenthalt, Pflegebedürftigkeit", "Höhere Sterblichkeit", "Bleibende kognitive Einbußen"]
    diagnostik:
      - "Screening, z. B. mit 4AT oder CAM (Confusion Assessment Method)"
      - "Abgrenzung zur Demenz: Delir beginnt akut und schwankt, Demenz entwickelt sich schleichend"
      - "Ursachensuche: Vitalzeichen, Blutzucker, Urin, Labor, Medikamentenliste, Ausscheidung"
    therapie: ["Ursache behandeln", "Auslösende Medikamente nach ärztlicher Prüfung absetzen", "Medikamente gegen Unruhe nur nach ärztlicher Anordnung und so kurz wie möglich"]
    pflege:
      - "Veränderung sofort melden und beschreiben: seit wann, wie, im Vergleich zu vorher"
      - "Orientierung geben: Uhr, Kalender, Tageslicht, sich mit Namen vorstellen, kurze klare Sätze"
      - "Brille und Hörgerät aufsetzen, vertraute Gegenstände, möglichst gleiche Pflegepersonen"
      - "Angehörige einbeziehen, Besuche ermöglichen"
      - "Tag-Nacht-Rhythmus fördern: tagsüber aktivieren, nachts Ruhe und gedämpftes Licht"
      - "Trinken, Ausscheidung und Schmerzen beobachten, früh mobilisieren"
      - "Freiheitsentziehende Maßnahmen vermeiden; Sturzrisiko anders reduzieren"
    beratung: ["Angehörige über Ursachen und Verlauf aufklären: Der Mensch ist nicht „verrückt geworden“", "Vor geplanten Operationen auf Delirrisiko hinweisen, Brille und Hörgerät mitbringen"]
    prophylaxen:
      - { topicId: thema.pro.delir, grund: "Viele Delirien lassen sich durch Orientierung, Trinken, Mobilisation und Schlaf verhindern" }
      - { topicId: thema.pro.dehydratation, grund: "Flüssigkeitsmangel ist ein häufiger Auslöser" }
      - { topicId: thema.pro.sturz, grund: "Unruhe und Desorientierung erhöhen das Sturzrisiko" }
      - { topicId: thema.pro.obstipation, grund: "Obstipation und Harnverhalt können ein Delir auslösen" }
    merksatz: "Delir: plötzlich, schwankend, unaufmerksam. Immer nach der Ursache suchen."
    drugIds: [arz.haloperidol, arz.melperon, arz.lorazepam]
    assessmentIds: [as.mmst, as.gcs]
    referenceIds: [es.demenz, es.sturz]
    topicIds: [thema.kl.demenz, thema.pro.delir]
    pruefstatus: ungeprueft

  - id: kh.femurfraktur
    name: Proximale Femurfraktur
    synonyms: [Oberschenkelhalsfraktur, Schenkelhalsfraktur, hüftnahe Fraktur, pertrochantäre Fraktur]
    definition: "Bruch des Oberschenkelknochens nahe dem Hüftgelenk, meist am Schenkelhals oder zwischen den Rollhügeln. Typische Verletzung alter Menschen nach einem Sturz, oft bei Osteoporose."
    formen:
      - "Schenkelhalsfraktur: Bruch innerhalb oder nahe der Gelenkkapsel"
      - "Pertrochantäre Fraktur: Bruch im Bereich der Rollhügel"
    ursachen: ["Sturz auf die Hüfte, meist aus dem Stand", "Verminderte Knochendichte (Osteoporose)"]
    risikofaktoren: ["Hohes Alter, Osteoporose", "Sturzrisiko: Gangunsicherheit, Schwindel, Sehminderung, Demenz", "Sturzfördernde Medikamente, z. B. Schlafmittel und Blutdrucksenker", "Untergewicht, Bewegungsmangel"]
    symptome:
      - "Schmerzen in der Leiste oder Hüfte, Bein kann nicht belastet werden"
      - "Bein verkürzt und nach außen gedreht"
      - "Bluterguss, Schwellung"
      - "Bei eingestauchter Fraktur manchmal noch gehfähig: Schmerz nach Sturz immer abklären lassen"
    komplikationen:
      - "Blutverlust, Kreislaufprobleme"
      - "Thrombose, Lungenembolie, Pneumonie, Dekubitus durch Immobilität"
      - "Delir nach Sturz und Operation"
      - "Nach Endoprothese: Luxation, Wundinfektion"
      - "Hüftkopfnekrose nach gelenkerhaltender Operation"
      - "Verlust der Selbstständigkeit, erneute Stürze"
    diagnostik: ["Röntgen von Becken und Hüfte, ggf. CT", "Labor und Gerinnung zur OP-Vorbereitung"]
    therapie:
      - "Meist zeitnahe Operation (möglichst innerhalb von 24 Stunden)"
      - "Endoprothese (Hemi- oder Totalendoprothese) oder Osteosynthese mit Nagel oder Schrauben"
      - "Schmerztherapie, Thromboseprophylaxe und Osteoporosebehandlung nach Anordnung"
      - "Alterstraumatologische Frührehabilitation"
    pflege:
      - "Schmerz regelmäßig einschätzen (NRS oder BESD) und Schmerzmittel nach Anordnung rechtzeitig vor der Mobilisation geben"
      - "Frühmobilisation ab dem ersten Tag nach der OP nach ärztlicher Anordnung und Belastungsvorgabe, mit Physiotherapie"
      - "Bewegungseinschränkungen nach Vorgabe der Operateurin einhalten (Luxationsprophylaxe bei Endoprothese)"
      - "Wunde, Verband und Drainage beobachten, Durchblutung, Motorik und Sensibilität des Beins kontrollieren"
      - "Vitalzeichen, Ausscheidung und Bewusstsein beobachten (Blutverlust, Delir)"
      - "Sturzursachen klären und sichere Umgebung schaffen"
    beratung: ["Gehhilfen sicher nutzen, Bewegungseinschränkungen im Alltag umsetzen", "Wohnung sturzsicher machen, Hüftprotektoren erwägen", "Osteoporose behandeln: Bewegung, Kalzium und Vitamin D nach ärztlicher Anordnung"]
    prophylaxen:
      - { topicId: thema.pro.thrombose, grund: "Immobilität und Operation an der unteren Extremität" }
      - { topicId: thema.pro.sturz, grund: "Der nächste Sturz ist das größte Risiko" }
      - { topicId: thema.pro.dekubitus, grund: "Schmerzbedingte Immobilität, Fersen und Kreuzbein gefährdet" }
      - { topicId: thema.pro.pneumonie, grund: "Bettlägerigkeit und flache Atmung" }
      - { topicId: thema.pro.delir, grund: "Häufige Komplikation nach Sturz und Operation" }
    merksatz: "Sturz, Leistenschmerz, Bein kurz und außenrotiert: an eine Schenkelhalsfraktur denken."
    drugIds: [arz.metamizol, arz.enoxaparin, arz.alendronsaeure]
    assessmentIds: [as.nrs, as.besd, as.tug, as.braden]
    referenceIds: [es.sturz, es.mobilitaet, es.schmerz]
    topicIds: [thema.kl.bewegung]
    pruefstatus: ungeprueft
