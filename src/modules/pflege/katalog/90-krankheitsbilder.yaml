    risikofaktoren: ["Diabetes und Bluthochdruck", "Höheres Alter", "Regelmäßige Einnahme von Schmerzmitteln wie NSAR", "Herzinsuffizienz"]
    symptome:
      - "Lange beschwerdefrei"
      - "Ödeme, Bluthochdruck, Gewichtszunahme"
      - "Müdigkeit, Leistungsabfall, Blässe durch renale Anämie"
      - "Urämie im Spätstadium: Juckreiz, Übelkeit, Appetitlosigkeit, Uringeruch der Atemluft, Verwirrtheit"
      - "Veränderte Urinmenge, schaumiger Urin"
    komplikationen:
      - "Hyperkaliämie mit Herzrhythmusstörungen"
      - "Überwässerung mit Lungenödem"
      - "Renale Anämie, Knochenstoffwechselstörung"
      - "Herz-Kreislauf-Erkrankungen"
    diagnostik: ["Kreatinin, Harnstoff, GFR, Kalium", "Urinuntersuchung auf Eiweiß", "Ultraschall der Nieren", "Blutdruck und Gewicht im Verlauf"]
    therapie:
      - "Grunderkrankung behandeln: Blutzucker und Blutdruck einstellen"
      - "Nierenschädigende Medikamente meiden, Dosierungen an die Nierenfunktion anpassen"
      - "Diuretika, Behandlung von Anämie und Knochenstoffwechsel nach Anordnung"
      - "Nierenersatztherapie: Hämodialyse, Peritonealdialyse, Nierentransplantation"
    pflege:
      - "Täglich wiegen, Ein- und Ausfuhr bilanzieren, verordnete Trinkmenge einhalten"
      - "Ödeme, Atmung und Blutdruck beobachten"
      - "Am Shuntarm kein Blutdruck messen, keine Blutentnahme, keine Infusion, nichts Einschnürendes; Shunt täglich auf Schwirren prüfen"
      - "Hautpflege bei Juckreiz, rückfettende Pflege, Nägel kurz halten"
      - "Ernährung nach ärztlicher und diätetischer Vorgabe: kaliumarm, phosphatarm, angepasste Eiweiß- und Salzmenge"
      - "Mundpflege bei Urämie und Durst, Durst lindern z. B. mit Eiswürfeln aus der erlaubten Menge"
      - "Nach der Dialyse Kreislauf, Punktionsstelle und Gewicht kontrollieren"
    beratung:
      - "Trinkmenge und Diät im Alltag umsetzen; kaliumreiche Lebensmittel wie Bananen, Trockenobst oder Kartoffeln kennen"
      - "Shuntarm schützen"
      - "Keine Schmerzmittel ohne Rücksprache (besonders NSAR)"
      - "Gewicht täglich messen und Zunahme melden"
    prophylaxen:
      - { topicId: thema.pro.dekubitus, grund: "Ödeme und Anämie machen die Haut verletzlich" }
      - { topicId: thema.pro.soor, grund: "Eingeschränkte Trinkmenge und Urämie trocknen die Mundschleimhaut aus" }
    merksatz: "Shuntarm ist tabu: kein Blutdruck, keine Nadel, nichts Enges."
    drugIds: [arz.furosemid, arz.ramipril]
    topicIds: [thema.kl.niere]
    pruefstatus: ungeprueft

  - id: kh.leberzirrhose
    name: Leberzirrhose
    synonyms: [Schrumpfleber, Zirrhose]
    definition: "Endstadium chronischer Lebererkrankungen: Leberzellen gehen zugrunde und werden durch Bindegewebe ersetzt. Die Leber verliert ihre Funktion, und das Blut staut sich vor der Leber in der Pfortader (portale Hypertension)."
    formen:
      - "Kompensiert: Leber erfüllt ihre Aufgaben noch weitgehend"
      - "Dekompensiert: Aszites, Gelbsucht, Blutungen oder Verwirrtheit treten auf"
      - "Schweregrad nach Child-Pugh A bis C"
    ursachen: ["Langjähriger Alkoholkonsum (häufigste Ursache in Deutschland)", "Fettleber durch Übergewicht und Diabetes", "Chronische Virushepatitis B oder C", "Seltener Autoimmun- oder Stoffwechselerkrankungen"]
    risikofaktoren: ["Alkohol", "Übergewicht, Diabetes", "Hepatitis-Infektion"]
    symptome:
      - "Müdigkeit, Leistungsabfall, Appetitlosigkeit, Gewichtsabnahme"
      - "Leberhautzeichen: Gefäßsternchen (Spider naevi), gerötete Handflächen, Lacklippen"
      - "Gelbsucht (Ikterus), Juckreiz"
      - "Aszites (Bauchwasser), Ödeme"
      - "Blutungsneigung: Hämatome, Zahnfleisch- und Nasenbluten"
      - "Bei Männern Brustvergrößerung und Verlust der Bauchbehaarung"
    komplikationen:
      - "Ösophagusvarizenblutung: Erbrechen von Blut, Teerstuhl, Schock; Notfall"
      - "Hepatische Enzephalopathie: Schläfrigkeit, Verwirrtheit, Händezittern (Flapping Tremor) bis Koma"
      - "Spontan bakterielle Peritonitis bei Aszites"
      - "Leberkrebs, Nierenversagen"
    diagnostik: ["Labor: Leberwerte, Bilirubin, Albumin, Gerinnung (Quick/INR), Ammoniak", "Ultraschall, Elastografie", "Magenspiegelung zur Suche nach Varizen"]
    therapie:
      - "Ursache behandeln: völliger Alkoholverzicht, Hepatitis-Therapie"
      - "Aszites: Diuretika (z. B. Spironolacton), Kochsalz reduzieren, ggf. Aszitespunktion"
      - "Hepatische Enzephalopathie: Lactulose nach Anordnung"
      - "Varizen: Betablocker, Gummibandligatur"
      - "Lebertransplantation als letzte Möglichkeit"
    pflege:
      - "Täglich wiegen und Bauchumfang an gleicher Stelle messen, Ein- und Ausfuhr bilanzieren"
      - "Bewusstsein, Orientierung und Schrift beobachten (frühe Enzephalopathie)"
      - "Stuhl beobachten: regelmäßige Entleerung fördern, auf Teerstuhl achten"
      - "Blutungszeichen beobachten, Verletzungen vermeiden: weiche Zahnbürste, elektrischer Rasierer"
      - "Hautpflege bei Juckreiz und Ödemen, Druckstellen vermeiden"
      - "Atemerleichternde Lagerung bei großem Aszites"
      - "Bei Bluterbrechen: Notruf, Oberkörper hoch bzw. Seitenlage, Vitalzeichen, nicht allein lassen"
    beratung:
      - "Kein Alkohol, auch nicht in kleinen Mengen"
      - "Keine Medikamente ohne Rücksprache, besonders keine NSAR und Schlafmittel"
      - "Ausreichend Eiweiß und Energie, mehrere kleine Mahlzeiten und eine Spätmahlzeit"
      - "Warnzeichen kennen: Verwirrtheit, Blut im Stuhl oder Erbrochenen, zunehmender Bauchumfang"
    prophylaxen:
      - { topicId: thema.pro.obstipation, grund: "Verstopfung fördert die hepatische Enzephalopathie" }
      - { topicId: thema.pro.dekubitus, grund: "Ödeme, Mangelernährung und Immobilität" }
      - { topicId: thema.pro.dehydratation, grund: "Mangelernährung ist häufig, Diuretika verändern den Flüssigkeitshaushalt" }
    merksatz: "Zirrhose: Bauch messen, Kopf beobachten, Stuhl kontrollieren."
    drugIds: [arz.spironolacton, arz.lactulose, arz.furosemid]
    topicIds: [thema.kl.verdauung]
    pruefstatus: ungeprueft

  - id: kh.kolorektales-karzinom
    name: Kolorektales Karzinom
    synonyms: [Darmkrebs, Kolonkarzinom, Rektumkarzinom, Stoma]
    definition: "Bösartiger Tumor des Dickdarms (Kolon) oder Mastdarms (Rektum). Er entsteht meist über Jahre aus gutartigen Polypen und gehört zu den häufigsten Krebserkrankungen."
    formen:
      - "Kolonkarzinom und Rektumkarzinom"
      - "Einteilung nach TNM (Tumorgröße, Lymphknoten, Metastasen) und UICC-Stadien"
    ursachen: ["Entartung von Darmpolypen (Adenom-Karzinom-Sequenz)", "Erbliche Formen in wenigen Fällen"]
    risikofaktoren: ["Alter über 50 Jahre", "Darmkrebs in der Familie", "Chronisch-entzündliche Darmerkrankungen", "Rotes und verarbeitetes Fleisch, ballaststoffarme Ernährung, Übergewicht, Bewegungsmangel", "Rauchen, Alkohol"]
    symptome:
      - "Lange beschwerdefrei"
      - "Blut im Stuhl, veränderte Stuhlgewohnheiten (Wechsel von Durchfall und Verstopfung)"
      - "Bleistiftstuhl, Bauchschmerzen, Blähungen"
      - "Müdigkeit und Blässe durch Blutarmut, ungewollte Gewichtsabnahme"
    komplikationen: ["Darmverschluss (Ileus)", "Blutung, Darmdurchbruch", "Metastasen, besonders in Leber und Lunge", "Nach Operation: Anastomoseninsuffizienz, Stomakomplikationen"]
    diagnostik: ["Darmspiegelung (Koloskopie) mit Gewebeprobe", "Test auf Blut im Stuhl als Vorsorge", "CT, Ultraschall der Leber, Tumormarker CEA zur Verlaufskontrolle"]
    therapie:
      - "Operation mit Entfernung des Tumors und der Lymphknoten, ggf. Anlage eines Stomas (vorübergehend oder dauerhaft)"
      - "Chemotherapie, beim Rektumkarzinom oft Radiochemotherapie vor der Operation"
      - "Zielgerichtete Therapien je nach Tumoreigenschaften"
      - "In der palliativen Situation Linderung der Beschwerden"
    pflege:
      - "Prä- und postoperative Pflege nach Standard; Frühmobilisation, Schmerzmanagement"
      - "Stoma beobachten: Farbe (rosig-rot, feucht), Größe, Ausscheidung, Haut um das Stoma"
      - "Stomaversorgung fachgerecht wechseln, Basisplatte passgenau zuschneiden, Haut schützen"
      - "Bei Chemotherapie: Übelkeit, Mundschleimhaut, Infektzeichen, Fieber und Blutungszeichen beobachten"
      - "Hygiene bei Neutropenie besonders sorgfältig"
      - "Körperbild und Gefühle ansprechen, Gesprächsbereitschaft zeigen, Angehörige einbeziehen"
      - "Ernährung und Gewicht im Blick behalten"
    beratung:
      - "Stomaversorgung selbstständig anleiten, Kontakt zur Stomatherapie und Selbsthilfe (z. B. Deutsche ILCO) vermitteln"
      - "Ernährung mit Stoma: gut kauen, blähende Speisen testen, bei Ileostoma viel trinken"
      - "Darmkrebsvorsorge: Koloskopie und Stuhltest nach Altersempfehlung"
      - "Fieber unter Chemotherapie sofort melden"
    prophylaxen:
      - { topicId: thema.pro.thrombose, grund: "Tumorerkrankung und Operation erhöhen das Thromboserisiko" }
      - { topicId: thema.pro.pneumonie, grund: "Schonatmung nach Bauchoperation" }
      - { topicId: thema.pro.soor, grund: "Chemotherapie schädigt die Mundschleimhaut" }
      - { topicId: thema.pro.dehydratation, grund: "Übelkeit, Durchfall und hohe Ausscheidung über ein Ileostoma" }
    merksatz: "Stoma gesund: rosig, feucht, glänzend. Dunkel oder blass: sofort melden."
    drugIds: [arz.ondansetron, arz.metoclopramid, arz.morphin, arz.enoxaparin]
    assessmentIds: [as.nrs, as.mna]
    referenceIds: [es.schmerz, es.ernaehrung]
    topicIds: [thema.kl.onko, thema.ph.periop]
    pruefstatus: ungeprueft

  # ---------------------------------------------------------------- Kinder und Jugendliche
  - id: kh.fieberkrampf
    name: Fieberkrampf
    synonyms: [Fieberkrampfanfall, Infektkrampf]
    definition: "Epileptischer Anfall bei Kindern, ausgelöst durch Fieber, ohne Infektion des Gehirns. Er tritt typischerweise zwischen 6 Monaten und 5 Jahren auf und ist meist harmlos."
    formen:
      - "Einfacher Fieberkrampf: generalisiert, kürzer als 15 Minuten, nur einmal in 24 Stunden"
      - "Komplizierter Fieberkrampf: fokal, länger als 15 Minuten oder mehrfach in 24 Stunden"
    ursachen: ["Fieber, meist bei Virusinfekten der oberen Atemwege oder des Mittelohrs", "Altersbedingt erhöhte Krampfbereitschaft des Gehirns, familiäre Veranlagung"]
    risikofaktoren: ["Alter zwischen 6 Monaten und 5 Jahren", "Fieberkrämpfe bei Eltern oder Geschwistern", "Früherer Fieberkrampf"]
    symptome:
      - "Plötzliche Bewusstlosigkeit, Verdrehen der Augen"
      - "Steifwerden und rhythmisches Zucken von Armen und Beinen"
      - "Blaue Lippen, unregelmäßige Atmung"
      - "Danach Schläfrigkeit und Müdigkeit"
    komplikationen: ["Status epilepticus bei langem Anfall", "Verletzungen, Aspiration", "Erneute Fieberkrämpfe bei weiteren Infekten (bei etwa einem Drittel)", "Dahinter kann eine Hirnhautentzündung stecken: muss ärztlich ausgeschlossen werden"]
    diagnostik: ["Ärztliche Untersuchung und Suche nach dem Infekt", "Ausschluss einer Meningitis (Nackensteifigkeit, Bewusstseinslage), ggf. Lumbalpunktion", "EEG nur bei kompliziertem Fieberkrampf"]
    therapie:
      - "Anfall dauert meist nur wenige Minuten und hört von selbst auf"
      - "Anfall über 3 bis 5 Minuten: Notfallmedikament (Benzodiazepin, z. B. rektal oder in die Wangentasche) nach ärztlicher Verordnung"
      - "Fiebersenkung zur Linderung des Unwohlseins; sie verhindert Fieberkrämpfe nach heutigem Wissen nicht sicher"
      - "Behandlung des auslösenden Infekts"
    pflege:
      - "Ruhe bewahren, Kind nicht allein lassen, Uhrzeit notieren"
      - "Verletzungen verhindern, Kind nicht festhalten, nichts in den Mund geben"
      - "Nach dem Anfall stabile Seitenlage, Atmung und Hautfarbe beobachten"
      - "Notruf beim ersten Fieberkrampf, bei Anfall über 5 Minuten oder wenn das Kind nicht aufwacht"
      - "Temperatur messen, Kind leicht bekleiden, ausreichend trinken lassen"
      - "Eltern beruhigen und einbeziehen, Anfallsablauf genau dokumentieren"
    beratung:
      - "Eltern über Ablauf, gute Prognose und Erste Hilfe beim Anfall informieren"
      - "Umgang mit dem Notfallmedikament anleiten, falls verordnet"
      - "Fieber messen und Flüssigkeit anbieten; fiebersenkende Mittel lindern Beschwerden, schützen aber nicht sicher vor einem Krampf"
    prophylaxen:
      - { topicId: thema.pro.aspiration, grund: "Speichel und Erbrochenes während und nach dem Anfall" }
      - { topicId: thema.pro.dehydratation, grund: "Fieber erhöht den Flüssigkeitsbedarf" }
    merksatz: "Fieberkrampf: meist kurz und harmlos. Schützen, Zeit messen, Seitenlage, beim ersten Mal immer ärztlich abklären."
    drugIds: [arz.paracetamol, arz.ibuprofen]
    topicIds: [thema.kl.paediatrie]
    pruefstatus: ungeprueft

  - id: kh.pseudokrupp
    name: Pseudokrupp
    synonyms: [Krupp-Syndrom, subglottische Laryngitis, Laryngotracheitis]
    definition: "Virusbedingte Entzündung des Kehlkopfs und der Luftröhre unterhalb der Stimmbänder bei Kleinkindern. Die Schleimhaut schwillt an und verengt die Atemwege. Typisch sind nächtliche Anfälle mit bellendem Husten."
    formen:
      - "Leicht: bellender Husten, Heiserkeit, Stridor nur bei Aufregung"
      - "Mittel bis schwer: Stridor in Ruhe, Einziehungen, Unruhe"
      - "Lebensbedrohlich: Zyanose, Erschöpfung, Bewusstseinsstörung"
    ursachen: ["Viren, meist Parainfluenzaviren, auch RS- oder Influenzaviren", "Enge Atemwege im Kleinkindalter"]
    risikofaktoren: ["Alter 6 Monate bis 3 Jahre", "Herbst und Winter", "Passivrauchen, Luftverschmutzung"]
    symptome:
      - "Bellender Husten (wie ein Seehund), Heiserkeit"
      - "Pfeifendes Einatemgeräusch (inspiratorischer Stridor)"
      - "Atemnot, Einziehungen am Hals und Brustkorb"
      - "Meist abends oder nachts, oft nach einem Schnupfen, leichtes Fieber"
      - "Unruhe und Angst, die die Atemnot verstärken"
    komplikationen: ["Hochgradige Atemwegsverengung mit Sauerstoffmangel", "Abzugrenzen: Epiglottitis (hohes Fieber, kloßige Sprache, Speichelfluss, Kind will sitzen): lebensbedrohlicher Notfall, Rachen nicht inspizieren"]
    diagnostik: ["Klinisches Bild, Atemfrequenz, Sättigung", "Einschätzung des Schweregrads mit einem Krupp-Score"]
    therapie:
      - "Kortison (z. B. als Zäpfchen oder Saft) nach ärztlicher Verordnung, wirkt abschwellend"
      - "Bei schwerer Atemnot inhalatives Adrenalin in der Klinik"
      - "Sauerstoff bei niedriger Sättigung"
    pflege:
      - "Kind und Eltern beruhigen: Aufregung verstärkt die Atemnot; Kind auf den Arm der Eltern"
      - "Aufrechte Haltung, Kind nicht zwingen sich hinzulegen"
      - "Frische, kühle Luft anbieten (z. B. am offenen Fenster)"
      - "Atemfrequenz, Einziehungen, Stridor, Hautfarbe und Sättigung beobachten"
      - "Schmerzhafte oder beängstigende Maßnahmen nur, wenn nötig"
      - "Ausreichend trinken lassen"
      - "Zeichen einer Verschlechterung sofort melden"
    beratung:
      - "Eltern über Erste Hilfe zu Hause informieren: beruhigen, aufrecht halten, kühle Luft"
      - "Notruf bei Atemnot in Ruhe, blauen Lippen, starker Unruhe oder Erschöpfung"
      - "Verordnetes Kortison im Notfall bereithalten, Rauchfreiheit in der Wohnung"
    prophylaxen:
      - { topicId: thema.pro.dehydratation, grund: "Kleinkinder trinken bei Atemnot und Fieber zu wenig" }
    merksatz: "Bellender Husten, Stridor, nachts: Pseudokrupp. Beruhigen ist die wichtigste Maßnahme."
    drugIds: [arz.prednisolon, arz.epinephrin]
    topicIds: [thema.kl.paediatrie]
    pruefstatus: ungeprueft

  # ---------------------------------------------------------------- Bewegungsapparat
  - id: kh.osteoporose
    name: Osteoporose
    synonyms: [Knochenschwund]
    definition: "Systemerkrankung des Skeletts mit verminderter Knochenmasse und gestörter Knochenstruktur. Die Knochen werden brüchig, sodass schon bei geringen Belastungen Frakturen entstehen."
    formen:
      - "Primäre Osteoporose: postmenopausal bei Frauen oder altersbedingt"
      - "Sekundäre Osteoporose: als Folge von Erkrankungen oder Medikamenten (z. B. Langzeit-Kortison)"
    ursachen: ["Ungleichgewicht zwischen Knochenaufbau und -abbau", "Östrogenmangel nach den Wechseljahren", "Alter"]
    risikofaktoren: ["Weibliches Geschlecht, Wechseljahre", "Höheres Alter, Bewegungsmangel", "Untergewicht, Kalzium- und Vitamin-D-Mangel", "Langzeittherapie mit Kortison", "Rauchen, Alkohol", "Osteoporose in der Familie"]
    symptome:
      - "Lange beschwerdefrei"
      - "Knochenbrüche nach geringem Trauma: Wirbelkörper, Oberschenkelhals, Handgelenk, Oberarm"
      - "Rückenschmerzen durch Wirbelkörpereinbrüche"
      - "Abnahme der Körpergröße, Rundrücken (Witwenbuckel), Tannenbaumphänomen der Rückenhaut"
    komplikationen: ["Proximale Femurfraktur nach Sturz", "Chronische Schmerzen", "Verlust der Selbstständigkeit, Pflegebedürftigkeit", "Angst vor Stürzen, Rückzug"]
    diagnostik: ["Knochendichtemessung (DXA)", "Röntgen bei Verdacht auf Fraktur", "Labor zum Ausschluss anderer Ursachen", "Einschätzung des Sturz- und Frakturrisikos"]
    therapie:
      - "Bewegung, Muskeltraining, Sturzprophylaxe"
      - "Kalzium über die Ernährung und Vitamin D nach ärztlicher Anordnung"
      - "Medikamente nach Anordnung, z. B. Bisphosphonate (Alendronsäure)"
      - "Schmerztherapie"
    pflege:
      - "Sturzrisiko einschätzen und Umgebung sicher gestalten"
      - "Mobilität fördern, zu Bewegung motivieren, Hilfsmittel einsetzen"
      - "Vorsichtiges Bewegen und Lagern, keine ruckartigen Bewegungen"
      - "Schmerzen regelmäßig einschätzen und Schmerzmittel nach Anordnung geben"
      - "Einnahme von Alendronsäure begleiten: morgens nüchtern, mit einem großen Glas Leitungswasser, aufrecht bleiben"
      - "Ernährung mit ausreichend Kalzium und Eiweiß unterstützen"
    beratung:
      - "Kalziumreiche Ernährung (Milchprodukte, grünes Gemüse, kalziumreiches Mineralwasser)"
      - "Regelmäßige Bewegung und Aufenthalt im Freien (Vitamin-D-Bildung)"
      - "Wohnung sturzsicher gestalten, Hüftprotektoren erwägen"
      - "Nicht rauchen, wenig Alkohol"
    prophylaxen:
      - { topicId: thema.pro.sturz, grund: "Jeder Sturz kann zu einer Fraktur führen" }
      - { topicId: thema.pro.kontraktur, grund: "Schmerzbedingte Schonhaltung und Bewegungsmangel" }
    merksatz: "Osteoporose: Knochen stärken, Stürze verhindern."
    drugIds: [arz.alendronsaeure, arz.colecalciferol]
    assessmentIds: [as.tug]
    referenceIds: [es.sturz, es.mobilitaet]
    topicIds: [thema.kl.bewegung, thema.kl.geriatrie]
    pruefstatus: ungeprueft
