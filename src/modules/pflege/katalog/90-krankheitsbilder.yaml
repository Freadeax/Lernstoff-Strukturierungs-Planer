      - "Sturz- und Krampfanfallgefahr beachten"
      - "Flüssigkeit, Ernährung und Elektrolyte im Blick behalten, Schwitzen und Fieber beobachten"
      - "Kein Alkohol auf Station; Mitbringen durch Besucher ansprechen"
    beratung:
