      - "Medikamente gegen Entzugssymptome nach ärztlicher Anordnung, z. B. Benzodiazepine oder Clomethiazol"
      - "Vitamin B1 (Thiamin) nach Anordnung, vor Glukosegabe"
      - "Danach Entwöhnungsbehandlung, Selbsthilfegruppen, Suchtberatung"
