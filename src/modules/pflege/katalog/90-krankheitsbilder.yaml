      - "Selbst- und Fremdgefährdung einschätzen, eigene Sicherheit beachten, im Team Hilfe holen"
      - "Medikamenteneinnahme begleiten, Nebenwirkungen beobachten: Bewegungsstörungen, Sitzunruhe, Müdigkeit, Gewichtszunahme"
