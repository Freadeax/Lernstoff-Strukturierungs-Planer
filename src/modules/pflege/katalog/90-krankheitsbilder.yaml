      - "Hoffnungslosigkeit, Suizidgedanken"
      - "Schlafstörungen mit Früherwachen, Morgentief"
      - "Appetitverlust, Gewichtsabnahme, Libidoverlust"
      - "Körperliche Beschwerden ohne passenden Befund"
    komplikationen: ["Suizid: das größte Risiko", "Vernachlässigung von Ernährung, Körperpflege und Medikamenten", "Sozialer Rückzug, Chronifizierung"]
    diagnostik: ["Gespräch und Erhebung der Symptome nach ICD-10/ICD-11", "Fragebögen, z. B. Geriatrische Depressionsskala (GDS) im Alter", "Suizidalität immer direkt erfragen", "Körperliche Ursachen ausschließen (z. B. Schilddrüse)"]
    therapie:
      - "Psychotherapie, z. B. kognitive Verhaltenstherapie"
      - "Antidepressiva nach ärztlicher Anordnung; Wirkung oft erst nach 2 bis 4 Wochen"
      - "Bewegung, Tagesstruktur, Lichttherapie; bei schwerer Depression ggf. weitere Verfahren"
    pflege:
      - "Beziehung aufbauen: Zeit nehmen, zuhören, Gefühle ernst nehmen, nicht bagatellisieren"
      - "Keine Aufmunterungen wie „Reiß dich zusammen“ oder „Kopf hoch“"
      - "Suizidalität beobachten und offen ansprechen; Hinweise sofort weitergeben"
      - "Tagesstruktur geben, kleine erreichbare Ziele, Aktivitäten ohne Überforderung"
      - "Ernährung, Trinkmenge, Schlaf, Ausscheidung und Körperpflege beobachten und unterstützen"
      - "Medikamenteneinnahme kontrollieren, Nebenwirkungen beobachten"
      - "Erfolge anerkennen, Entscheidungen nicht abnehmen, aber kleine Wahlmöglichkeiten anbieten"
    beratung:
      - "Depression ist eine Krankheit und kein persönliches Versagen"
      - "Antidepressiva machen nicht abhängig, die Wirkung braucht Zeit; nicht eigenmächtig absetzen"
      - "Angehörige über Warnzeichen für Suizid informieren"
      - "Hilfsangebote: Krisendienst, Telefonseelsorge, Selbsthilfe"
    prophylaxen:
      - { topicId: thema.pro.dehydratation, grund: "Appetit- und Antriebsmangel führen zu wenig Essen und Trinken" }
      - { topicId: thema.pro.obstipation, grund: "Bewegungsmangel und manche Antidepressiva" }
      - { topicId: thema.pro.deprivation, grund: "Sozialer Rückzug und Einsamkeit verstärken die Depression" }
