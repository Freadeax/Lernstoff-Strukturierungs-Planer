      - "Abhängigkeit: mindestens drei Kriterien wie Verlangen, Kontrollverlust, Toleranz, Entzugssymptome, Vernachlässigung anderer Interessen, Weitertrinken trotz Schäden"
      - "Entzugssyndrom und als schwerste Form Delirium tremens"
