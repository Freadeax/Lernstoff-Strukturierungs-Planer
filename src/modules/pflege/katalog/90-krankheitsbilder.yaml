      - "Leberzirrhose, Pankreatitis, Ösophagusvarizenblutung"
    diagnostik: ["Konsum offen und wertfrei erfragen, z. B. mit dem AUDIT-Fragebogen", "Atemalkohol, Laborwerte (Leberwerte, Blutbild)", "Entzugssymptome mit einer Skala einschätzen"]
    therapie:
