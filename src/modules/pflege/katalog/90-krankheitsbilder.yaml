      - "Hilfsangebote: Suchtberatungsstelle, Selbsthilfe (z. B. Anonyme Alkoholiker), Entwöhnungstherapie"
      - "Angehörige einbeziehen und auf eigene Hilfsangebote hinweisen"
    prophylaxen:
