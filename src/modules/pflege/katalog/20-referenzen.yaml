# Referenzen = fachneutrales Konzept für "Wissensobjekte mit eigener Identität":
# Rechtsnormen, Fachstandards, Assessmentinstrumente, Modelle, Klassifikationen.
# Themen verweisen per referenceIds darauf; die Qualitätskontrolle kann so prüfen,
# ob eine Zusammenfassung z. B. den richtigen Paragraphen nennt.
# pruefstatus: ungeprueft = aus Fachwissen, vor Prüfungsnutzung gegen Original prüfen.

references:
  # ---------- Rechtsnormen ----------
  - { id: norm.pflbg,   kind: norm, name: Pflegeberufegesetz (PflBG), pruefstatus: ungeprueft,
      details: "Regelt Ausbildung, Berufsbezeichnung und vorbehaltene Tätigkeiten (§ 4: Erhebung und Feststellung des Pflegebedarfs, Organisation, Gestaltung und Steuerung des Pflegeprozesses, Analyse, Evaluation, Sicherung und Entwicklung der Pflegequalität)." }
  - { id: norm.pflaprv, kind: norm, name: Pflegeberufe-Ausbildungs- und -Prüfungsverordnung (PflAPrV), pruefstatus: ungeprueft,
      details: "Ausbildungsstruktur, Zwischenprüfung, staatliche Prüfung (schriftlich, mündlich, praktisch), Kompetenzen in Anlagen 1-4." }
  - { id: norm.sgb5,    kind: norm, name: SGB V – Gesetzliche Krankenversicherung, pruefstatus: ungeprueft,
      details: "Leistungen der GKV, u. a. Krankenhausbehandlung, häusliche Krankenpflege (§ 37), Hilfsmittel, Entlassmanagement (§ 39 Abs. 1a)." }
  - { id: norm.sgb11,   kind: norm, name: SGB XI – Soziale Pflegeversicherung, pruefstatus: ungeprueft,
      details: "Pflegebedürftigkeit (§ 14), Pflegegrade und Begutachtungsinstrument (§ 15), Pflegesachleistung (§ 36), Pflegegeld (§ 37), Beratungsbesuch (§ 37 Abs. 3), Kombinationsleistung (§ 38), Verhinderungspflege (§ 39), Tages-/Nachtpflege (§ 41), Kurzzeitpflege (§ 42), vollstationäre Pflege (§ 43), Entlastungsbetrag (§ 45b), Expertenstandards (§ 113a), Qualitätsprüfungen (§ 114 ff.)." }
  - { id: norm.stgb203, kind: norm, name: "§ 203 StGB – Verletzung von Privatgeheimnissen (Schweigepflicht)", pruefstatus: ungeprueft }
  - { id: norm.dsgvo,   kind: norm, name: Datenschutz-Grundverordnung (DSGVO) und BDSG, pruefstatus: ungeprueft,
      details: "Gesundheitsdaten sind besondere Kategorien personenbezogener Daten (Art. 9 DSGVO)." }
  - { id: norm.bgb-betreuung, kind: norm, name: Betreuungsrecht im BGB (ab 2023 §§ 1814 ff. BGB), pruefstatus: ungeprueft,
      details: "Rechtliche Betreuung, Patientenverfügung (§ 1827 BGB), Vorsorgevollmacht, freiheitsentziehende Maßnahmen und Genehmigungspflicht (§ 1831 BGB). Ältere Lehrbücher nennen noch die alten Paragraphen (§§ 1896 ff., § 1901a, § 1906 BGB a. F.)." }
  - { id: norm.bgb-haftung, kind: norm, name: "Haftungsrecht (Vertragshaftung, § 823 BGB Deliktshaftung)", pruefstatus: ungeprueft }
  - { id: norm.stgb-koerperverletzung, kind: norm, name: "Strafrecht in der Pflege (§§ 223 ff. StGB Körperverletzung, § 239 Freiheitsberaubung, § 323c unterlassene Hilfeleistung)", pruefstatus: ungeprueft }
  - { id: norm.ifsg,    kind: norm, name: "Infektionsschutzgesetz (IfSG)", pruefstatus: ungeprueft }
  - { id: norm.arbzg,   kind: norm, name: "Arbeitsschutz (ArbSchG, ArbZG, MuSchG, JArbSchG)", pruefstatus: ungeprueft }
  - { id: norm.heimrecht, kind: norm, name: "Heimrecht der Länder und Wohn- und Betreuungsvertragsgesetz (WBVG)", pruefstatus: ungeprueft }
  - { id: norm.btmg,    kind: norm, name: "Betäubungsmittelgesetz (BtMG) und BtMVV", pruefstatus: ungeprueft }

