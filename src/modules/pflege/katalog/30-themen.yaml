# Themenbaum. Felder wie Topic im Kernvertrag (subjectId, parentId, prerequisites,
# difficulty 1-5, estimatedMinutes) plus Katalog-Erweiterungen:
#   competencyIds      -> Einträge aus frameworks (kb.*, ce.*)
#   referenceIds       -> Einträge aus references (norm.*, es.*, as.*, mo.*)
#   taskFormatIds      -> typische Aufgabenformate zu diesem Thema
#   tags               -> freie Schlagworte für Suche und automatische Zuordnung
# Build-Regeln (scripts/build-module.py): subjectId wird vom Elternthema geerbt, wenn es fehlt;
# prerequisites ist standardmäßig []. estimatedMinutes = Erstlernzeit, ohne Wiederholungen.
#
# Kompetenzbereiche (kb.*) werden an Unterthemen vererbt. Jedes Thema muss über sich oder ein
# Oberthema mindestens einem Kompetenzbereich nach Anlage 2 PflAPrV zugeordnet sein (Test in
# index.test.ts). Die Zuordnung ist eine fachliche Einschätzung des Katalogs, keine Vorgabe der
# PflAPrV, und folgt dem Handlungsbezug des Themas in der Prüfung:
#   Anatomie/Physiologie  -> I.2  Grundlage, um gesundheitliche Problemlagen einzuschätzen
#   Krankheitslehre       -> I.2, I.3  Pflege bei gesundheitlichen Problemlagen und kritischen Verläufen
#   Krankenbeobachtung    -> I.1, I.2  Pflegebedarf erheben, Pflegediagnostik
#   Pflegerische Maßnahmen -> I.1  Pflege durchführen; III.2 dort, wo ärztlich angeordnete
#                            Maßnahmen oder Hygiene/Infektionsschutz im Mittelpunkt stehen
#   Fachsprache           -> III.3  Verständigung und Dokumentation im interprofessionellen Team

